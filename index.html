const fmt  = (n,d=2) => typeof n==='number' ? n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}) : (n??'—');

const wrColor = r => r<.3?'#22c55e':r<.7?'#eab308':'#ef4444';

// similarity color: 0=red, 1=green, continuous interpolation
const simColor = s => {
  const v = Math.max(0, Math.min(1, s));
  const r = Math.round(239 - v*(239-34));
  const g = Math.round(68  + v*(197-68));
  const b = Math.round(68  + v*(94-68));
  return `rgb(${r},${g},${b})`;
};

const splitVal = v => String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
const hasVal   = (field, filter) => !filter || splitVal(field).some(v=>v.toLowerCase().includes(filter.toLowerCase()));

const devCat = dev => {
  if(!dev) return '';
  const d = dev.toLowerCase();
  if(d.includes('mobile')||d.includes('android')||d.includes('ios')||d.includes('phone')) return 'Mobile';
  if(d.includes('tablet')||d.includes('ipad')) return 'Tablet';
  if(d.includes('desktop')||d.includes('pc')||d.includes('mac')||d.includes('windows')||d.includes('linux')) return 'Desktop';
  return dev;
};

/* ─────────────────────────────────────────
   Robust CSV/TSV parser (RFC 4180 + auto-delimiter)
   Handles: quoted fields, embedded commas, embedded
   newlines, semicolon-delimited (EU Excel), tab, comma.
───────────────────────────────────────── */
const detectDelimiter = firstLine => {
  // Count occurrences outside of quotes
  const count = (str, ch) => {
    let n = 0, inQ = false;
    for(const c of str){ if(c==='"') inQ=!inQ; else if(!inQ && c===ch) n++; }
    return n;
  };
  const tabs   = count(firstLine, '\t');
  const commas = count(firstLine, ',');
  const semis  = count(firstLine, ';');
  if(tabs   >= commas && tabs   >= semis) return '\t';
  if(semis  >  commas)                   return ';';
  return ',';
};

const parseCSV = (text, sep) => {
  const rows = [];
  let row = [], cur = '', inQ = false;
  const push = () => { row.push(cur.trim()); cur = ''; };

  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    const next = text[i+1];

    if(inQ){
      if(ch==='"' && next==='"'){ cur+='"'; i++; }         // escaped quote ""
      else if(ch==='"'){ inQ = false; }                     // closing quote
      else { cur += ch; }
    } else {
      if(ch==='"'){ inQ = true; }                           // opening quote
      else if(ch===sep){ push(); }                          // delimiter
      else if(ch==='\r' && next==='\n'){ push(); rows.push(row); row=[]; cur=''; i++; } // CRLF
      else if(ch==='\n'){ push(); rows.push(row); row=[]; cur=''; }  // LF
      else { cur += ch; }
    }
  }
  push();
  if(row.some(v=>v!=='')) rows.push(row);   // last row if non-empty
  return rows;
};

const parseRaw = text => {
  if(!text || !text.trim()) return {headers:[], rows:[]};
  const firstLine = text.split(/\r?\n/)[0];
  const sep = detectDelimiter(firstLine);
  const allRows = parseCSV(text, sep);
  if(allRows.length < 2) return {headers:[], rows:[]};
  const headers = allRows[0].map(h=>h.trim());
  const rows    = allRows.slice(1).filter(r=>r.some(v=>v!==''));
  return {headers, rows};
};

/* ─────────────────────────────────────────
   Look-alike (cosine similarity)
───────────────────────────────────────── */
function computeLookAlike(players, filters){
  let pool = players.map(derive);
  if(filters.country)        pool = pool.filter(p=>hasVal(p.country,filters.country));
  if(filters.asn)            pool = pool.filter(p=>hasVal(p.asn,filters.asn));
  if(filters.payment_method) pool = pool.filter(p=>p.payment_method?.toLowerCase().includes(filters.payment_method.toLowerCase()));
  if(filters.device)         pool = pool.filter(p=>devCat(p.device)===filters.device);
  if(filters.currency)       pool = pool.filter(p=>p.currency===filters.currency);
  if(filters.min_deposit)    pool = pool.filter(p=>p.total_deposit>=Number(filters.min_deposit));
  if(filters.max_deposit)    pool = pool.filter(p=>p.total_deposit<=Number(filters.max_deposit));
  if(!pool.length) return [];

  // Score: how many filter criteria match (normalised 0-1, never negative)
  const criteria = [
    filters.country,filters.asn,filters.payment_method,filters.device,
    filters.currency,filters.min_deposit,filters.max_deposit
  ].filter(Boolean);

  if(!criteria.length){
    // No filters — rank by deposit desc, score based on relative rank
    const sorted = [...pool].sort((a,b)=>b.total_deposit-a.total_deposit);
    const max = sorted[0]?.total_deposit||1;
    return sorted.slice(0,10).map(p=>({...p, similarity_score: p.total_deposit/max}));
  }

  // Score = fraction of active filters matched (always 0-1)
  const score = p => {
    let matched = 0, total = 0;
    if(filters.country){total++;if(hasVal(p.country,filters.country))matched++;}
    if(filters.asn){total++;if(hasVal(p.asn,filters.asn))matched++;}
    if(filters.payment_method){total++;if(p.payment_method?.toLowerCase().includes(filters.payment_method.toLowerCase()))matched++;}
    if(filters.device){total++;if(devCat(p.device)===filters.device)matched++;}
    if(filters.currency){total++;if(p.currency===filters.currency)matched++;}
    if(filters.min_deposit){total++;if(p.total_deposit>=Number(filters.min_deposit))matched++;}
    if(filters.max_deposit){total++;if(p.total_deposit<=Number(filters.max_deposit))matched++;}
    return total>0 ? matched/total : 0;
  };

  return pool
    .map(p=>({...p, similarity_score: Math.max(0, score(p))}))
    .sort((a,b)=>b.similarity_score-a.similarity_score)
    .slice(0,20);
}

/* ─────────────────────────────────────────
   Import Modal (with XLSX support)
───────────────────────────────────────── */
function ImportModal({onClose, onImport}){
  const [step,setStep] = useState(1);
  const [raw,setRaw]   = useState('');
  const [parsed,setParsed] = useState({headers:[],rows:[]});
  const [mapping,setMapping] = useState({});
  const [sending,setSending] = useState(false);
  const [fileName,setFileName] = useState('');
  const fileRef = useRef(null);

  const loadFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();

    if(ext === 'xlsx' || ext === 'xls'){
      const reader = new FileReader();
      reader.onload = ev => {
        try{
          const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true, cellText:false});
          const ws = wb.Sheets[wb.SheetNames[0]];
          // sheet_to_json with header:1 → reliable 2D array, handles typed cells
          const arr = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false, blankrows:false});
          if(!arr || arr.length < 2){ alert('Файл пустой или не читается'); return; }
          // Normalise to tab-separated (our parseRaw handles it)
          const txt = arr.map(row =>
            row.map(cell => String(cell??'').replace(/\t/g,' ').replace(/\n/g,' ')).join('\t')
          ).join('\n');
          setRaw(txt);
          setFileName(file.name + ' (' + (arr.length-1) + ' строк, ' + arr[0].length + ' колонок)');
        }catch(err){ alert('Ошибка Excel: ' + err.message); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      const reader = new FileReader();
      reader.onload = ev => { setRaw(ev.target.result); setFileName(file.name); };
      reader.readAsText(file,'UTF-8');
    }
    e.target.value = '';
  };

  const [parseInfo, setParseInfo] = useState('');

  const doParse = () => {
    if(!raw.trim()){ alert('Нет данных для парсинга'); return; }
    const firstLine = raw.split(/\r?\n/)[0];
    const sep = detectDelimiter(firstLine);
    const sepName = sep === '\t' ? 'Tab' : sep === ';' ? 'Точка с запятой (;)' : 'Запятая (,)';
    const p = parseRaw(raw);
    if(!p.headers.length){alert('Не удалось распарсить. Проверьте формат.'); return;}
    setParseInfo(\`Разделитель: \${sepName} · Колонок: \${p.headers.length} · Строк данных: \${p.rows.length}\`);
    setParsed(p); setMapping(fuzzyMap(p.headers)); setStep(2);
  };

  const preview = useMemo(()=>{
    if(step<3) return [];
    return parsed.rows.map(row=>{
      const obj={};
      for(const {key} of SYSTEM_FIELDS){
        const col = mapping[key];
        const idx = col ? parsed.headers.indexOf(col) : -1;
        let val = idx>=0 ? row[idx] : '';
        if(['total_deposit','total_withdrawal'].includes(key)) val = parseFloat(val)||0;
        obj[key] = val;
      }
      return obj;
    });
  },[step,parsed,mapping]);

  const doImport = async () => {
    setSending(true);
    const m = new Map();
    for(const p of preview){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    const final = [...m.values()];
    await sheetsPost(final);
    onImport(final);
    setSending(false);
    onClose();
  };

  const steps = ['Загрузить данные','Маппинг колонок','Предпросмотр'];

  return(
    <div className="fixed inset-0 z-40 flex items-center justify-center">
      <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}/>
      <div className="relative z-50 w-full max-w-2xl mx-4 bg-gray-900 border border-cyan-900/40 rounded-2xl flex flex-col" style={{maxHeight:'90vh'}}>

        {/* Header */}
        <div className="px-6 pt-5 pb-4 border-b border-gray-800 flex-shrink-0">
          <div className="flex justify-between items-center mb-4">
            <div className="flex items-center gap-2">
              <Icon name="upload" size={18} className="text-cyan-400"/>
              <span className="display text-base font-semibold text-white">Импорт данных</span>
            </div>
            <button onClick={onClose} className="btn-ghost !px-2 !py-2"><Icon name="x" size={14}/></button>
          </div>
          <div className="flex gap-2">
            {steps.map((s,i)=>(
              <div key={i} className={`flex-1 text-center text-xs py-1.5 rounded-lg transition-colors ${step===i+1?'bg-cyan-600/20 text-cyan-400 border border-cyan-700':step>i+1?'bg-gray-800 text-green-400':'bg-gray-800/50 text-gray-600'}`}>
                <span className={`inline-block w-4 h-4 rounded-full text-xs mr-1 ${step===i+1?'bg-cyan-600 text-white':step>i+1?'bg-green-700 text-white':'bg-gray-700 text-gray-500'} align-middle`}>{step>i+1?'✓':i+1}</span>
                {s}
              </div>
            ))}
          </div>
        </div>

        {/* Body */}
        <div className="overflow-y-auto flex-1 px-6 py-5" style={{minHeight:0}}>
          {step===1&&(
            <div className="fade-in space-y-4">
              <p className="text-gray-400 text-sm">Загрузите файл или вставьте данные вручную.</p>
              {/* File drop zone */}
              <div
                onClick={()=>fileRef.current.click()}
                className="border-2 border-dashed border-gray-700 hover:border-cyan-700 rounded-xl p-8 text-center cursor-pointer transition-colors group">
                <Icon name="file" size={32} className="text-gray-600 group-hover:text-cyan-500 mx-auto mb-3 transition-colors"/>
                <p className="text-sm text-gray-400 group-hover:text-gray-300">Нажмите или перетащите файл</p>
                <p className="text-xs text-gray-600 mt-1">Excel (.xlsx, .xls), CSV, TSV, TXT</p>
                {fileName&&<p className="text-xs text-cyan-400 mt-3 font-mono">✓ {fileName} · {raw.split('\n').length} строк</p>}
              </div>
              <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,.tab,.xlsx,.xls" className="hidden" onChange={loadFile}/>
              <div className="flex items-center gap-3">
                <div className="flex-1 h-px bg-gray-800"/>
                <span className="text-xs text-gray-600">или вставьте текст</span>
                <div className="flex-1 h-px bg-gray-800"/>
              </div>
              <textarea
                className="input-base h-40 resize-none font-mono text-xs"
                placeholder={"user_id\tpayment_method\tcountry\ttotal_deposit\n12345\tCard\tRU,KZ\t1500.50"}
                value={raw} onChange={e=>setRaw(e.target.value)}/>
              <p className="text-xs text-gray-600">💡 Страна и ASN — можно несколько через запятую: <span className="text-gray-400 mono">RU,KZ</span></p>
            </div>
          )}

          {step===2&&(
            <div className="fade-in space-y-2">
              <p className="text-gray-400 text-sm mb-2">Сопоставьте поля системы с колонками вашей таблицы.</p>
              {parseInfo&&<p className="text-xs mono text-cyan-700 bg-cyan-950/40 border border-cyan-900/30 rounded-lg px-3 py-1.5 mb-3">{parseInfo}</p>}
              {SYSTEM_FIELDS.map(({key,label})=>(
                <div key={key} className="flex items-center gap-3">
                  <span className="text-sm text-gray-400 w-40 flex-shrink-0">{label}</span>
                  <select className="input-base" value={mapping[key]||''} onChange={e=>setMapping(m=>({...m,[key]:e.target.value}))}>
                    <option value="">— не выбрано —</option>
                    {parsed.headers.map(h=><option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              ))}
            </div>
          )}

          {step===3&&(
            <div className="fade-in">
              <p className="text-gray-400 text-sm mb-3">
                Предпросмотр первых 10 строк. Всего: <span className="text-cyan-400 font-semibold">{preview.length}</span>
              </p>
              <div className="overflow-x-auto rounded-xl border border-gray-800">
                <table className="w-full text-xs mono">
                  <thead><tr className="bg-gray-800 text-gray-400">{SYSTEM_FIELDS.map(f=><th key={f.key} className="px-2 py-2 text-left whitespace-nowrap">{f.label}</th>)}</tr></thead>
                  <tbody>{preview.slice(0,10).map((row,i)=>(
                    <tr key={i} className={i%2===0?'row-even':'row-odd'}>
                      {SYSTEM_FIELDS.map(f=><td key={f.key} className="px-2 py-1.5 text-gray-300 whitespace-nowrap max-w-[120px] truncate">{row[f.key]!==undefined?String(row[f.key]):'—'}</td>)}
                    </tr>
                  ))}</tbody>
                </table>
              </div>
              {preview.length>10&&<p className="text-gray-500 text-xs mt-2 text-center">…и ещё {preview.length-10} строк</p>}
            </div>
          )}
        </div>

        {/* Footer */}
        <div className="px-6 py-4 border-t border-gray-800 flex-shrink-0 flex justify-between gap-3 bg-gray-900 rounded-b-2xl">
          {step>1
            ? <button className="btn-ghost" onClick={()=>setStep(s=>s-1)}><Icon name="arrowLeft" size={14}/>Назад</button>
            : <div/>}
          {step===1&&<button className="btn-primary" onClick={doParse} disabled={!raw.trim()}><Icon name="arrowRight" size={14}/>Распарсить</button>}
          {step===2&&<button className="btn-primary" onClick={()=>setStep(3)}><Icon name="arrowRight" size={14}/>Предпросмотр</button>}
          {step===3&&<button className="btn-primary" onClick={doImport} disabled={sending||!preview.length}>
            <Icon name="upload" size={14}/>{sending?'Отправка…':`Импортировать ${preview.length} записей`}
          </button>}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   TAB 1 — Player Base
───────────────────────────────────────── */
function PlayerBase({players, setPlayers, loading, userEmail}){
  const admin = isAdmin(userEmail);
  const [showModal,setShowModal] = useState(false);
  const [showAdd,setShowAdd]     = useState(false);
  const [fCountry,setFCountry]   = useState('');
  const [fDevice,setFDevice]     = useState('');
  const [fCurrency,setFCurrency] = useState('');
  const [sort,setSort] = useState({col:'created_at',dir:'desc'});
  const [toast,setToast] = useState(null);
  const [np,setNp] = useState({});
  const [syncing,setSyncing] = useState(false);

  const derived = useMemo(()=>players.map(derive),[players]);
  const allCountries  = useMemo(()=>[...new Set(derived.flatMap(p=>splitVal(p.country)))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);
  const allDevCats    = useMemo(()=>[...new Set(derived.map(p=>devCat(p.device)).filter(Boolean))].sort(),[derived]);

  const hasFilters = fCountry||fDevice||fCurrency;

  const clearFilters = () => { setFCountry(''); setFDevice(''); setFCurrency(''); };

  const filtered = useMemo(()=>{
    let d = derived;
    if(fCountry)  d = d.filter(p=>splitVal(p.country).includes(fCountry));
    if(fDevice)   d = d.filter(p=>devCat(p.device)===fDevice);
    if(fCurrency) d = d.filter(p=>p.currency===fCurrency);
    return [...d].sort((a,b)=>{
      const av=a[sort.col],bv=b[sort.col];
      const cmp = typeof av==='number' ? av-bv : String(av||'').localeCompare(String(bv||''));
      return sort.dir==='asc' ? cmp : -cmp;
    });
  },[derived,fCountry,fDevice,fCurrency,sort]);

  const toggleSort = col => setSort(s=>({col,dir:s.col===col&&s.dir==='asc'?'desc':'asc'}));

  const dedup = () => {
    const m = new Map();
    for(const p of players){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    setPlayers([...m.values()]);
    setToast(`Удалено ${players.length-m.size} дублей`);
  };

  const handleImport = newP => {
    setPlayers(prev=>{
      const m = new Map(prev.map(p=>[p.user_id,p]));
      for(const p of newP){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
      return [...m.values()];
    });
    setToast(`Импортировано ${newP.length} записей`);
  };

  const syncNow = async () => {
    setSyncing(true);
    const d = await sheetsGet();
    if(d.length){setPlayers(d);setToast(`Загружено ${d.length} записей из Sheets`);}
    else setToast('Нет данных в Sheets');
    setSyncing(false);
  };

  const addP = () => {
    if(!np.user_id) return;
    setPlayers(prev=>[...prev,{...np,total_deposit:parseFloat(np.total_deposit)||0,total_withdrawal:parseFloat(np.total_withdrawal)||0}]);
    setNp({}); setShowAdd(false); setToast('Игрок добавлен');
  };

  const devBadge = d => {
    const c = devCat(d);
    return c==='Mobile'?'bg-cyan-900/30 text-cyan-400':c==='Desktop'?'bg-violet-900/30 text-violet-400':c==='Tablet'?'bg-orange-900/30 text-orange-400':'bg-gray-800 text-gray-400';
  };

  const cols = [
    {key:'user_id',          label:'Пользователь',     w:'min-w-[130px]'},
    {key:'payment_method',   label:'Метод депозита',   w:'min-w-[130px]'},
    {key:'total_deposit',    label:'Сумма депа',        w:'min-w-[110px]'},
    {key:'total_withdrawal', label:'Сумма вывода',      w:'min-w-[110px]'},
    {key:'net_balance',      label:'Net',               w:'min-w-[100px]'},
    {key:'currency',         label:'Валюта',            w:'min-w-[70px]'},
    {key:'country',          label:'Страна',            w:'min-w-[140px]'},
    {key:'asn',              label:'ASN',               w:'min-w-[150px]'},
    {key:'device',           label:'Устройство',        w:'col-device'},
    {key:'deposit_wallet',   label:'Кошелёк депозита',  w:'min-w-[150px]'},
    {key:'withdrawal_wallet',label:'Кошелёк вывода',    w:'min-w-[150px]'},
    {key:'created_at',       label:'Дата создания',     w:'min-w-[110px]'},
    {key:'limit',            label:'Limit',             w:'min-w-[80px]'},
    {key:'days_since_registration',label:'Дней',        w:'min-w-[60px]'},
  ];

  const selCls = "bg-gray-900 border border-gray-700 rounded-lg px-3 py-[7px] text-sm text-gray-300 focus:outline-none focus:border-cyan-600 h-9";

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast} onDone={()=>setToast(null)}/>}
      {showModal&&<ImportModal onClose={()=>setShowModal(false)} onImport={handleImport}/>}

      {/* Toolbar */}
      <div className="flex flex-wrap gap-2 items-center mb-4">
        {admin&&<button onClick={()=>setShowModal(true)} className="btn-primary"><Icon name="upload" size={14}/>Вставить / загрузить файл</button>}
        <button onClick={syncNow} disabled={syncing} className="btn-ghost">
          <span className={syncing?'spin':''}><Icon name="refresh" size={14}/></span>
          {syncing?'Обновление…':'Обновить из Sheets'}
        </button>
        {admin&&<button onClick={()=>setShowAdd(s=>!s)} className="btn-ghost"><Icon name="plus" size={14}/>Добавить</button>}
        {admin&&<button onClick={dedup} className="btn-ghost"><Icon name="copy" size={14}/>Очистить дубли</button>}

        <div className="flex-1"/>

        {/* Filters */}
        <select value={fCountry} onChange={e=>setFCountry(e.target.value)} className={selCls}>
          <option value="">Все страны</option>{allCountries.map(c=><option key={c}>{c}</option>)}
        </select>
        <select value={fDevice} onChange={e=>setFDevice(e.target.value)} className={selCls}>
          <option value="">Все устройства</option>{allDevCats.map(d=><option key={d}>{d}</option>)}
        </select>
        <select value={fCurrency} onChange={e=>setFCurrency(e.target.value)} className={selCls}>
          <option value="">Все валюты</option>{allCurrencies.map(c=><option key={c}>{c}</option>)}
        </select>
        {hasFilters&&(
          <button onClick={clearFilters} className="btn-ghost !text-red-400 !border-red-900">
            <Icon name="xCircle" size={14}/>Сбросить
          </button>
        )}
      </div>

      {/* Inline add */}
      {showAdd&&admin&&(
        <div className="mb-4 p-4 card fade-in">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
            {SYSTEM_FIELDS.map(({key,label,type})=>(
              <div key={key}>
                <label className="block text-xs text-gray-500 mb-1">{label}</label>
                <input type={type==='number'?'number':'text'} className="input-base text-sm"
                  value={np[key]||''} onChange={e=>setNp(p=>({...p,[key]:e.target.value}))}/>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <button className="btn-primary" onClick={addP}><Icon name="check" size={14}/>Сохранить</button>
            <button className="btn-ghost" onClick={()=>setShowAdd(false)}><Icon name="x" size={14}/>Отмена</button>
          </div>
        </div>
      )}

      {/* Stats */}
      <div className="flex gap-4 mb-3 text-xs text-gray-500 mono">
        <span>Показано: <span className="text-cyan-400 font-semibold">{filtered.length}</span></span>
        <span>Всего: <span className="text-gray-300">{players.length}</span></span>
        {loading&&<span className="text-cyan-500 animate-pulse">Загрузка из Sheets…</span>}
      </div>

      {/* Table */}
      <div className="overflow-x-auto rounded-xl border border-gray-800">
        <table className="text-xs mono" style={{borderCollapse:'collapse',width:'max-content',minWidth:'100%'}}>
          <thead>
            <tr className="bg-gray-800/80 text-gray-400 border-b border-gray-700">
              {cols.map(c=>(
                <th key={c.key}
                  className={`px-3 py-3 text-left cursor-pointer hover:text-cyan-400 select-none whitespace-nowrap font-medium ${c.w}`}
                  onClick={()=>toggleSort(c.key)}>
                  {c.label}<SortIcon col={c.key} sort={sort}/>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {!filtered.length?(
              <tr><td colSpan={cols.length} className="text-center py-16 text-gray-700">
                {loading?'Загрузка данных…':'Нет данных. Импортируйте или обновите из Sheets.'}
              </td></tr>
            ):filtered.map((p,i)=>(
              <tr key={p.user_id+i} className={`${i%2===0?'row-even':'row-odd'} hover:bg-gray-700/30 transition-colors`}>
                <td className="px-3 py-2 text-cyan-400 font-medium whitespace-nowrap">{p.user_id}</td>
                <td className="px-3 py-2 text-gray-300 whitespace-nowrap">{p.payment_method||'—'}</td>
                <td className="px-3 py-2 text-emerald-400 whitespace-nowrap font-medium">{fmt(p.total_deposit)}</td>
                <td className="px-3 py-2 text-rose-400 whitespace-nowrap">{fmt(p.total_withdrawal)}</td>
                <td className="px-3 py-2 whitespace-nowrap font-medium" style={{color:p.net_balance>=0?'#34d399':'#f87171'}}>{fmt(p.net_balance)}</td>
                <td className="px-3 py-2 text-gray-400 whitespace-nowrap">{p.currency||'—'}</td>
                <td className="px-3 py-2"><Tags value={p.country} color="#06b6d4"/></td>
                <td className="px-3 py-2"><Tags value={p.asn} color="#a78bfa"/></td>
                <td className="px-3 py-2 col-device overflow-hidden">
                  <span className={`tag text-xs ${devBadge(p.device)}`}>{p.device||'—'}</span>
                </td>
                <td className="px-3 py-2 text-gray-600 whitespace-nowrap font-mono text-[11px]">{p.deposit_wallet||'—'}</td>
                <td className="px-3 py-2 text-gray-600 whitespace-nowrap font-mono text-[11px]">{p.withdrawal_wallet||'—'}</td>
                <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{p.created_at||'—'}</td>
                <td className="px-3 py-2 text-amber-500 whitespace-nowrap">{p.limit||'—'}</td>
                <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{p.days_since_registration}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   TAB 2 — Look-alike (filter only, no new player form)
───────────────────────────────────────── */
function LookAlike({players}){
  const derived = useMemo(()=>players.map(derive),[players]);
  const allCountries  = useMemo(()=>[...new Set(derived.flatMap(p=>splitVal(p.country)))].sort(),[derived]);
  const allMethods    = useMemo(()=>[...new Set(derived.map(p=>p.payment_method).filter(Boolean))].sort(),[derived]);
  const allAsns       = useMemo(()=>[...new Set(derived.flatMap(p=>splitVal(p.asn)))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);
  const DEV_CATS = ['Mobile','Desktop','Tablet'];

  const EMPTY = {country:'',asn:'',payment_method:'',device:'',currency:'',min_deposit:'',max_deposit:''};
  const [filters,setFilters] = useState(EMPTY);
  const [results,setResults] = useState([]);
  const [ran,setRan] = useState(false);

  const ff  = (k,v) => setFilters(f=>({...f,[k]:v}));
  const clearFilters = () => setFilters(EMPTY);
  const hasFilters = Object.values(filters).some(Boolean);

  const run = () => { setResults(computeLookAlike(players,filters)); setRan(true); };

  const iCls = "input-base";

  return(
    <div className="fade-in">
      {/* Filter card */}
      <div className="card mb-5">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            <Icon name="filter" size={16} className="text-cyan-400"/>
            <h3 className="display text-sm font-semibold text-white">Фильтр базы игроков</h3>
          </div>
          {hasFilters&&(
            <button onClick={clearFilters} className="btn-ghost !text-rose-400 !border-rose-900 text-xs !px-3 !py-1.5">
              <Icon name="xCircle" size={13}/>Очистить фильтры
            </button>
          )}
        </div>

        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          {/* Country combobox */}
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">Страна</label>
            <input className={iCls} list="la-cnt" placeholder="все или выберите…" value={filters.country} onChange={e=>ff('country',e.target.value)}/>
            <datalist id="la-cnt">{allCountries.map(c=><option key={c} value={c}/>)}</datalist>
          </div>
          {/* ASN combobox */}
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">ASN</label>
            <input className={iCls} list="la-asn" placeholder="все или введите…" value={filters.asn} onChange={e=>ff('asn',e.target.value)}/>
            <datalist id="la-asn">{allAsns.map(a=><option key={a} value={a}/>)}</datalist>
          </div>
          {/* Method combobox */}
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">Метод оплаты</label>
            <input className={iCls} list="la-mth" placeholder="все или выберите…" value={filters.payment_method} onChange={e=>ff('payment_method',e.target.value)}/>
            <datalist id="la-mth">{allMethods.map(m=><option key={m} value={m}/>)}</datalist>
          </div>
          {/* Device */}
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">Устройство</label>
            <select className={iCls} value={filters.device} onChange={e=>ff('device',e.target.value)}>
              <option value="">Все устройства</option>
              {DEV_CATS.map(d=><option key={d}>{d}</option>)}
            </select>
          </div>
          {/* Currency */}
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">Валюта</label>
            <select className={iCls} value={filters.currency} onChange={e=>ff('currency',e.target.value)}>
              <option value="">Все валюты</option>
              {allCurrencies.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          {/* Deposit range */}
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">Депозит (от / до)</label>
            <div className="flex gap-2">
              <input type="number" className={iCls} placeholder="от" value={filters.min_deposit} onChange={e=>ff('min_deposit',e.target.value)}/>
              <input type="number" className={iCls} placeholder="до" value={filters.max_deposit} onChange={e=>ff('max_deposit',e.target.value)}/>
            </div>
          </div>
        </div>

        <div className="flex items-center gap-3 mt-4 pt-4 border-t border-gray-800">
          <button onClick={run} disabled={!players.length} className="btn-primary">
            <Icon name="search" size={14}/>Найти похожих
          </button>
          {ran&&<span className="text-xs text-gray-500 mono">Найдено: {results.length}</span>}
        </div>
      </div>

      {/* Results */}
      {ran&&(
        <div className="fade-in overflow-x-auto rounded-xl border border-gray-800">
          <table className="w-full text-xs mono">
            <thead>
              <tr className="bg-gray-800/80 text-gray-400 border-b border-gray-700">
                {['#','User ID','Схожесть','Страна','ASN','Устройство','Депозит','Net','Валюта','Метод','Limit'].map(h=>(
                  <th key={h} className="px-3 py-3 text-left whitespace-nowrap font-medium">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {!results.length?(
                <tr><td colSpan={11} className="text-center py-12 text-gray-700">Нет результатов по заданным фильтрам</td></tr>
              ):results.map((p,i)=>{
                const sc = Math.max(0, Math.min(1, p.similarity_score));
                const col = simColor(sc);
                return(
                  <tr key={p.user_id+i} className={i%2===0?'row-even':'row-odd'}>
                    <td className="px-3 py-2.5 text-gray-600">{i+1}</td>
                    <td className="px-3 py-2.5 text-cyan-400 font-medium">{p.user_id}</td>
                    <td className="px-3 py-2.5 min-w-[150px]">
                      <div className="flex items-center gap-2">
                        <div className="flex-1 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                          <div className="sim-bar rounded-full" style={{width:`${(sc*100).toFixed(0)}%`, background:col}}/>
                        </div>
                        <span className="text-xs tabular-nums" style={{color:col}}>{(sc*100).toFixed(0)}%</span>
                      </div>
                    </td>
                    <td className="px-3 py-2.5"><Tags value={p.country} color="#06b6d4"/></td>
                    <td className="px-3 py-2.5"><Tags value={p.asn} color="#a78bfa"/></td>
                    <td className="px-3 py-2.5 text-gray-300">{p.device||'—'}</td>
                    <td className="px-3 py-2.5 text-emerald-400 font-medium">{fmt(p.total_deposit)}</td>
                    <td className="px-3 py-2.5 font-medium" style={{color:p.net_balance>=0?'#34d399':'#f87171'}}>{fmt(p.net_balance)}</td>
                    <td className="px-3 py-2.5 text-gray-400">{p.currency||'—'}</td>
                    <td className="px-3 py-2.5 text-gray-400">{p.payment_method||'—'}</td>
                    <td className="px-3 py-2.5 text-amber-500">{p.limit||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────
   TAB 3 — Analytics
───────────────────────────────────────── */
function ChartBox({title,children}){
  return(
    <div className="card">
      <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-4 flex items-center gap-2">
        <Icon name="chart" size={13} className="text-gray-600"/>{title}
      </h3>
      {children}
    </div>
  );
}
function BarChartComp({data,color='#06b6d4'}){
  const r=useRef(null),ch=useRef(null);
  useEffect(()=>{
    if(!r.current||!data.length) return;
    ch.current?.destroy();
    ch.current=new Chart(r.current,{type:'bar',data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.value),backgroundColor:color+'bb',borderColor:color,borderWidth:1,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#64748b',font:{family:'IBM Plex Mono',size:10}},grid:{color:'#1e293b'}},y:{ticks:{color:'#64748b',font:{family:'IBM Plex Mono',size:10}},grid:{color:'#1e293b'}}}}});
    return()=>ch.current?.destroy();
  },[data]);
  return <div style={{height:180}}><canvas ref={r}/></div>;
}
function ScatterComp({data}){
  const r=useRef(null),ch=useRef(null);
  useEffect(()=>{
    if(!r.current||!data.length) return;
    ch.current?.destroy();
    const cm={Mobile:'#06b6d4',Desktop:'#a78bfa',Tablet:'#fb923c'};
    const byD={};
    data.forEach(p=>{const d=devCat(p.device)||'Other';if(!byD[d])byD[d]=[];byD[d].push({x:p.total_deposit,y:p.net_balance});});
    ch.current=new Chart(r.current,{type:'scatter',data:{datasets:Object.entries(byD).map(([d,pts])=>({label:d,data:pts,backgroundColor:(cm[d]||'#64748b')+'99',pointRadius:4}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#64748b',font:{family:'IBM Plex Mono',size:10}}}},scales:{x:{title:{display:true,text:'Депозит',color:'#475569'},ticks:{color:'#475569'},grid:{color:'#1e293b'}},y:{title:{display:true,text:'Net',color:'#475569'},ticks:{color:'#475569'},grid:{color:'#1e293b'}}}}});
    return()=>ch.current?.destroy();
  },[data]);
  return <div style={{height:220}}><canvas ref={r}/></div>;
}

function Analytics({players}){
  const derived = useMemo(()=>players.map(derive),[players]);
  const avgDep  = derived.length ? derived.reduce((s,p)=>s+p.total_deposit,0)/derived.length : 0;
  const avgNet  = derived.length ? derived.reduce((s,p)=>s+p.net_balance,0)/derived.length : 0;
  const topC    = useMemo(()=>{
    const cnt={};
    derived.flatMap(p=>splitVal(p.country)).forEach(c=>{if(c)cnt[c]=(cnt[c]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  },[derived]);
  const cntD = useMemo(()=>{const c={};derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,value])=>({label,value}));},[derived]);
  const mthD = useMemo(()=>{const c={};derived.forEach(p=>{if(p.payment_method)c[p.payment_method]=(c[p.payment_method]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));},[derived]);

  const kpis=[
    {label:'Всего игроков',   value:fmtI(players.length), icon:'database', color:'#06b6d4'},
    {label:'Средний депозит', value:'$'+fmt(avgDep),       icon:'chart',    color:'#34d399'},
    {label:'Средний Net',     value:'$'+fmt(avgNet),        icon:'chart',    color:avgNet>=0?'#34d399':'#f87171'},
    {label:'Топ страна',      value:topC,                   icon:'shield',   color:'#a78bfa'},
  ];

  return(
    <div className="fade-in space-y-5">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {kpis.map(k=>(
          <div key={k.label} className="card">
            <div className="flex items-center gap-2 mb-3">
              <Icon name={k.icon} size={14} style={{color:k.color}}/>
              <span className="text-xs text-gray-500 uppercase tracking-wider">{k.label}</span>
            </div>
            <div className="display text-2xl font-bold" style={{color:k.color}}>{k.value}</div>
          </div>
        ))}
      </div>
      <div className="grid md:grid-cols-2 gap-5">
        <ChartBox title="Топ-8 стран"><BarChartComp data={cntD} color="#06b6d4"/></ChartBox>
        <ChartBox title="Методы оплаты"><BarChartComp data={mthD} color="#a78bfa"/></ChartBox>
      </div>
      <ChartBox title="Депозит vs Net (по устройству)"><ScatterComp data={derived}/></ChartBox>
    </div>
  );
}

/* ─────────────────────────────────────────
   TAB 4 — Data Cleanup
───────────────────────────────────────── */
function DataCleanup({players, setPlayers}){
  const [toast,setToast] = useState(null);

  const stats = useMemo(()=>{
    const derived = players.map(derive);
    const idC={}, wC={};
    derived.forEach(p=>{
      idC[p.user_id]=(idC[p.user_id]||0)+1;
      if(p.deposit_wallet) wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;
    });
    return {
      unknownCountry: derived.filter(p=>!p.country||p.country.toUpperCase()==='UNKNOWN').length,
      zeroDeposit:    derived.filter(p=>p.total_deposit===0).length,
      dupIds:         Object.values(idC).filter(v=>v>1).length,
      dupWallets:     Object.values(wC).filter(v=>v>1).length,
      wrOver1:        derived.filter(p=>p.withdrawal_rate>1).length,
    };
  },[players]);

  const fixUnknown = useCallback(()=>{
    setPlayers(ps=>ps.map(p=>(!p.country||p.country.toUpperCase()==='UNKNOWN')?{...p,country:'UNKNOWN'}:p));
    setToast('Пустые страны заменены на UNKNOWN');
  },[setPlayers]);

  const fixDupIds = useCallback(()=>{
    const m=new Map();
    for(const p of players){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    setPlayers([...m.values()]);
    setToast('Дубли по user_id удалены');
  },[players,setPlayers]);

  const fixDupWallets = useCallback(()=>{
    const wC={};
    players.forEach(p=>{if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;});
    const dups=new Set(Object.entries(wC).filter(([,v])=>v>1).map(([k])=>k));
    setPlayers(ps=>ps.map(p=>(p.deposit_wallet&&dups.has(p.deposit_wallet))?{...p,is_linked:true}:p));
    setToast('Флаг is_linked проставлен');
  },[players,setPlayers]);

  const fixWrOver1 = useCallback(()=>{
    setPlayers(ps=>ps.map(p=>{
      const wr=p.total_deposit>0?p.total_withdrawal/p.total_deposit:0;
      return wr>1?{...p,needs_review:true}:p;
    }));
    setToast('Флаг needs_review проставлен');
  },[setPlayers]);

  const issues=[
    {key:'unk',  title:'Пустые / UNKNOWN страны',  desc:'Поле country пустое или "UNKNOWN"',              count:stats.unknownCountry, fix:fixUnknown},
    {key:'zero', title:'Нулевой депозит',           desc:'total_deposit = 0 — только информирование',     count:stats.zeroDeposit,    fix:null},
    {key:'duid', title:'Дубли по user_id',          desc:'Оставить запись с максимальным депозитом',      count:stats.dupIds,         fix:fixDupIds},
    {key:'duwl', title:'Дубли по deposit_wallet',   desc:'Пометить связанные аккаунты флагом is_linked',  count:stats.dupWallets,     fix:fixDupWallets},
    {key:'wr1',  title:'Withdrawal rate > 1',       desc:'Вывод превышает депозит → needs_review',        count:stats.wrOver1,        fix:fixWrOver1},
  ];

  return(
    <div className="fade-in space-y-3">
      {toast&&<Toast message={toast} onDone={()=>setToast(null)}/>}
      <div className="flex items-center gap-3 mb-4">
        <Icon name="broom" size={16} className="text-cyan-400"/>
        <p className="text-sm text-gray-400">Сканирование в реальном времени. Игроков: <span className="text-cyan-400 font-semibold mono">{players.length}</span></p>
      </div>
      {issues.map(iss=>{
        const ok = iss.count===0;
        return(
          <div key={iss.key} className={`card flex items-center gap-4 border ${ok?'border-green-900/30 bg-green-950/10':'border-orange-900/30 bg-orange-950/10'}`}>
            <div className={`w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 ${ok?'bg-green-900/30':'bg-orange-900/30'}`}>
              <Icon name={ok?'check':'warning'} size={16} className={ok?'text-green-400':'text-orange-400'}/>
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-0.5">
                <span className={`text-xs font-bold mono ${ok?'text-green-400':'text-orange-400'}`}>
                  {ok?'Чисто':iss.count+' проблем'}
                </span>
                <span className="text-sm font-medium text-gray-200">{iss.title}</span>
              </div>
              <p className="text-xs text-gray-600">{iss.desc}</p>
            </div>
            {!ok&&iss.fix&&(
              <button onClick={iss.fix} className="btn-ghost flex-shrink-0 !text-cyan-400 !border-cyan-900 !text-xs">
                <Icon name="wrench" size={12}/>Исправить
              </button>
            )}
            {!ok&&!iss.fix&&(
              <span className="flex-shrink-0 text-xs text-gray-700 italic">только информирование</span>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ─────────────────────────────────────────
   Access Denied placeholder
───────────────────────────────────────── */
function AccessDenied(){
  return(
    <div className="fade-in flex flex-col items-center justify-center py-24 gap-4">
      <div className="w-16 h-16 rounded-2xl bg-red-900/20 border border-red-900/40 flex items-center justify-center">
        <Icon name="lock" size={28} className="text-red-500"/>
      </div>
      <p className="text-gray-400 text-sm">Эта вкладка доступна только администраторам</p>
      <p className="text-gray-700 text-xs mono">Нет доступа → обратитесь к администратору</p>
    </div>
  );
}

/* ─────────────────────────────────────────
   Auth Screen
───────────────────────────────────────── */
function AuthScreen({onAuth}){
  const [error,setError]=useState('');
  const btnRef=useRef(null);

  useEffect(()=>{
    const init=()=>{
      if(!window.google) return;
      window.google.accounts.id.initialize({
        client_id: CFG.GOOGLE_CLIENT_ID,
        callback: resp=>{
          try{
            const pl=JSON.parse(atob(resp.credential.split('.')[1]));
            if(!pl.email.endsWith('@'+CFG.ALLOWED_DOMAIN)){setError(`Доступ только для @${CFG.ALLOWED_DOMAIN}`);return;}
            onAuth({email:pl.email,name:pl.name,picture:pl.picture});
          }catch(e){setError('Ошибка авторизации');}
        },
      });
      window.google.accounts.id.renderButton(btnRef.current,{theme:'filled_black',size:'large',text:'signin_with',shape:'rectangular',locale:'ru'});
    };
    if(window.google) init();
    else document.querySelector('script[src*="accounts.google"]')?.addEventListener('load',init);
  },[]);

  return(
    <div className="min-h-screen flex items-center justify-center p-4" style={{background:'radial-gradient(ellipse at 50% 0%,#0c1a30 0%,#080c18 65%)'}}>
      <div className="rounded-2xl p-10 max-w-sm w-full text-center" style={{background:'linear-gradient(160deg,#0f1629,#0c1222)',border:'1px solid #1e3356'}}>
        <div className="w-14 h-14 rounded-xl mx-auto mb-6 flex items-center justify-center" style={{background:'rgba(6,182,212,.1)',border:'1px solid rgba(6,182,212,.2)'}}>
          <Icon name="database" size={26} className="text-cyan-400"/>
        </div>
        <div className="display text-2xl font-bold text-white mb-1">Player<span className="text-cyan-400">Analytics</span></div>
        <p className="text-xs mono text-gray-600 mb-7">eyeconweb.com · internal tool</p>
        <p className="text-sm text-gray-400 mb-5">
          Войдите с корпоративной почтой<br/>
          <span className="text-cyan-400 mono text-xs">@{CFG.ALLOWED_DOMAIN}</span>
        </p>
        <div ref={btnRef} className="flex justify-center"/>
        {error&&(
          <div className="mt-4 flex items-center gap-2 text-sm text-red-400 bg-red-900/20 border border-red-900/40 rounded-lg px-4 py-2">
            <Icon name="warning" size={14}/>
            {error}
          </div>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   App root
───────────────────────────────────────── */
const TABS = [
  {icon:'database', label:'База игроков'},
  {icon:'search',   label:'Look-alike'},
  {icon:'chart',    label:'Аналитика',  adminOnly:true},
  {icon:'broom',    label:'Очистка',    adminOnly:true},
];

function App(){
  const [user,setUser]       = useState(null);
  const [players,setPlayers] = useState([]);
  const [loading,setLoading] = useState(false);
  const [tab,setTab]         = useState(0);

  useEffect(()=>{
    if(!user) return;
    setLoading(true);
    sheetsGet().then(d=>{if(d.length)setPlayers(d);setLoading(false);});
  },[user]);

  if(!user) return <AuthScreen onAuth={setUser}/>;

  const admin = isAdmin(user.email);

  const renderTab = () => {
    if(tab===0) return <PlayerBase players={players} setPlayers={setPlayers} loading={loading} userEmail={user.email}/>;
    if(tab===1) return <LookAlike players={players}/>;
    if(tab===2) return admin ? <Analytics players={players}/> : <AccessDenied/>;
    if(tab===3) return admin ? <DataCleanup players={players} setPlayers={setPlayers}/> : <AccessDenied/>;
  };

  return(
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <header className="border-b border-gray-800 bg-gray-900/90 backdrop-blur-sm sticky top-0 z-30">
        <div className="max-w-[1600px] mx-auto px-5 py-3 flex items-center gap-4">
          <div className="flex items-center gap-2.5">
            <div className="w-7 h-7 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center">
              <Icon name="database" size={14} className="text-cyan-400"/>
            </div>
            <div>
              <h1 className="display text-base font-bold text-white leading-none">Player<span className="text-cyan-400">Analytics</span></h1>
              <p className="text-[10px] text-gray-700 mono">eyeconweb.com</p>
            </div>
          </div>
          <div className="flex-1"/>
          {admin&&(
            <div className="flex items-center gap-1.5 px-2 py-1 bg-cyan-950/40 border border-cyan-900/40 rounded-lg">
              <Icon name="shield" size={11} className="text-cyan-500"/>
              <span className="text-[10px] text-cyan-500 mono">admin</span>
            </div>
          )}
          <div className="flex items-center gap-2 bg-gray-800/80 border border-gray-700/50 rounded-full px-3 py-1.5">
            {user.picture&&<img src={user.picture} className="w-5 h-5 rounded-full" alt=""/>}
            <span className="text-xs text-gray-400 max-w-[180px] truncate">{user.email}</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"/>
            <span className="text-xs mono text-gray-600">{players.length}</span>
          </div>
          <button onClick={()=>{setUser(null);setPlayers([]);}} className="btn-ghost !px-2 !py-2 !text-gray-600 !border-gray-800">
            <Icon name="logout" size={14}/>
          </button>
        </div>

        {/* Tabs */}
        <div className="max-w-[1600px] mx-auto px-5 flex gap-0.5">
          {TABS.map((t,i)=>{
            const locked = t.adminOnly && !admin;
            return(
              <button key={i} onClick={()=>setTab(i)}
                className={`flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors border-b-2 ${tab===i?'border-cyan-500 text-cyan-400':'border-transparent text-gray-500 hover:text-gray-300'} ${locked?'opacity-50':''}`}>
                <Icon name={t.icon} size={14}/>
                <span>{t.label}</span>
                {locked&&<Icon name="lock" size={11} className="text-gray-600"/>}
              </button>
            );
          })}
        </div>
      </header>

      {/* Content */}
      <main className="flex-1 max-w-[1600px] mx-auto w-full px-5 py-6">
        {renderTab()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

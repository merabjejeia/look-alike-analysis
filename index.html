/* ── CSS Variables (theme) ── */
:root[data-theme="dark"] {
  --bg:        #0b0f1a;
  --bg2:       #111827;
  --bg3:       #1a2234;
  --border:    #1f2d45;
  --border2:   #253047;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --text3:     #4b6080;
  --accent:    #38bdf8;
  --accent2:   #0284c7;
  --accentbg:  rgba(56,189,248,.08);
  --accentbdr: rgba(56,189,248,.2);
  --green:     #34d399;
  --red:       #f87171;
  --amber:     #fbbf24;
  --violet:    #a78bfa;
  --shadow:    0 4px 24px rgba(0,0,0,.4);
  --shadow-sm: 0 1px 6px rgba(0,0,0,.3);
  --row-a:     #0b0f1a;
  --row-b:     #0f1625;
  --scrollbar: #253047;
}
:root[data-theme="light"] {
  --bg:        #f8fafc;
  --bg2:       #ffffff;
  --bg3:       #f1f5f9;
  --border:    #e2e8f0;
  --border2:   #cbd5e1;
  --text:      #0f172a;
  --text2:     #475569;
  --text3:     #94a3b8;
  --accent:    #0284c7;
  --accent2:   #0369a1;
  --accentbg:  rgba(2,132,199,.06);
  --accentbdr: rgba(2,132,199,.2);
  --green:     #059669;
  --red:       #dc2626;
  --amber:     #d97706;
  --violet:    #7c3aed;
  --shadow:    0 4px 24px rgba(0,0,0,.08);
  --shadow-sm: 0 1px 6px rgba(0,0,0,.06);
  --row-a:     #ffffff;
  --row-b:     #f8fafc;
  --scrollbar: #cbd5e1;
}

* { box-sizing:border-box; margin:0; padding:0; }
html { font-size: 14px; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .2s, color .2s;
  min-height: 100vh;
}
.mono { font-family: 'Geist Mono', monospace; }

/* scrollbar */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius:4px; }

/* ── Layout ── */
.app-header {
  position: sticky; top:0; z-index: 40;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.header-inner { max-width:1680px; margin:0 auto; padding: 0 20px; }
.top-bar { display:flex; align-items:center; gap:12px; height:52px; }
.tab-bar { display:flex; gap:2px; padding-bottom:0; }
.tab-btn {
  display:flex; align-items:center; gap:7px;
  padding: 10px 16px;
  font-size:13px; font-weight:500;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
  transition: color .15s, border-color .15s;
  white-space:nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn.locked { opacity:.4; cursor:default; }

.main { max-width:1680px; margin:0 auto; padding:24px 20px; }

/* ── Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.card-sm { background: var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; }

/* ── Buttons ── */
.btn {
  display:inline-flex; align-items:center; gap:7px;
  padding: 7px 14px; border-radius:8px;
  font-size:13px; font-weight:500; font-family:inherit;
  cursor:pointer; border:none; transition: all .15s;
  white-space:nowrap;
}
.btn:disabled { opacity:.4; cursor:default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); box-shadow: 0 0 16px rgba(56,189,248,.3); }
.btn-ghost {
  background: transparent; color: var(--text2);
  border: 1px solid var(--border2);
}
.btn-ghost:hover:not(:disabled) { background: var(--bg3); color: var(--text); border-color: var(--text3); }
.btn-danger { background:transparent; color:var(--red); border:1px solid rgba(248,113,113,.25); }
.btn-danger:hover:not(:disabled) { background: rgba(248,113,113,.08); }

/* ── Form controls ── */
.input {
  width:100%; background: var(--bg3); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px;
  font-size:13px; color:var(--text); font-family:inherit;
  outline:none; transition: border-color .15s;
}
.input:focus { border-color: var(--accent); }
.input::placeholder { color: var(--text3); }
select.input { cursor:pointer; }
select.input option { background: var(--bg2); color: var(--text); }

/* ── Table ── */
.tbl { width:max-content; min-width:100%; border-collapse:collapse; font-family:'Geist Mono',monospace; font-size:12px; }
.tbl thead tr { background: var(--bg3); border-bottom:1px solid var(--border); }
.tbl thead th {
  padding:10px 12px; text-align:left; white-space:nowrap;
  color:var(--text2); font-weight:500; font-size:11px; letter-spacing:.04em;
  cursor:pointer; user-select:none;
}
.tbl thead th:hover { color:var(--accent); }
.tbl tbody tr:nth-child(odd)  { background: var(--row-a); }
.tbl tbody tr:nth-child(even) { background: var(--row-b); }
.tbl tbody tr { border-bottom:1px solid var(--border); transition:background .1s; }
.tbl tbody tr:hover { background: var(--accentbg) !important; }
.tbl td { padding:8px 12px; white-space:nowrap; color:var(--text2); }
.tbl-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--border); }

/* ── Tags ── */
.tag {
  display:inline-block; padding:2px 7px; border-radius:5px;
  font-size:11px; font-family:'Geist Mono',monospace;
  margin:1px; line-height:1.4;
}

/* ── Badge ── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 8px; border-radius:20px; font-size:11px; font-weight:500;
}

/* ── Animations ── */
.fade-in { animation: fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;} }
.spin { animation: spin 1s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg);} }

/* ── Toast ── */
.toast-wrap {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:100; pointer-events:none;
  animation: toastIn .25s ease, toastOut .25s ease 2.75s forwards;
}
@keyframes toastIn  { from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);} }
@keyframes toastOut { to{opacity:0;} }

/* ── Modal ── */
.modal-backdrop {
  position:fixed; inset:0; z-index:50;
  background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:16px; width:100%; max-width:680px;
  max-height:90vh; display:flex; flex-direction:column;
  box-shadow: var(--shadow);
}
.modal-header { padding:20px 24px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
.modal-body   { overflow-y:auto; flex:1; padding:20px 24px; min-height:0; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); flex-shrink:0; display:flex; justify-content:space-between; gap:8px; }

/* ── Step pills ── */
.step-pill {
  flex:1; text-align:center; padding:6px 4px;
  font-size:12px; border-radius:8px;
  border:1px solid var(--border); color:var(--text3);
}
.step-pill.done    { background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.3); color:var(--green); }
.step-pill.current { background:var(--accentbg); border-color:var(--accentbdr); color:var(--accent); }

/* ── KPI cards ── */
.kpi { display:flex; flex-direction:column; gap:6px; }
.kpi-value { font-size:24px; font-weight:700; font-family:'Geist Mono',monospace; line-height:1.1; }
.kpi-label { font-size:11px; color:var(--text3); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }

/* ── Sim bar ── */
.sim-track { height:5px; background:var(--bg3); border-radius:3px; flex:1; overflow:hidden; }
.sim-fill  { height:100%; border-radius:3px; transition:width .3s; }

/* ── Theme toggle ── */
.theme-toggle {
  display:flex; align-items:center; gap:0; background:var(--bg3); border:1px solid var(--border);
  border-radius:8px; overflow:hidden; padding:2px;
}
.theme-opt {
  padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer;
  color:var(--text3); background:none; border:none; font-family:inherit; transition:all .15s;
  display:flex; align-items:center; gap:5px;
}
.theme-opt.active { background:var(--bg2); color:var(--text); box-shadow:var(--shadow-sm); }

/* ── Access denied ── */
.access-denied { display:flex; flex-direction:column; align-items:center; padding:80px 20px; gap:16px; }
.access-icon { width:56px; height:56px; border-radius:14px; background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); display:flex; align-items:center; justify-content:center; }

/* ── Filter bar ── */
.filter-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }

/* ── Metric row in antifraud ── */
.metric-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
.metric-row:last-child { border-bottom:none; }

/* ── Risk pill colors ── */
.risk-high   { background:rgba(248,113,113,.12); color:var(--red);   border:1px solid rgba(248,113,113,.25); }
.risk-medium { background:rgba(251,191,36,.10);  color:var(--amber); border:1px solid rgba(251,191,36,.25); }
.risk-low    { background:rgba(52,211,153,.10);  color:var(--green); border:1px solid rgba(52,211,153,.25); }

/* Auth page */
.auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
.auth-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:20px; padding:40px; max-width:360px; width:100%; text-align:center;
  box-shadow: var(--shadow);
}
</style>
</head>

/* ═══════════════════════════════════════════
   THEME
═══════════════════════════════════════════ */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('pa_theme') || 'dark'; } catch{ return 'dark'; }
  });
  const toggle = (t) => {
    setTheme(t);
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('pa_theme', t); } catch{}
  };
  return [theme, toggle];
}

/* ═══════════════════════════════════════════
   SESSION PERSISTENCE
═══════════════════════════════════════════ */
function loadSession() {
  try {
    const s = localStorage.getItem('pa_session');
    if(!s) return null;
    const parsed = JSON.parse(s);
    // expire after 8 hours
    if(Date.now() - parsed.ts > 8 * 3600 * 1000) { localStorage.removeItem('pa_session'); return null; }
    return parsed.user;
  } catch{ return null; }
}
function saveSession(user) {
  try { localStorage.setItem('pa_session', JSON.stringify({user, ts: Date.now()})); } catch{}
}
function clearSession() {
  try { localStorage.removeItem('pa_session'); } catch{}
}

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
const today = new Date();
const derive = p => ({
  ...p,
  days_since_registration: Math.max(0, Math.floor((today - new Date(p.created_at)) / 86400000)),
  net_balance:     (p.total_deposit||0) - (p.total_withdrawal||0), // positive=profit, negative=company loss
  withdrawal_rate: p.total_deposit > 0 ? p.total_withdrawal / p.total_deposit : 0,
});
const fmt  = (n,d=2) => typeof n==='number' ? n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}) : String(n??'—');
const fmtI = n => typeof n==='number' ? n.toLocaleString('en-US',{maximumFractionDigits:0}) : String(n??'—');

const wrColor  = r => r < .3 ? 'var(--green)' : r < .7 ? 'var(--amber)' : 'var(--red)';
const netColor = n => n >= 0 ? 'var(--green)' : 'var(--red)';

// Sim score 0-1 → red to green
const simColor = s => {
  const v = Math.max(0, Math.min(1, s));
  const r = Math.round(248 - v*(248-52));
  const g = Math.round(113 + v*(211-113));
  const b = Math.round(113 + v*(153-113));
  return `rgb(${r},${g},${b})`;
};

const splitVal = v => String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
const hasVal   = (field, flt) => !flt || splitVal(field).some(v=>v.toLowerCase().includes(flt.toLowerCase()));

const devCat = dev => {
  if(!dev) return '';
  const d = dev.toLowerCase();
  if(d.includes('mobile')||d.includes('android')||d.includes('ios')||d.includes('phone')) return 'Mobile';
  if(d.includes('tablet')||d.includes('ipad')) return 'Tablet';
  if(d.includes('desktop')||d.includes('pc')||d.includes('mac')||d.includes('windows')||d.includes('linux')) return 'Desktop';
  return dev;
};

  {key:'currency',          label:'Currency',          type:'text'},
  {key:'asn',               label:'ASN (multi)',        type:'text'},
  {key:'country',           label:'Country (multi)',    type:'text'},
  {key:'device',            label:'Device',            type:'text'},
  {key:'limit',             label:'Limit',             type:'text'},
  {key:'created_at',        label:'Created At',        type:'date'},
];
const FIELD_KW = {
  user_id:['user','id','uid','player'],
  payment_method:['payment','method','pay'],
  deposit_wallet:['deposit_wallet','dep_wallet','кошелек','wallet'],
  withdrawal_wallet:['withdrawal_wallet','with_wallet'],
  total_deposit:['total_deposit','deposit','сумма'],
  total_withdrawal:['total_withdrawal','withdrawal','вывод'],
  currency:['currency','валюта','curr'],
  asn:['asn','autonomous','isp'],
  country:['country','страна','geo'],
  device:['device','устройство','platform'],
  limit:['limit','лимит','cap'],
  created_at:['created','date','дата','reg'],
};
const fuzzyMap = headers => {
  const r={};
  for(const [f,kws] of Object.entries(FIELD_KW))
    r[f] = headers.find(h=>kws.some(kw=>h.toLowerCase().includes(kw)))||'';
  return r;
};

/* ═══════════════════════════════════════════
   ROBUST CSV PARSER
═══════════════════════════════════════════ */
function detectSep(line) {
  let tabs=0,commas=0,semis=0,inQ=false;
  for(const c of line){
    if(c==='"'){inQ=!inQ; continue;}
    if(inQ) continue;
    if(c==='\t')tabs++;
    else if(c===',')commas++;
    else if(c===';')semis++;
  }
  if(tabs>=commas&&tabs>=semis) return '\t';
  if(semis>commas) return ';';
  return ',';
}
function parseCSV(text, sep) {
  const rows=[]; let row=[], cur='', inQ=false;
  const push = () => { row.push(cur.trim()); cur=''; };
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){cur+='"';i++;}
      else if(c==='"'){inQ=false;}
      else cur+=c;
    } else {
      if(c==='"'){inQ=true;}
      else if(c===sep){push();}
      else if(c==='\r'&&n==='\n'){push();rows.push(row);row=[];cur='';i++;}
      else if(c==='\n'){push();rows.push(row);row=[];cur='';}
      else cur+=c;
    }
  }
  push(); if(row.some(v=>v!==''))rows.push(row);
  return rows;
}
function parseRaw(text) {
  if(!text||!text.trim()) return {headers:[],rows:[]};
  const firstLine = text.split(/\r?\n/)[0];
  const sep = detectSep(firstLine);
  const all = parseCSV(text, sep);
  if(all.length<2) return {headers:[],rows:[]};
  return {headers: all[0].map(h=>h.trim()), rows: all.slice(1).filter(r=>r.some(v=>v!==''))};
}

async function sheetsGet(){
  try{
    const r = await fetch(CFG.APPS_SCRIPT_URL+'?action=get');
    const j = await r.json();
    return Array.isArray(j.players)?j.players:[];
  }catch{return[];}
}
async function sheetsPost(players){
  try{
    await fetch(CFG.APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',players})});
  }catch{}
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function Toast({message,type='ok',onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t);},[]);
  const icon = type==='ok'?'check':type==='warn'?'warning':'alert';
  const col  = type==='ok'?'var(--green)':type==='warn'?'var(--amber)':'var(--red)';
  return(
    <div className="toast-wrap">
      <div className="card" style={{display:'flex',alignItems:'center',gap:10,padding:'10px 18px',borderColor:col+'55',boxShadow:`0 4px 20px rgba(0,0,0,.3), 0 0 0 1px ${col}22`}}>
        <Icon name={icon} size={14} style={{color:col}}/>
        <span style={{fontSize:13,color:'var(--text)'}}>{message}</span>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAGS
═══════════════════════════════════════════ */
function Tags({value,color}){
  const vals = splitVal(value);
  if(!vals.length) return <span style={{color:'var(--text3)'}}>—</span>;
  return <>{vals.map((v,i)=>(
    <span key={i} className="tag" style={{background:(color||'var(--accent)')+'18',color:color||'var(--accent)'}}>{v}</span>
  ))}</>;
}

/* ═══════════════════════════════════════════
   IMPORT MODAL
═══════════════════════════════════════════ */
function ImportModal({onClose,onImport}){
  const [step,setStep]   = useState(1);
  const [raw,setRaw]     = useState('');
  const [info,setInfo]   = useState('');
  const [parsed,setParsed] = useState({headers:[],rows:[]});
  const [mapping,setMapping] = useState({});
  const [sending,setSending] = useState(false);
  const fileRef = useRef(null);

  const loadFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext==='xlsx'||ext==='xls'){
      const fr = new FileReader();
      fr.onload = ev => {
        try{
          const wb = XLSX.read(ev.target.result,{type:'array',cellDates:true,cellText:false});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const arr = XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
          if(!arr||arr.length<2){alert('Файл пустой');return;}
          const txt = arr.map(row=>row.map(c=>String(c??'').replace(/\t/g,' ').replace(/\n/g,' ')).join('\t')).join('\n');
          setRaw(txt);
          setInfo(`${file.name} · ${arr.length-1} строк · ${arr[0].length} колонок`);
        }catch(err){alert('Ошибка Excel: '+err.message);}
      };
      fr.readAsArrayBuffer(file);
    } else {
      const fr = new FileReader();
      fr.onload = ev => { setRaw(ev.target.result); setInfo(file.name); };
      fr.readAsText(file,'UTF-8');
    }
    e.target.value='';
  };

  const doParse = () => {
    if(!raw.trim()){alert('Нет данных');return;}
    const p = parseRaw(raw);
    if(!p.headers.length){alert('Не удалось распарсить. Проверьте формат.');return;}
    const firstLine = raw.split(/\r?\n/)[0];
    const sep = detectSep(firstLine);
    const sepName = sep==='\t'?'Tab':sep===';'?'Точка с запятой':' Запятая';
    setInfo(prev=>prev+` · Разделитель: ${sepName} · Колонок: ${p.headers.length} · Строк: ${p.rows.length}`);
    setParsed(p); setMapping(fuzzyMap(p.headers)); setStep(2);
  };

  const preview = useMemo(()=>{
    if(step<3) return [];
    return parsed.rows.map(row=>{
      const obj={};
      for(const {key} of SYSTEM_FIELDS){
        const col=mapping[key]; const idx=col?parsed.headers.indexOf(col):-1;
        let val=idx>=0?row[idx]:'';
        if(['total_deposit','total_withdrawal'].includes(key)) val=parseFloat(val)||0;
        obj[key]=val;
      }
      return obj;
    });
  },[step,parsed,mapping]);

  const doImport = async () => {
    setSending(true);
    const m=new Map();
    for(const p of preview){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    const final=[...m.values()];
    await sheetsPost(final);
    onImport(final); setSending(false); onClose();
  };

  const STEPS=['Загрузить данные','Маппинг','Предпросмотр'];

  return(
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal fade-in">
        <div className="modal-header">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <Icon name="upload" size={16} style={{color:'var(--accent)'}}/>
              <span style={{fontWeight:600,fontSize:15}}>Импорт данных</span>
            </div>
            <button className="btn btn-ghost" style={{padding:'5px 8px'}} onClick={onClose}><Icon name="x" size={14}/></button>
          </div>
          <div style={{display:'flex',gap:6}}>
            {STEPS.map((s,i)=>(
              <div key={i} className={`step-pill ${step===i+1?'current':step>i+1?'done':''}`}>
                <span style={{marginRight:4}}>{step>i+1?'✓':i+1}</span>{s}
              </div>
            ))}
          </div>
        </div>

        <div className="modal-body">
          {step===1&&(
            <div className="fade-in">
              <div
                onClick={()=>fileRef.current.click()}
                style={{border:'2px dashed var(--border2)',borderRadius:10,padding:32,textAlign:'center',cursor:'pointer',transition:'border-color .15s'}}
                onMouseOver={e=>e.currentTarget.style.borderColor='var(--accent)'}
                onMouseOut={e=>e.currentTarget.style.borderColor='var(--border2)'}>
                <Icon name="file" size={32} style={{color:'var(--text3)',margin:'0 auto 10px'}}/>
                <p style={{color:'var(--text2)',fontSize:13,marginBottom:4}}>Кликните для выбора файла</p>
                <p style={{color:'var(--text3)',fontSize:12}}>Excel (.xlsx .xls), CSV, TSV, TXT</p>
                {info&&<p style={{color:'var(--accent)',fontSize:12,marginTop:10,fontFamily:'Geist Mono,monospace'}}>{info}</p>}
              </div>
              <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" style={{display:'none'}} onChange={loadFile}/>
              <div style={{display:'flex',alignItems:'center',gap:10,margin:'16px 0',color:'var(--text3)',fontSize:12}}>
                <div style={{flex:1,height:1,background:'var(--border)'}}/>или вставьте текст вручную<div style={{flex:1,height:1,background:'var(--border)'}}/>
              </div>
              <textarea className="input mono" style={{height:140,resize:'none',display:'block'}}
                placeholder={"user_id\tpayment_method\tcountry\ttotal_deposit\n12345\tCard\tRU,KZ\t1500.50"}
                value={raw} onChange={e=>setRaw(e.target.value)}/>
              <p style={{color:'var(--text3)',fontSize:11,marginTop:8}}>
                💡 Страна и ASN поддерживают несколько значений через запятую: <span style={{fontFamily:'monospace'}}>RU,KZ</span>
              </p>
            </div>
          )}
          {step===2&&(
            <div className="fade-in">
              {info&&<div style={{background:'var(--accentbg)',border:'1px solid var(--accentbdr)',borderRadius:8,padding:'8px 12px',marginBottom:14,fontSize:12,fontFamily:'monospace',color:'var(--accent)'}}>{info}</div>}
              <p style={{color:'var(--text2)',fontSize:13,marginBottom:14}}>Сопоставьте поля системы с колонками таблицы</p>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {SYSTEM_FIELDS.map(({key,label})=>(
                  <div key={key} style={{display:'flex',alignItems:'center',gap:12}}>
                    <span style={{fontSize:13,color:'var(--text2)',width:160,flexShrink:0}}>{label}</span>
                    <select className="input" value={mapping[key]||''} onChange={e=>setMapping(m=>({...m,[key]:e.target.value}))}>
                      <option value="">— не выбрано —</option>
                      {parsed.headers.map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>
                ))}
              </div>
            </div>
          )}
          {step===3&&(
            <div className="fade-in">
              <p style={{color:'var(--text2)',fontSize:13,marginBottom:14}}>
                Предпросмотр · Всего: <span style={{color:'var(--accent)',fontWeight:600}}>{preview.length}</span> записей
              </p>
              <div className="tbl-wrap">
                <table className="tbl">
                  <thead><tr>{SYSTEM_FIELDS.map(f=><th key={f.key}>{f.label}</th>)}</tr></thead>
                  <tbody>{preview.slice(0,10).map((row,i)=>(
                    <tr key={i}>{SYSTEM_FIELDS.map(f=>(
                      <td key={f.key} style={{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis'}}>
                        {row[f.key]!==undefined?String(row[f.key]):'—'}
                      </td>
                    ))}</tr>
                  ))}</tbody>
                </table>
              </div>
              {preview.length>10&&<p style={{color:'var(--text3)',fontSize:12,marginTop:8,textAlign:'center'}}>…и ещё {preview.length-10} строк</p>}
            </div>
          )}
        </div>

        <div className="modal-footer">
          {step>1
            ?<button className="btn btn-ghost" onClick={()=>setStep(s=>s-1)}><Icon name="arrowLeft" size={14}/>Назад</button>
            :<div/>}
          {step===1&&<button className="btn btn-primary" onClick={doParse} disabled={!raw.trim()}><Icon name="arrowRight" size={14}/>Распарсить</button>}
          {step===2&&<button className="btn btn-primary" onClick={()=>setStep(3)}><Icon name="arrowRight" size={14}/>Предпросмотр</button>}
          {step===3&&<button className="btn btn-primary" onClick={doImport} disabled={sending||!preview.length}>
            <Icon name="upload" size={14}/>{sending?'Отправка…':`Импортировать ${preview.length} записей`}
          </button>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 1 — PLAYER BASE
═══════════════════════════════════════════ */
function PlayerBase({players,setPlayers,loading,userEmail}){
  const admin = isAdmin(userEmail);
  const [showModal,setShowModal] = useState(false);
  const [showAdd,setShowAdd]     = useState(false);
  const [fCountry,setFC] = useState('');
  const [fDevice,setFD]  = useState('');
  const [fCurr,setFCurr] = useState('');
  const [sort,setSort]   = useState({col:'created_at',dir:'desc'});
  const [toast,setToast] = useState(null);
  const [np,setNp]       = useState({});
  const [syncing,setSyncing] = useState(false);

  const derived = useMemo(()=>players.map(derive),[players]);
  const allCountries  = useMemo(()=>[...new Set(derived.flatMap(p=>splitVal(p.country)))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);
  const allDevCats    = useMemo(()=>[...new Set(derived.map(p=>devCat(p.device)).filter(Boolean))].sort(),[derived]);
  const hasF = fCountry||fDevice||fCurr;

  const filtered = useMemo(()=>{
    let d = derived;
    if(fCountry) d = d.filter(p=>splitVal(p.country).includes(fCountry));
    if(fDevice)  d = d.filter(p=>devCat(p.device)===fDevice);
    if(fCurr)    d = d.filter(p=>p.currency===fCurr);
    return [...d].sort((a,b)=>{
      const av=a[sort.col],bv=b[sort.col];
      const cmp=typeof av==='number'?av-bv:String(av||'').localeCompare(String(bv||''));
      return sort.dir==='asc'?cmp:-cmp;
    });
  },[derived,fCountry,fDevice,fCurr,sort]);

  const toggleSort = col => setSort(s=>({col,dir:s.col===col&&s.dir==='asc'?'desc':'asc'}));
  const clearF = () => { setFC(''); setFD(''); setFCurr(''); };

  const dedup = () => {
    const m=new Map();
    for(const p of players){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    setPlayers([...m.values()]);
    setToast({msg:`Удалено ${players.length-m.size} дублей`,type:'ok'});
  };

  const handleImport = newP => {
    setPlayers(prev=>{
      const m=new Map(prev.map(p=>[p.user_id,p]));
      for(const p of newP){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
      return[...m.values()];
    });
    setToast({msg:`Импортировано ${newP.length} записей`,type:'ok'});
  };

  const syncNow = async () => {
    setSyncing(true);
    const d = await sheetsGet();
    if(d.length){setPlayers(d);setToast({msg:`Загружено ${d.length} записей`,type:'ok'});}
    else setToast({msg:'Нет данных в Sheets',type:'warn'});
    setSyncing(false);
  };

  const addP = () => {
    if(!np.user_id) return;
    setPlayers(prev=>[...prev,{...np,total_deposit:parseFloat(np.total_deposit)||0,total_withdrawal:parseFloat(np.total_withdrawal)||0}]);
    setNp({}); setShowAdd(false); setToast({msg:'Игрок добавлен',type:'ok'});
  };

  const devStyle = d => {
    const c=devCat(d);
    return c==='Mobile'?{background:'rgba(56,189,248,.12)',color:'var(--accent)'}
          :c==='Desktop'?{background:'rgba(167,139,250,.12)',color:'var(--violet)'}
          :c==='Tablet'?{background:'rgba(251,191,36,.12)',color:'var(--amber)'}
          :{background:'var(--bg3)',color:'var(--text3)'};
  };

  const COLS=[
    {key:'user_id',label:'Пользователь'},
    {key:'payment_method',label:'Метод депозита'},
    {key:'total_deposit',label:'Сумма депа'},
    {key:'total_withdrawal',label:'Сумма вывода'},
    {key:'net_balance',label:'Net (доход)'},
    {key:'currency',label:'Валюта'},
    {key:'country',label:'Страна'},
    {key:'asn',label:'ASN'},
    {key:'device',label:'Устройство'},
    {key:'deposit_wallet',label:'Кошелёк депозита'},
    {key:'withdrawal_wallet',label:'Кошелёк вывода'},
    {key:'created_at',label:'Дата создания'},
    {key:'limit',label:'Limit'},
    {key:'days_since_registration',label:'Дней'},
  ];

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      {showModal&&<ImportModal onClose={()=>setShowModal(false)} onImport={handleImport}/>}

      {/* Toolbar */}
      <div className="filter-bar">
        {admin&&<button className="btn btn-primary" onClick={()=>setShowModal(true)}><Icon name="upload" size={14}/>Загрузить файл</button>}
        <button className="btn btn-ghost" onClick={syncNow} disabled={syncing}>
          <span className={syncing?'spin':''}><Icon name="refresh" size={14}/></span>
          {syncing?'Обновление…':'Обновить из Sheets'}
        </button>
        {admin&&<button className="btn btn-ghost" onClick={()=>setShowAdd(s=>!s)}><Icon name="plus" size={14}/>Добавить</button>}
        {admin&&<button className="btn btn-ghost" onClick={dedup}><Icon name="copy" size={14}/>Очистить дубли</button>}
        <div style={{flex:1}}/>
        <select className="input" style={{width:'auto'}} value={fCountry} onChange={e=>setFC(e.target.value)}>
          <option value="">Все страны</option>{allCountries.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="input" style={{width:'auto'}} value={fDevice} onChange={e=>setFD(e.target.value)}>
          <option value="">Все устройства</option>{allDevCats.map(d=><option key={d}>{d}</option>)}
        </select>
        <select className="input" style={{width:'auto'}} value={fCurr} onChange={e=>setFCurr(e.target.value)}>
          <option value="">Все валюты</option>{allCurrencies.map(c=><option key={c}>{c}</option>)}
        </select>
        {hasF&&<button className="btn btn-danger" onClick={clearF}><Icon name="xCircle" size={13}/>Сбросить</button>}
      </div>

      {/* Inline add */}
      {showAdd&&admin&&(
        <div className="card fade-in" style={{marginBottom:16}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12,marginBottom:12}}>
            {SYSTEM_FIELDS.map(({key,label,type})=>(
              <div key={key}>
                <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.05em'}}>{label}</label>
                <input type={type==='number'?'number':'text'} className="input" value={np[key]||''} onChange={e=>setNp(p=>({...p,[key]:e.target.value}))}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" onClick={addP}><Icon name="check" size={13}/>Сохранить</button>
            <button className="btn btn-ghost" onClick={()=>setShowAdd(false)}><Icon name="x" size={13}/>Отмена</button>
          </div>
        </div>
      )}

      {/* Stats row */}
      <div style={{display:'flex',gap:16,marginBottom:12,fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>
        <span>Показано: <span style={{color:'var(--accent)',fontWeight:600}}>{filtered.length}</span></span>
        <span>Всего: <span style={{color:'var(--text)'}}>{players.length}</span></span>
        {loading&&<span style={{color:'var(--accent)'}}>● Загрузка из Sheets…</span>}
      </div>

      {/* Table */}
      <div className="tbl-wrap">
        <table className="tbl">
          <thead>
            <tr>{COLS.map(c=><th key={c.key} onClick={()=>toggleSort(c.key)}>{c.label}<SortIcon col={c.key} sort={sort}/></th>)}</tr>
          </thead>
          <tbody>
            {!filtered.length?(
              <tr><td colSpan={COLS.length} style={{textAlign:'center',padding:'60px 20px',color:'var(--text3)'}}>
                {loading?'Загрузка данных…':'Нет данных. Импортируйте или обновите из Sheets.'}
              </td></tr>
            ):filtered.map((p,i)=>(
              <tr key={p.user_id+i}>
                <td style={{color:'var(--accent)',fontWeight:500}}>{p.user_id}</td>
                <td>{p.payment_method||'—'}</td>
                <td style={{color:'var(--green)',fontWeight:500}}>{fmt(p.total_deposit)}</td>
                <td style={{color:'var(--red)'}}>{fmt(p.total_withdrawal)}</td>
                <td style={{color:netColor(p.net_balance),fontWeight:500}}>{fmt(p.net_balance)}</td>
                <td>{p.currency||'—'}</td>
                <td><Tags value={p.country} color="var(--accent)"/></td>
                <td><Tags value={p.asn} color="var(--violet)"/></td>
                <td><span className="tag" style={devStyle(p.device)}>{p.device||'—'}</span></td>
                <td style={{color:'var(--text3)',fontSize:11}}>{p.deposit_wallet||'—'}</td>
                <td style={{color:'var(--text3)',fontSize:11}}>{p.withdrawal_wallet||'—'}</td>
                <td style={{color:'var(--text3)'}}>{p.created_at||'—'}</td>
                <td style={{color:'var(--amber)'}}>{p.limit||'—'}</td>
                <td style={{color:'var(--text3)'}}>{p.days_since_registration}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 2 — LOOK-ALIKE
═══════════════════════════════════════════ */
function LookAlike({players}){
  const derived = useMemo(()=>players.map(derive),[players]);
  // Limit dropdowns: country top-30, ASN top-20 by frequency
  const allCountries  = useMemo(()=>{
    const cnt={}; derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([v])=>v);
  },[derived]);
  const allAsns       = useMemo(()=>{
    const cnt={}; derived.flatMap(p=>splitVal(p.asn)).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([v])=>v);
  },[derived]);
  const allMethods    = useMemo(()=>[...new Set(derived.map(p=>p.payment_method).filter(Boolean))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);
  const DEV_CATS = ['Mobile','Desktop','Tablet'];

  const EMPTY = {country:'',asn:'',payment_method:'',device:'',currency:'',min_deposit:'',max_deposit:''};
  const [filters,setFilters] = useState(EMPTY);
  const [results,setResults] = useState([]);
  const [ran,setRan] = useState(false);
  const ff = (k,v) => setFilters(f=>({...f,[k]:v}));
  const hasF = Object.values(filters).some(Boolean);

  const run = () => {
    const active = Object.entries(filters).filter(([,v])=>v);
    if(!active.length){ setResults([]); setRan(true); return; }

    // Weights: categorical identifiers score higher
    const W = {country:2.5, asn:2.5, payment_method:2, currency:2, device:1.5, min_deposit:1, max_deposit:1};
    const totalW = active.reduce((s,[k])=>s+(W[k]||1), 0);

    const score = p => {
      let earned = 0;
      active.forEach(([k,v])=>{
        const w = W[k]||1;
        if(k==='country')        { if(hasVal(p.country,v)) earned+=w; }
        else if(k==='asn')       { if(hasVal(p.asn,v)) earned+=w; }
        else if(k==='payment_method'){ if(p.payment_method?.toLowerCase().includes(v.toLowerCase())) earned+=w; }
        else if(k==='device')    { if(devCat(p.device)===v) earned+=w; }
        else if(k==='currency')  { if(p.currency===v) earned+=w; }
        else if(k==='min_deposit'){
          const min=Number(v);
          earned += min>0 ? w*Math.min(1, p.total_deposit/min) : w;
        }
        else if(k==='max_deposit'){
          const max=Number(v);
          earned += max>0 ? w*(p.total_deposit<=max ? 1 : Math.max(0, 1-(p.total_deposit-max)/max)) : w;
        }
      });
      return totalW>0 ? earned/totalW : 0;
    };

    // Score ALL players, show top 20 with score > 0
    const res = derived
      .map(p=>({...p, similarity_score:score(p)}))
      .filter(p=>p.similarity_score>0)
      .sort((a,b)=>b.similarity_score-a.similarity_score)
      .slice(0,20);
    setResults(res); setRan(true);
  };

  return(
    <div className="fade-in">
      <div className="card" style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <Icon name="filter" size={15} style={{color:'var(--accent)'}}/>
            <span style={{fontWeight:600,fontSize:15}}>Фильтр базы игроков</span>
          </div>
          {hasF&&<button className="btn btn-danger" onClick={()=>setFilters(EMPTY)}><Icon name="xCircle" size={13}/>Очистить фильтры</button>}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:14}}>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Страна</label>
            <input className="input" list="la-cnt" placeholder="все или выберите…" value={filters.country} onChange={e=>ff('country',e.target.value)}/>
            <datalist id="la-cnt">{allCountries.map(c=><option key={c} value={c}/>)}</datalist>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>ASN</label>
            <input className="input" list="la-asn" placeholder="все или введите…" value={filters.asn} onChange={e=>ff('asn',e.target.value)}/>
            <datalist id="la-asn">{allAsns.map(a=><option key={a} value={a}/>)}</datalist>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Метод оплаты</label>
            <input className="input" list="la-mth" placeholder="все или выберите…" value={filters.payment_method} onChange={e=>ff('payment_method',e.target.value)}/>
            <datalist id="la-mth">{allMethods.map(m=><option key={m} value={m}/>)}</datalist>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Устройство</label>
            <select className="input" value={filters.device} onChange={e=>ff('device',e.target.value)}>
              <option value="">Все устройства</option>
              {DEV_CATS.map(d=><option key={d}>{d}</option>)}
            </select>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Валюта</label>
            <select className="input" value={filters.currency} onChange={e=>ff('currency',e.target.value)}>
              <option value="">Все валюты</option>
              {allCurrencies.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Депозит (от / до)</label>
            <div style={{display:'flex',gap:8}}>
              <input type="number" className="input" placeholder="от" value={filters.min_deposit} onChange={e=>ff('min_deposit',e.target.value)}/>
              <input type="number" className="input" placeholder="до" value={filters.max_deposit} onChange={e=>ff('max_deposit',e.target.value)}/>
            </div>
          </div>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:12,marginTop:18,paddingTop:16,borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-primary" onClick={run} disabled={!players.length}>
            <Icon name="search" size={14}/>Найти похожих
          </button>
          {ran&&<span style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>Найдено: {results.length}</span>}
        </div>
      </div>

      {ran&&(
        <div className="tbl-wrap fade-in">
          <table className="tbl">
            <thead><tr>
              {['#','User ID','Схожесть','Страна','ASN','Устройство','Депозит','Net','Валюта','Метод','Limit'].map(h=><th key={h}>{h}</th>)}
            </tr></thead>
            <tbody>
              {!results.length?(
                <tr><td colSpan={11} style={{textAlign:'center',padding:'50px 20px',color:'var(--text3)'}}>Нет результатов по заданным фильтрам</td></tr>
              ):results.map((p,i)=>{
                const sc=Math.max(0,Math.min(1,p.similarity_score));
                const col=simColor(sc);
                return(
                  <tr key={p.user_id+i}>
                    <td style={{color:'var(--text3)'}}>{i+1}</td>
                    <td style={{color:'var(--accent)',fontWeight:500}}>{p.user_id}</td>
                    <td style={{minWidth:160}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div className="sim-track">
                          <div className="sim-fill" style={{width:`${(sc*100).toFixed(0)}%`,background:col}}/>
                        </div>
                        <span style={{color:col,fontSize:11,fontFamily:'Geist Mono,monospace',minWidth:34,textAlign:'right'}}>{(sc*100).toFixed(0)}%</span>
                      </div>
                    </td>
                    <td><Tags value={p.country} color="var(--accent)"/></td>
                    <td><Tags value={p.asn} color="var(--violet)"/></td>
                    <td>{p.device||'—'}</td>
                    <td style={{color:'var(--green)',fontWeight:500}}>{fmt(p.total_deposit)}</td>
                    <td style={{color:netColor(p.net_balance),fontWeight:500}}>{fmt(p.net_balance)}</td>
                    <td>{p.currency||'—'}</td>
                    <td>{p.payment_method||'—'}</td>
                    <td style={{color:'var(--amber)'}}>{p.limit||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 3 — ANALYTICS  (antifraud metrics)
═══════════════════════════════════════════ */
function ChartCanvas({data,type='bar',color='var(--accent)',id}){
  const ref=useRef(null); const ch=useRef(null);
  useEffect(()=>{
    if(!ref.current||!data?.length) return;
    ch.current?.destroy();
    const isDark = document.documentElement.getAttribute('data-theme')!=='light';
    const gridC = isDark?'#1f2d45':'#e2e8f0';
    const textC = isDark?'#4b6080':'#94a3b8';
    const baseColor = color.startsWith('var(')
      ? getComputedStyle(document.documentElement).getPropertyValue(color.slice(4,-1).trim()).trim()
      : color;
    if(type==='bar'){
      ch.current=new Chart(ref.current,{type:'bar',data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.value),backgroundColor:baseColor+'bb',borderColor:baseColor,borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:textC,font:{size:10}},grid:{color:gridC}},y:{ticks:{color:textC,font:{size:10}},grid:{color:gridC}}}}});
    } else if(type==='scatter'){
      ch.current=new Chart(ref.current,{type:'scatter',data:{datasets:data},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textC,font:{size:10}}}},scales:{x:{title:{display:true,text:'Депозит',color:textC},ticks:{color:textC},grid:{color:gridC}},y:{title:{display:true,text:'Net',color:textC},ticks:{color:textC},grid:{color:gridC}}}}});
    } else if(type==='doughnut'){
      ch.current=new Chart(ref.current,{type:'doughnut',data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.value),backgroundColor:data.map(d=>d.color||baseColor),borderColor:'transparent',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'right',labels:{color:textC,font:{size:10},boxWidth:10,padding:10}}}}});
    }
    return()=>ch.current?.destroy();
  },[data]);
  return <div style={{height:180}}><canvas ref={ref}/></div>;
}

function Analytics({players}){
  const derived = useMemo(()=>players.map(derive),[players]);
  const n = derived.length;

  // ── KPI ──
  const totalPlayers   = n;
  const avgDeposit     = n ? derived.reduce((s,p)=>s+p.total_deposit,0)/n : 0;
  const avgNet         = n ? derived.reduce((s,p)=>s+p.net_balance,0)/n : 0;
  const topCountry     = useMemo(()=>{const c={};derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';},[derived]);

  const avgDays = n ? Math.round(derived.reduce((s,p)=>s+p.days_since_registration,0)/n) : 0;

  // Top 5 ASNs
  const asnMap={};
  derived.flatMap(p=>splitVal(p.asn)).forEach(v=>{if(v)asnMap[v]=(asnMap[v]||0)+1;});
  const topAsns = Object.entries(asnMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ── Chart data ──
  const countryData = useMemo(()=>{const c={};derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,value])=>({label,value}));},[derived]);
  const methodData  = useMemo(()=>{const c={};derived.forEach(p=>{if(p.payment_method)c[p.payment_method]=(c[p.payment_method]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));},[derived]);
  const devData     = useMemo(()=>{const c={};derived.forEach(p=>{const d=devCat(p.device)||'Other';c[d]=(c[d]||0)+1;});const colors={'Mobile':'#38bdf8','Desktop':'#a78bfa','Tablet':'#fbbf24','Other':'#64748b'};return Object.entries(c).map(([label,value])=>({label,value,color:colors[label]||'#64748b'}));},[derived]);

  // Scatter by device
  const scatterDevices={'Mobile':'#38bdf8','Desktop':'#a78bfa','Tablet':'#fbbf24'};
  const scatterData = Object.entries(scatterDevices).map(([dev,color])=>({
    label:dev, pointRadius:4,
    backgroundColor:color+'99',
    data: derived.filter(p=>devCat(p.device)===dev).map(p=>({x:p.total_deposit,y:p.net_balance}))
  }));

  const KPI = ({label,value,color,icon,sub})=>(
    <div className="card-sm">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
        <span style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:500}}>{label}</span>
        <Icon name={icon} size={14} style={{color:color||'var(--accent)'}}/>
      </div>
      <div className="kpi-value" style={{color:color||'var(--text)'}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>{sub}</div>}
    </div>
  );

  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      {/* Main KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:12}}>
        <KPI label="Всего игроков" value={fmtI(totalPlayers)} icon="users"/>
        <KPI label="Средний депозит" value={'$'+fmt(avgDeposit)} color="var(--green)" icon="trending"/>
        <KPI label="Средний Net (доход компании)" value={'$'+fmt(avgNet)} color={avgNet>=0?'var(--green)':'var(--red)'} icon="chart" sub={avgNet<0?'компания в минусе':undefined}/>
        <KPI label="Топ страна" value={topCountry} color="var(--accent)" icon="shield"/>
        <KPI label="Ср. дней в базе" value={avgDays} icon="eye" sub="с момента регистрации"/>
      </div>

      {/* Top ASNs table */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
          <Icon name="shield" size={14} style={{color:'var(--accent)'}}/>
          <span style={{fontWeight:600,fontSize:14}}>Топ ASN по числу игроков</span>
        </div>
        <div>
          {topAsns.map(([asn,cnt],i)=>{
            const pct = n?cnt/n:0;
            return(
              <div key={asn} style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
                <span style={{fontSize:11,color:'var(--text3)',width:16,textAlign:'right'}}>{i+1}</span>
                <span style={{fontSize:12,fontFamily:'Geist Mono,monospace',color:'var(--violet)',flex:1}}>{asn}</span>
                <div style={{flex:2,height:5,background:'var(--bg3)',borderRadius:3,overflow:'hidden'}}>
                  <div style={{width:`${(pct*100).toFixed(1)}%`,height:'100%',background:'var(--violet)',borderRadius:3}}/>
                </div>
                <span style={{fontSize:12,fontFamily:'Geist Mono,monospace',color:'var(--text2)',minWidth:28,textAlign:'right'}}>{cnt}</span>
              </div>
            );
          })}
          {!topAsns.length&&<p style={{color:'var(--text3)',fontSize:13}}>Нет данных ASN</p>}
        </div>
      </div>

      {/* Charts row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card">
          <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Топ-8 стран</p>
          <ChartCanvas data={countryData} type="bar" color="var(--accent)"/>
        </div>
        <div className="card">
          <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Устройства</p>
          <ChartCanvas data={devData} type="doughnut"/>
        </div>
        <div className="card">
          <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Методы оплаты</p>
          <ChartCanvas data={methodData} type="bar" color="var(--violet)"/>
        </div>
      </div>

      {/* Deposit vs Net scatter */}
      <div className="card">
        <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Депозит vs Net (по устройству)</p>
        <ChartCanvas data={scatterData} type="scatter"/>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 4 — CLEANUP
═══════════════════════════════════════════ */
function DataCleanup({players,setPlayers}){
  const [toast,setToast] = useState(null);
  const derived = useMemo(()=>players.map(derive),[players]);

  const stats = useMemo(()=>{
    const idC={},wC={};
    derived.forEach(p=>{
      idC[p.user_id]=(idC[p.user_id]||0)+1;
      if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;
    });
    return {
      unknownCountry: derived.filter(p=>!p.country||p.country.toUpperCase()==='UNKNOWN').length,
      zeroDeposit:    derived.filter(p=>p.total_deposit===0).length,
      dupIds:         Object.values(idC).filter(v=>v>1).length,
      dupWallets:     Object.values(wC).filter(v=>v>1).length,
      wrOver1:        derived.filter(p=>p.withdrawal_rate>1).length,
    };
  },[derived]);

  const fixUnknown = useCallback(()=>{
    setPlayers(ps=>ps.map(p=>(!p.country||p.country.toUpperCase()==='UNKNOWN')?{...p,country:'UNKNOWN'}:p));
    setToast({msg:'Пустые страны заменены на UNKNOWN',type:'ok'});
  },[setPlayers]);

  const fixDupIds = useCallback(()=>{
    const m=new Map();
    for(const p of players){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    setPlayers([...m.values()]);
    setToast({msg:'Дубли по user_id удалены',type:'ok'});
  },[players,setPlayers]);

  const fixDupWallets = useCallback(()=>{
    const wC={};
    players.forEach(p=>{if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;});
    const dups=new Set(Object.entries(wC).filter(([,v])=>v>1).map(([k])=>k));
    setPlayers(ps=>ps.map(p=>(p.deposit_wallet&&dups.has(p.deposit_wallet))?{...p,is_linked:true}:p));
    setToast({msg:'Флаг is_linked проставлен',type:'ok'});
  },[players,setPlayers]);

  const fixWrOver1 = useCallback(()=>{
    setPlayers(ps=>ps.map(p=>{const wr=p.total_deposit>0?p.total_withdrawal/p.total_deposit:0;return wr>1?{...p,needs_review:true}:p;}));
    setToast({msg:'Флаг needs_review проставлен',type:'ok'});
  },[setPlayers]);

  const ISSUES=[
    {key:'unk', title:'Пустые / UNKNOWN страны',  desc:'Поле country пустое или "UNKNOWN"',             count:stats.unknownCountry, fix:fixUnknown,     icon:'warning'},
    {key:'zer', title:'Нулевой депозит',           desc:'total_deposit = 0 — только информирование',    count:stats.zeroDeposit,    fix:null,           icon:'alert'},
    {key:'dui', title:'Дубли по user_id',          desc:'Оставить с максимальным депозитом',             count:stats.dupIds,         fix:fixDupIds,      icon:'copy'},
    {key:'duw', title:'Дубли по deposit_wallet',   desc:'Пометить связанные аккаунты → is_linked',      count:stats.dupWallets,     fix:fixDupWallets,  icon:'link'},
    {key:'wr1', title:'Withdrawal rate > 1',       desc:'Вывод превышает депозит → needs_review',       count:stats.wrOver1,        fix:fixWrOver1,     icon:'trending'},
  ];

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
        <Icon name="broom" size={15} style={{color:'var(--accent)'}}/>
        <span style={{color:'var(--text2)',fontSize:14}}>Автосканирование · Игроков: <span style={{color:'var(--accent)',fontWeight:600,fontFamily:'Geist Mono,monospace'}}>{players.length}</span></span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {ISSUES.map(iss=>{
          const ok = iss.count===0;
          return(
            <div key={iss.key} className="card" style={{display:'flex',alignItems:'center',gap:16,borderColor:ok?'var(--border)':iss.count>0?'rgba(248,113,113,.2)':'var(--border)'}}>
              <div style={{width:38,height:38,borderRadius:10,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                background:ok?'rgba(52,211,153,.08)':'rgba(248,113,113,.08)'}}>
                <Icon name={ok?'check':iss.icon} size={16} style={{color:ok?'var(--green)':'var(--red)'}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
                  <span style={{fontSize:12,fontWeight:700,fontFamily:'Geist Mono,monospace',color:ok?'var(--green)':'var(--red)'}}>{ok?'Чисто':iss.count+' проблем'}</span>
                  <span style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{iss.title}</span>
                </div>
                <span style={{fontSize:12,color:'var(--text3)'}}>{iss.desc}</span>
              </div>
              {!ok&&iss.fix&&(
                <button className="btn btn-ghost" style={{flexShrink:0,color:'var(--accent)',borderColor:'var(--accentbdr)'}} onClick={iss.fix}>
                  <Icon name="wrench" size={13}/>Исправить
                </button>
              )}
              {!ok&&!iss.fix&&<span style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',flexShrink:0}}>только инфо</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ACCESS DENIED
═══════════════════════════════════════════ */
function AccessDenied(){
  return(
    <div className="access-denied">
      <div className="access-icon"><Icon name="lock" size={24} style={{color:'var(--red)'}}/></div>
      <p style={{color:'var(--text2)',fontSize:14}}>Эта вкладка доступна только администраторам</p>
      <p style={{color:'var(--text3)',fontSize:12,fontFamily:'Geist Mono,monospace'}}>Обратитесь к администратору системы</p>
    </div>
  );
}

/* ═══════════════════════════════════════════
   AUTH SCREEN
═══════════════════════════════════════════ */
function AuthScreen({onAuth}){
  const [error,setError] = useState('');
  const btnRef = useRef(null);
  const [theme,toggleTheme] = useTheme();

  useEffect(()=>{
    const init = () => {
      if(!window.google) return;
      window.google.accounts.id.initialize({
        client_id: CFG.GOOGLE_CLIENT_ID,
        callback: resp => {
          try{
            const pl = JSON.parse(atob(resp.credential.split('.')[1]));
            if(!pl.email.endsWith('@'+CFG.ALLOWED_DOMAIN)){
              setError(`Доступ только для @${CFG.ALLOWED_DOMAIN}`); return;
            }
            onAuth({email:pl.email,name:pl.name,picture:pl.picture});
          }catch{ setError('Ошибка авторизации'); }
        },
      });
      if(btnRef.current){
        window.google.accounts.id.renderButton(btnRef.current,{
          theme:'filled_black',size:'large',text:'signin_with',shape:'rectangular',locale:'ru'
        });
      }
    };
    // Poll until google GSI script is ready (handles async/defer race condition)
    if(window.google) { init(); return; }
    const interval = setInterval(() => {
      if(window.google) { clearInterval(interval); init(); }
    }, 150);
    return () => clearInterval(interval);
  },[]);

  return(
    <div className="auth-wrap">
      <div style={{position:'absolute',top:16,right:16}}>
        <div className="theme-toggle">
          <button className={`theme-opt ${theme==='light'?'active':''}`} onClick={()=>toggleTheme('light')}>
            <Icon name="sun" size={13}/>Светлая
          </button>
          <button className={`theme-opt ${theme==='dark'?'active':''}`} onClick={()=>toggleTheme('dark')}>
            <Icon name="moon" size={13}/>Тёмная
          </button>
        </div>
      </div>

      <div className="auth-card">
        <div style={{width:52,height:52,borderRadius:14,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}>
          <Icon name="database" size={24} style={{color:'var(--accent)'}}/>
        </div>
        <h1 style={{fontSize:22,fontWeight:700,marginBottom:6}}>
          Player<span style={{color:'var(--accent)'}}>Analytics</span>
        </h1>
        <p style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace',marginBottom:24}}>eyeconweb.com · internal tool</p>
        <p style={{fontSize:13,color:'var(--text2)',marginBottom:20}}>
          Войдите с корпоративной почтой<br/>
          <span style={{color:'var(--accent)',fontFamily:'Geist Mono,monospace',fontSize:12}}>@{CFG.ALLOWED_DOMAIN}</span>
        </p>
        <div ref={btnRef} style={{display:'flex',justifyContent:'center',marginBottom:16}}/>
        {error&&(
          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--red)',background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',borderRadius:8,padding:'10px 14px',marginTop:8}}>
            <Icon name="warning" size={14}/>{error}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════ */
const TABS = [
  {key:'base',      icon:'database',  label:'База игроков'},
  {key:'lookalike', icon:'search',    label:'Look-alike'},
  {key:'analytics', icon:'chart',     label:'Аналитика',   adminOnly:true},
  {key:'cleanup',   icon:'broom',     label:'Очистка',     adminOnly:true},
];

function App(){
  const [user,setUser]       = useState(()=>loadSession());
  const [players,setPlayers] = useState([]);
  const [loading,setLoading] = useState(false);
  const [tab,setTab]         = useState(0);
  const [theme,toggleTheme]  = useTheme();

  const doAuth = user => {
    saveSession(user);
    setUser(user);
  };
  const doLogout = () => {
    clearSession();
    setUser(null);
    setPlayers([]);
  };

  useEffect(()=>{
    if(!user) return;
    setLoading(true);
    sheetsGet().then(d=>{ if(d.length) setPlayers(d); setLoading(false); });
  },[user]);

  if(!user) return <AuthScreen onAuth={doAuth}/>;

  const admin = isAdmin(user.email);

  const renderTab = () => {
    if(tab===0) return <PlayerBase players={players} setPlayers={setPlayers} loading={loading} userEmail={user.email}/>;
    if(tab===1) return <LookAlike players={players}/>;
    if(tab===2) return admin?<Analytics players={players}/>:<AccessDenied/>;
    if(tab===3) return admin?<DataCleanup players={players} setPlayers={setPlayers}/>:<AccessDenied/>;
  };

  return(
    <div>
      <header className="app-header">
        <div className="header-inner">
          {/* Top bar */}
          <div className="top-bar">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:30,height:30,borderRadius:8,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icon name="database" size={15} style={{color:'var(--accent)'}}/>
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:15,lineHeight:1.1}}>Player<span style={{color:'var(--accent)'}}>Analytics</span></div>
                <div style={{fontSize:10,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>eyeconweb.com</div>
              </div>
            </div>

            <div style={{flex:1}}/>

            {/* Antifraud link */}
            <a href={CFG.ANTIFRAUD_URL} target="_blank" rel="noopener" className="btn btn-ghost" style={{textDecoration:'none',fontSize:12}}>
              <Icon name="shield" size={13} style={{color:'var(--accent)'}}/>Антифрод помощник
              <Icon name="externalLink" size={11} style={{color:'var(--text3)'}}/>
            </a>

            {/* Theme */}
            <div className="theme-toggle">
              <button className={`theme-opt ${theme==='light'?'active':''}`} onClick={()=>toggleTheme('light')}>
                <Icon name="sun" size={12}/>
              </button>
              <button className={`theme-opt ${theme==='dark'?'active':''}`} onClick={()=>toggleTheme('dark')}>
                <Icon name="moon" size={12}/>
              </button>
            </div>

            {/* Admin badge */}
            {admin&&(
              <span className="badge" style={{background:'var(--accentbg)',border:'1px solid var(--accentbdr)',color:'var(--accent)',fontSize:11}}>
                <Icon name="shield" size={11}/>admin
              </span>
            )}

            {/* User */}
            <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:20,padding:'5px 12px 5px 6px'}}>
              {user.picture&&<img src={user.picture} style={{width:22,height:22,borderRadius:'50%'}} alt=""/>}
              <span style={{fontSize:12,color:'var(--text2)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.email}</span>
            </div>

            {/* Players count */}
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',animation:'pulse 2s infinite'}}/>
              <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text3)'}}>{players.length}</span>
            </div>

            {/* Logout */}
            <button className="btn btn-ghost" style={{padding:'6px 8px'}} onClick={doLogout} title="Выйти">
              <Icon name="logout" size={14}/>
            </button>
          </div>

          {/* Tab bar */}
          <div className="tab-bar">
            {TABS.map((t,i)=>{
              const locked = t.adminOnly&&!admin;
              return(
                <button key={i} className={`tab-btn ${tab===i?'active':''} ${locked?'locked':''}`}
                  onClick={()=>!locked&&setTab(i)}>
                  <Icon name={t.icon} size={14}/>
                  {t.label}
                  {locked&&<Icon name="lock" size={11} style={{color:'var(--text3)',marginLeft:2}}/>}
                </button>
              );
            })}
          </div>
        </div>
      </header>

      <main className="main">
        {renderTab()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

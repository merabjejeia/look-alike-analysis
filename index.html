/* ── CSS Variables ── */
:root[data-theme="dark"] {
  --bg:#0b0f1a; --bg2:#111827; --bg3:#1a2234;
  --border:#1f2d45; --border2:#253047;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#4b6080;
  --accent:#38bdf8; --accent2:#0284c7;
  --accentbg:rgba(56,189,248,.08); --accentbdr:rgba(56,189,248,.2);
  --green:#34d399; --red:#f87171; --amber:#fbbf24; --violet:#a78bfa;
  --shadow:0 4px 24px rgba(0,0,0,.4); --shadow-sm:0 1px 6px rgba(0,0,0,.3);
  --row-a:#0b0f1a; --row-b:#0f1625; --scrollbar:#253047;
}
:root[data-theme="light"] {
  --bg:#f8fafc; --bg2:#ffffff; --bg3:#f1f5f9;
  --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --accent:#0284c7; --accent2:#0369a1;
  --accentbg:rgba(2,132,199,.06); --accentbdr:rgba(2,132,199,.2);
  --green:#059669; --red:#dc2626; --amber:#d97706; --violet:#7c3aed;
  --shadow:0 4px 24px rgba(0,0,0,.08); --shadow-sm:0 1px 6px rgba(0,0,0,.06);
  --row-a:#ffffff; --row-b:#f8fafc; --scrollbar:#cbd5e1;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; }
body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); transition:background .2s,color .2s; min-height:100vh; }
.mono { font-family:'Geist Mono',monospace; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:4px; }

/* ── Layout ── */
.app-header { position:sticky; top:0; z-index:40; background:var(--bg2); border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm); }
.header-inner { max-width:1680px; margin:0 auto; padding:0 20px; }
.top-bar { display:flex; align-items:center; gap:12px; height:52px; }
.tab-bar { display:flex; gap:2px; }
.tab-btn { display:flex; align-items:center; gap:7px; padding:10px 16px; font-size:13px; font-weight:500; color:var(--text2); border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none; transition:color .15s,border-color .15s; white-space:nowrap; }
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-btn.locked { opacity:.4; cursor:default; }
.main { max-width:1680px; margin:0 auto; padding:24px 20px; }

/* ── Cards ── */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:var(--shadow-sm); }
.card-sm { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; }

/* ── Buttons ── */
.btn { display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:8px; font-size:13px; font-weight:500; font-family:inherit; cursor:pointer; border:none; transition:all .15s; white-space:nowrap; }
.btn:disabled { opacity:.4; cursor:default; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover:not(:disabled) { background:var(--accent2); box-shadow:0 0 16px rgba(56,189,248,.3); }
.btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border2); }
.btn-ghost:hover:not(:disabled) { background:var(--bg3); color:var(--text); border-color:var(--text3); }
.btn-danger { background:transparent; color:var(--red); border:1px solid rgba(248,113,113,.25); }
.btn-danger:hover:not(:disabled) { background:rgba(248,113,113,.08); }
.btn-sm { padding:4px 10px; font-size:12px; }

/* ── Form controls ── */
.input { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; color:var(--text); font-family:inherit; outline:none; transition:border-color .15s; }
.input:focus { border-color:var(--accent); }
.input::placeholder { color:var(--text3); }
select.input { cursor:pointer; }
select.input option { background:var(--bg2); color:var(--text); }
textarea.input { resize:vertical; min-height:72px; }

/* ── Table ── */
.tbl { width:max-content; min-width:100%; border-collapse:collapse; font-family:'Geist Mono',monospace; font-size:12px; }
.tbl thead tr { background:var(--bg3); border-bottom:1px solid var(--border); }
.tbl thead th { padding:10px 12px; text-align:left; white-space:nowrap; color:var(--text2); font-weight:500; font-size:11px; letter-spacing:.04em; cursor:pointer; user-select:none; }
.tbl thead th:hover { color:var(--accent); }
.tbl tbody tr:nth-child(odd) { background:var(--row-a); }
.tbl tbody tr:nth-child(even) { background:var(--row-b); }
.tbl tbody tr { border-bottom:1px solid var(--border); transition:background .1s; }
.tbl tbody tr:hover { background:var(--accentbg) !important; }
.tbl td { padding:8px 12px; white-space:nowrap; color:var(--text2); }
.tbl-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--border); }

/* ── Tags ── */
.tag { display:inline-block; padding:2px 7px; border-radius:5px; font-size:11px; font-family:'Geist Mono',monospace; margin:1px; line-height:1.4; }

/* ── Badge ── */
.badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:500; }

/* ── Animations ── */
.fade-in { animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;} }
.spin { animation:spin 1s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg);} }
@keyframes pulse { 0%,100%{opacity:1;}50%{opacity:.4;} }

/* ── Toast ── */
.toast-wrap { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100; pointer-events:none; animation:toastIn .25s ease,toastOut .25s ease 2.75s forwards; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);} }
@keyframes toastOut { to{opacity:0;} }

/* ── Modal ── */
.modal-backdrop { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.65); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:16px; width:100%; max-width:680px; max-height:90vh; display:flex; flex-direction:column; box-shadow:var(--shadow); }
.modal-header { padding:20px 24px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
.modal-body { overflow-y:auto; flex:1; padding:20px 24px; min-height:0; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); flex-shrink:0; display:flex; justify-content:space-between; gap:8px; }
.modal-sm { max-width:420px; }

/* ── Step pills ── */
.step-pill { flex:1; text-align:center; padding:6px 4px; font-size:12px; border-radius:8px; border:1px solid var(--border); color:var(--text3); }
.step-pill.done { background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.3); color:var(--green); }
.step-pill.current { background:var(--accentbg); border-color:var(--accentbdr); color:var(--accent); }

/* ── KPI ── */
.kpi { display:flex; flex-direction:column; gap:6px; }
.kpi-value { font-size:24px; font-weight:700; font-family:'Geist Mono',monospace; line-height:1.1; }
.kpi-label { font-size:11px; color:var(--text3); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }

/* ── Sim bar ── */
.sim-track { height:5px; background:var(--bg3); border-radius:3px; flex:1; overflow:hidden; }
.sim-fill { height:100%; border-radius:3px; transition:width .3s; }

/* ── Theme toggle ── */
.theme-toggle { display:flex; align-items:center; gap:0; background:var(--bg3); border:1px solid var(--border); border-radius:8px; overflow:hidden; padding:2px; }
.theme-opt { padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; color:var(--text3); background:none; border:none; font-family:inherit; transition:all .15s; display:flex; align-items:center; gap:5px; }
.theme-opt.active { background:var(--bg2); color:var(--text); box-shadow:var(--shadow-sm); }

/* ── Metric row ── */
.metric-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
.metric-row:last-child { border-bottom:none; }

/* ── Risk pills ── */
.risk-high { background:rgba(248,113,113,.12); color:var(--red); border:1px solid rgba(248,113,113,.25); }
.risk-medium { background:rgba(251,191,36,.10); color:var(--amber); border:1px solid rgba(251,191,36,.25); }
.risk-low { background:rgba(52,211,153,.10); color:var(--green); border:1px solid rgba(52,211,153,.25); }

/* ── Filter bar ── */
.filter-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }

/* ── Auth ── */
.auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
.auth-card { background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:40px; max-width:360px; width:100%; text-align:center; box-shadow:var(--shadow); }
.access-denied { display:flex; flex-direction:column; align-items:center; padding:80px 20px; gap:16px; }
.access-icon { width:56px; height:56px; border-radius:14px; background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); display:flex; align-items:center; justify-content:center; }

/* ══════════════════════════════════════════════
   НОВЫЕ СТИЛИ v2
══════════════════════════════════════════════ */

/* ── Drawer (боковая панель игрока) ── */
.drawer-backdrop { position:fixed; inset:0; z-index:45; }
.drawer {
  position:fixed; right:0; top:0;
  width:460px; height:100vh;
  background:var(--bg2); border-left:1px solid var(--border);
  box-shadow:-8px 0 40px rgba(0,0,0,.45);
  z-index:46; display:flex; flex-direction:column; overflow:hidden;
  animation:drawerIn .2s ease;
}
@keyframes drawerIn { from{transform:translateX(100%);}to{transform:none;} }
.drawer-header { padding:18px 20px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.drawer-body { overflow-y:auto; flex:1; }
.drawer-section { padding:14px 20px; border-bottom:1px solid var(--border); }
.drawer-section:last-child { border-bottom:none; padding-bottom:24px; }
.drawer-section-title { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.07em; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:6px; }

/* ── Status badge ── */
.status-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; font-family:'Geist Mono',monospace; }
.status-new          { background:rgba(100,116,139,.12); color:#64748b; border:1px solid rgba(100,116,139,.2); }
.status-under_review { background:rgba(251,191,36,.12); color:var(--amber); border:1px solid rgba(251,191,36,.25); }
.status-confirmed    { background:rgba(248,113,113,.12); color:var(--red); border:1px solid rgba(248,113,113,.25); }
.status-blocked      { background:rgba(220,38,38,.18); color:#fca5a5; border:1px solid rgba(220,38,38,.3); }
.status-cleared      { background:rgba(52,211,153,.10); color:var(--green); border:1px solid rgba(52,211,153,.25); }

/* ── Retention badge ── */
.retention-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; font-family:'Geist Mono',monospace; }
.ret-deposit_returned { background:rgba(251,191,36,.12); color:var(--amber); border:1px solid rgba(251,191,36,.3); }
.ret-full_retention   { background:rgba(248,113,113,.15); color:var(--red); border:1px solid rgba(248,113,113,.3); }

/* ── Timeline (лента событий) ── */
.timeline { display:flex; flex-direction:column; }
.timeline-item { display:flex; gap:12px; padding:10px 0; position:relative; }
.timeline-item + .timeline-item { border-top:1px solid var(--border); }
.tl-icon { width:30px; height:30px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.tl-body { flex:1; min-width:0; }
.tl-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
.tl-type { font-size:11px; font-weight:600; }
.tl-author { font-size:11px; color:var(--text3); font-family:'Geist Mono',monospace; overflow:hidden; text-overflow:ellipsis; }
.tl-date { font-size:10px; color:var(--text3); font-family:'Geist Mono',monospace; margin-left:auto; white-space:nowrap; }
.tl-text { font-size:12px; color:var(--text2); line-height:1.5; }

/* ── Groups layout ── */
.groups-layout { display:grid; grid-template-columns:260px 1fr 310px; gap:16px; }
.groups-panel { background:var(--bg2); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; height:calc(100vh - 148px); }
.groups-panel-hdr { padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
.groups-panel-body { overflow-y:auto; flex:1; }
.group-item { padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--border); transition:background .1s; }
.group-item:last-child { border-bottom:none; }
.group-item:hover { background:var(--accentbg); }
.group-item.active { background:var(--accentbg); border-left:3px solid var(--accent); padding-left:13px; }

/* ── Group status dot ── */
.grp-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.grp-active    { background:var(--amber); }
.grp-confirmed { background:var(--red); }
.grp-exported  { background:var(--accent); }
.grp-cleared   { background:var(--green); }

/* ── Member row ── */
.member-row { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); transition:background .1s; }
.member-row:last-child { border-bottom:none; }
.member-row:hover { background:var(--accentbg); }

/* ── Analytics mini bar ── */
.mini-bar-track { height:4px; background:var(--bg3); border-radius:2px; flex:1; overflow:hidden; }
.mini-bar-fill { height:100%; border-radius:2px; }

/* ── Export dropdown ── */
.export-menu { position:relative; display:inline-block; }
.export-dropdown { position:absolute; right:0; top:calc(100% + 6px); background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:4px; min-width:220px; box-shadow:var(--shadow); z-index:20; animation:fadeIn .15s ease; }
.export-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--text2); transition:background .1s; }
.export-item:hover { background:var(--bg3); color:var(--text); }

/* ── Add comment form ── */
.comment-form { background:var(--bg3); border-radius:10px; padding:14px; }
.contact-chips { display:flex; flex-wrap:wrap; gap:6px; }
.contact-chip { padding:4px 10px; border-radius:6px; font-size:11px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--bg2); color:var(--text3); transition:all .1s; }
.contact-chip.active { background:var(--accentbg); border-color:var(--accentbdr); color:var(--accent); }

/* ── User ID clickable ── */
.uid-link { color:var(--accent); cursor:pointer; font-weight:500; text-decoration:none; }
.uid-link:hover { text-decoration:underline; }
</style>

function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('pa_theme') || 'dark'; } catch{ return 'dark'; }
  });
  const toggle = t => {
    setTheme(t);
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('pa_theme', t); } catch{}
  };
  return [theme, toggle];
}

/* ═══════════════════════════════════════════
   ESCAPE HOOK
═══════════════════════════════════════════ */
function useEscape(onClose) {
  useEffect(() => {
    const h = e => { if(e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);
}

    const p = JSON.parse(s);
    if(Date.now() - p.ts > 8*3600*1000){ localStorage.removeItem('pa_session'); return null; }

  } catch{ return null; }
}

/* ═══════════════════════════════════════════
   CSV PARSER
═══════════════════════════════════════════ */
function detectSep(line) {
  let tabs=0,commas=0,semis=0,inQ=false;
  for(const c of line){ if(c==='"'){inQ=!inQ;continue;} if(inQ)continue; if(c==='\t')tabs++; else if(c===',')commas++; else if(c===';')semis++; }
  if(tabs>=commas&&tabs>=semis) return '\t'; if(semis>commas) return ';'; return ',';
}
function parseCSV(text, sep) {
  const rows=[]; let row=[],cur='',inQ=false;
  const push=()=>{row.push(cur.trim());cur='';};
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(inQ){ if(c==='"'&&n==='"'){cur+='"';i++;} else if(c==='"'){inQ=false;} else cur+=c; }
    else { if(c==='"'){inQ=true;} else if(c===sep){push();} else if(c==='\r'&&n==='\n'){push();rows.push(row);row=[];cur='';i++;} else if(c==='\n'){push();rows.push(row);row=[];cur='';} else cur+=c; }
  }
  push(); if(row.some(v=>v!==''))rows.push(row);
  return rows;
}
function parseRaw(text) {
  if(!text||!text.trim()) return {headers:[],rows:[]};
  const firstLine = text.split(/\r?\n/)[0];
  const sep = detectSep(firstLine);
  const all = parseCSV(text, sep);
  if(all.length<2) return {headers:[],rows:[]};
  return {headers:all[0].map(h=>h.trim()), rows:all.slice(1).filter(r=>r.some(v=>v!==''))};
}

/* ═══════════════════════════════════════════
   CHART CANVAS
═══════════════════════════════════════════ */
function ChartCanvas({data,type,color}){
  const ref=useRef(); const inst=useRef();
  useEffect(()=>{
    if(!data||!ref.current) return;
    inst.current?.destroy();
    const isDark = document.documentElement.getAttribute('data-theme')!=='light';
    const gridCol = isDark?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';
    const txtCol  = isDark?'#4b6080':'#94a3b8';
    const ctx=ref.current.getContext('2d');
    const bg = type==='doughnut'
      ? ['#38bdf8','#a78bfa','#34d399','#fbbf24','#f87171','#60a5fa','#fb923c']
      : (()=>{
        const c = color||'#38bdf8';
        const map={'var(--accent)':'#38bdf8','var(--violet)':'#a78bfa','var(--green)':'#34d399','var(--red)':'#f87171','var(--amber)':'#fbbf24'};
        return map[c]||c;
      })();
    inst.current = new Chart(ctx,{
      type,
      data:{
        labels:data.labels,
        datasets:[{data:data.values,backgroundColor:bg,borderColor:type==='doughnut'?'transparent':bg,borderWidth:type==='doughnut'?0:0,borderRadius:type==='bar'?4:0,hoverOffset:4}]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:type==='doughnut',labels:{color:txtCol,font:{size:11},boxWidth:10,padding:12}}},
        scales: type!=='doughnut'?{x:{ticks:{color:txtCol,font:{size:10}},grid:{color:gridCol}},y:{ticks:{color:txtCol,font:{size:10}},grid:{color:gridCol}}}:{},
      }
    });
    return ()=>inst.current?.destroy();
  },[data,type,color]);
  return <div style={{height:180}}><canvas ref={ref}/></div>;
}

          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {['deposit_returned','full_retention'].map(v=>{
              const info = retentionInfo(v);
              const active = retType===v;
              return(
                <div key={v} onClick={()=>setRetType(v)} style={{
                  display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:10,cursor:'pointer',
                  background:active?(v==='full_retention'?'rgba(248,113,113,.08)':'rgba(251,191,36,.08)'):'var(--bg3)',
                  border:`1px solid ${active?(v==='full_retention'?'rgba(248,113,113,.3)':'rgba(251,191,36,.3)'):'var(--border)'}`,
                  transition:'all .15s'
                }}>
                  <div style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${active?(v==='full_retention'?'var(--red)':'var(--amber)'):'var(--border2)'}`,background:active?(v==='full_retention'?'var(--red)':'var(--amber)'):'transparent',flexShrink:0}}/>
                  <div>
                    <div style={{fontSize:13,fontWeight:500,color:active?'var(--text)':'var(--text2)'}}>{info.label}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Дата удержания</label>
            <input type="date" className="input" value={retDate} onChange={e=>setRetDate(e.target.value)}/>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Комментарий (необязательно)</label>
            <textarea className="input" placeholder="Причина, детали..." value={note} onChange={e=>setNote(e.target.value)} style={{height:80}}/>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Отмена</button>
          <button className="btn btn-danger" onClick={apply}><Icon name="lock" size={13}/>Применить удержание</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADD COMMENT FORM
═══════════════════════════════════════════ */
function AddCommentForm({onAdd, onCancel}){
  const [type, setType] = useState('note');
  const [text, setText] = useState('');
  const [contact, setContact] = useState('chat');

  const submit = () => {
    if(!text.trim()) return;
    onAdd({type, text:text.trim(), contact_method: type==='appeal'?contact:''});
    setText(''); setType('note');
  };

  return(
    <div className="comment-form fade-in">
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {['note','appeal'].map(t=>(
          <button key={t} className={`contact-chip ${type===t?'active':''}`} onClick={()=>setType(t)}>
            <Icon name={t==='note'?'note':'messageCircle'} size={11} style={{display:'inline',verticalAlign:'middle',marginRight:4}}/>
            {t==='note'?'Заметка':'Обращение игрока'}
          </button>
        ))}
      </div>

      {type==='appeal'&&(
        <div style={{marginBottom:10}}>
          <p style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>Канал обращения</p>
          <div className="contact-chips">
            {CONTACT_METHODS.map(m=>(
              <button key={m} className={`contact-chip ${contact===m?'active':''}`} onClick={()=>setContact(m)}>
                {contactLabel(m)}
              </button>
            ))}
          </div>
        </div>
      )}

      <textarea className="input" placeholder={type==='appeal'?'Что написал/требует игрок...':'Заметка оператора...'} value={text} onChange={e=>setText(e.target.value)} style={{height:80,marginBottom:10}}/>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button className="btn btn-ghost btn-sm" onClick={onCancel}>Отмена</button>
        <button className="btn btn-primary btn-sm" onClick={submit} disabled={!text.trim()}>
          <Icon name="send" size={12}/>Сохранить
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   IMPORT MODAL
═══════════════════════════════════════════ */
function ImportModal({onClose, onImport, userEmail}){
  useEscape(onClose);
  const [step,setStep]     = useState(1);
  const [raw,setRaw]       = useState('');
  const [info,setInfo]     = useState('');
  const [parsed,setParsed] = useState({headers:[],rows:[]});
  const [mapping,setMapping] = useState({});
  const [sending,setSending] = useState(false);
  // per-row status / retention overrides: { [rowIndex]: { status, retention_type } }
  const [overrides,setOverrides] = useState({});
  const [bulkStatus,setBulkStatus]   = useState('');
  const [bulkRet,setBulkRet]         = useState('');
  const fileRef = useRef(null);

  const loadFile = e => {
    const file = e.target.files[0]; if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext==='xlsx'||ext==='xls'){
      const fr=new FileReader();
      fr.onload=ev=>{
        try{
          const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true,cellText:false});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
          if(!arr||arr.length<2){alert('Файл пустой');return;}
          const txt=arr.map(row=>row.map(c=>String(c??'').replace(/\t/g,' ').replace(/\n/g,' ')).join('\t')).join('\n');
          setRaw(txt); setInfo(`${file.name} · ${arr.length-1} строк · ${arr[0].length} колонок`);
        }catch(err){alert('Ошибка Excel: '+err.message);}
      };
      fr.readAsArrayBuffer(file);
    } else {
      const fr=new FileReader();
      fr.onload=ev=>{setRaw(ev.target.result);setInfo(file.name);};
      fr.readAsText(file,'UTF-8');
    }
    e.target.value='';
  };

  const doParse = () => {
    if(!raw.trim()){alert('Нет данных');return;}
    const p=parseRaw(raw);
    if(!p.headers.length){alert('Не удалось распарсить. Проверьте формат.');return;}
    const sep=detectSep(raw.split(/\r?\n/)[0]);
    const sepName=sep==='\t'?'Tab':sep===';'?'Точка с запятой':'Запятая';
    setInfo(prev=>prev+` · ${sepName} · ${p.headers.length} кол. · ${p.rows.length} строк`);
    setParsed(p); setMapping(fuzzyMap(p.headers)); setOverrides({}); setStep(2);
  };

  // Apply bulk overrides
  const applyBulk = () => {
    if(!bulkStatus&&!bulkRet) return;
    const next={};
    parsed.rows.forEach((_,i)=>{ next[i]={status:bulkStatus||'new',retention_type:bulkRet||'none'}; });
    setOverrides(next);
  };

  const setRowOverride = (i, field, val) => {
    setOverrides(prev=>({...prev,[i]:{...(prev[i]||{}), [field]:val}}));
  };

  const preview = useMemo(()=>{
    if(step<3) return [];
    return parsed.rows.map((row,ri)=>{
      const obj={};
      for(const {key} of SYSTEM_FIELDS){
        const col=mapping[key]; const idx=col?parsed.headers.indexOf(col):-1;
        let val=idx>=0?row[idx]:'';
        if(['total_deposit','total_withdrawal'].includes(key)) val=parseFloat(val)||0;
        obj[key]=val;
      }
      const ov = overrides[ri]||{};
      obj.status         = ov.status         || 'new';
      obj.retention_type = ov.retention_type || 'none';
      obj.retention_date = (ov.retention_type&&ov.retention_type!=='none') ? new Date().toISOString().split('T')[0] : '';
      obj.group_id       = '';
      obj.net_balance    = (obj.total_deposit||0) - (obj.total_withdrawal||0);
      obj.added_by       = userEmail;
      obj.added_at       = new Date().toISOString().split('T')[0];
      return obj;
    });
  },[step,parsed,mapping,userEmail,overrides]);

  const doImport = async () => {
    setSending(true);
    const m=new Map();
    for(const p of preview){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    const final=[...m.values()];
    await sheetsPost(final);
    onImport(final); setSending(false); onClose();
  };

  const STEPS=['1. Загрузить','2. Маппинг + Статусы','3. Предпросмотр'];

  return(
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal fade-in" style={{maxWidth:820}}>
        <div className="modal-header">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <Icon name="upload" size={16} style={{color:'var(--accent)'}}/>
              <span style={{fontWeight:600,fontSize:15}}>Импорт игроков</span>
            </div>
            <button className="btn btn-ghost" style={{padding:'5px 8px'}} onClick={onClose}><Icon name="x" size={14}/></button>
          </div>
          <div style={{display:'flex',gap:6}}>
            {STEPS.map((s,i)=>(
              <div key={i} className={`step-pill ${step===i+1?'current':step>i+1?'done':''}`}>
                <span style={{marginRight:4}}>{step>i+1?'✓':i+1}</span>{s}
              </div>
            ))}
          </div>
        </div>

        <div className="modal-body">

          {/* ── STEP 1: Upload ── */}
          {step===1&&(
            <div className="fade-in">
              <div onClick={()=>fileRef.current.click()}
                style={{border:'2px dashed var(--border2)',borderRadius:10,padding:28,textAlign:'center',cursor:'pointer',transition:'border-color .15s'}}
                onMouseOver={e=>e.currentTarget.style.borderColor='var(--accent)'}
                onMouseOut={e=>e.currentTarget.style.borderColor='var(--border2)'}>
                <Icon name="file" size={28} style={{color:'var(--text3)',margin:'0 auto 8px'}}/>
                <p style={{color:'var(--text2)',fontSize:13,marginBottom:4}}>Кликните для выбора файла</p>
                <p style={{color:'var(--text3)',fontSize:12}}>Excel (.xlsx .xls), CSV, TSV, TXT</p>
                {info&&<p style={{color:'var(--accent)',fontSize:12,marginTop:8,fontFamily:'Geist Mono,monospace'}}>{info}</p>}
              </div>
              <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" style={{display:'none'}} onChange={loadFile}/>
              <div style={{display:'flex',alignItems:'center',gap:10,margin:'14px 0',color:'var(--text3)',fontSize:12}}>
                <div style={{flex:1,height:1,background:'var(--border)'}}/>или вставьте текст вручную<div style={{flex:1,height:1,background:'var(--border)'}}/>
              </div>
              <textarea className="input mono" style={{height:110,resize:'none',display:'block'}}
                placeholder={"user_id\tpayment_method\tcountry\ttotal_deposit\n12345\tCard\tRU,KZ\t1500.50"}
                value={raw} onChange={e=>setRaw(e.target.value)}/>
              <p style={{color:'var(--text3)',fontSize:11,marginTop:6}}>💡 Страна и ASN поддерживают несколько значений через запятую: <span style={{fontFamily:'monospace'}}>RU,KZ</span></p>
            </div>
          )}

          {/* ── STEP 2: Mapping + per-row status/retention ── */}
          {step===2&&(
            <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
              {info&&<div style={{background:'var(--accentbg)',border:'1px solid var(--accentbdr)',borderRadius:8,padding:'7px 12px',fontSize:12,fontFamily:'monospace',color:'var(--accent)'}}>{info}</div>}

              {/* Field mapping */}
              <div>
                <div style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:10}}>Маппинг полей</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
                  {SYSTEM_FIELDS.map(({key,label})=>(
                    <div key={key} style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontSize:12,color:'var(--text2)',width:130,flexShrink:0}}>{label}</span>
                      <select className="input" style={{flex:1}} value={mapping[key]||''} onChange={e=>setMapping(m=>({...m,[key]:e.target.value}))}>
                        <option value="">— не выбрано —</option>
                        {parsed.headers.map(h=><option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>

              {/* Bulk status/retention */}
              <div style={{padding:'14px 16px',background:'var(--bg3)',borderRadius:10,border:'1px solid var(--border)'}}>
                <div style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:10,display:'flex',alignItems:'center',gap:7}}>
                  <Icon name="userCheck" size={13} style={{color:'var(--accent)'}}/>
                  Статус и удержание для всех строк
                </div>
                <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
                  <div style={{flex:1,minWidth:160}}>
                    <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.04em'}}>Статус</label>
                    <select className="input" value={bulkStatus} onChange={e=>setBulkStatus(e.target.value)}>
                      <option value="">new (по умолчанию)</option>
                      {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                    </select>
                  </div>
                  <div style={{flex:1,minWidth:200}}>
                    <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.04em'}}>Удержание</label>
                    <select className="input" value={bulkRet} onChange={e=>setBulkRet(e.target.value)}>
                      <option value="">none (по умолчанию)</option>
                      <option value="deposit_returned">Депозит возвращён</option>
                      <option value="full_retention">Полное удержание</option>
                    </select>
                  </div>
                  <button className="btn btn-ghost" style={{fontSize:12,whiteSpace:'nowrap'}} onClick={applyBulk}
                    disabled={!bulkStatus&&!bulkRet}>
                    <Icon name="check" size={13}/>Применить ко всем
                  </button>
                </div>
                <p style={{fontSize:11,color:'var(--text3)',marginTop:8}}>
                  💡 После применения можно изменить отдельные строки в предпросмотре
                </p>
              </div>

              {/* Per-row overrides table */}
              <div>
                <div style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:8}}>
                  Индивидуальные статусы
                  {Object.keys(overrides).length>0&&<span style={{fontSize:11,color:'var(--accent)',marginLeft:8}}>({Object.keys(overrides).length} строк изменено)</span>}
                </div>
                <div className="tbl-wrap" style={{maxHeight:260,overflow:'auto'}}>
                  <table className="tbl">
                    <thead><tr>
                      <th>User ID</th>
                      <th>Депозит</th>
                      <th>Страна</th>
                      <th>Статус</th>
                      <th>Удержание</th>
                    </tr></thead>
                    <tbody>{parsed.rows.slice(0,100).map((row,ri)=>{
                      const uidIdx = mapping['user_id'] ? parsed.headers.indexOf(mapping['user_id']) : -1;
                      const depIdx = mapping['total_deposit'] ? parsed.headers.indexOf(mapping['total_deposit']) : -1;
                      const cntIdx = mapping['country'] ? parsed.headers.indexOf(mapping['country']) : -1;
                      const uid    = uidIdx>=0?row[uidIdx]:`row-${ri+1}`;
                      const dep    = depIdx>=0?row[depIdx]:'—';
                      const cnt    = cntIdx>=0?row[cntIdx]:'—';
                      const ov     = overrides[ri]||{};
                      return(
                        <tr key={ri}>
                          <td style={{color:'var(--accent)',fontFamily:'Geist Mono,monospace',fontSize:11}}>{uid}</td>
                          <td style={{color:'var(--green)',fontSize:11}}>{dep}</td>
                          <td style={{fontSize:11}}>{cnt||'—'}</td>
                          <td>
                            <select className="input" style={{fontSize:11,padding:'3px 7px',width:130}}
                              value={ov.status||'new'}
                              onChange={e=>setRowOverride(ri,'status',e.target.value)}>
                              {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                            </select>
                          </td>
                          <td>
                            <select className="input" style={{fontSize:11,padding:'3px 7px',width:170}}
                              value={ov.retention_type||'none'}
                              onChange={e=>setRowOverride(ri,'retention_type',e.target.value)}>
                              <option value="none">— нет удержания</option>
                              <option value="deposit_returned">Депозит возвращён</option>
                              <option value="full_retention">Полное удержание</option>
                            </select>
                          </td>
                        </tr>
                      );
                    })}</tbody>
                  </table>
                </div>
                {parsed.rows.length>100&&<p style={{fontSize:11,color:'var(--text3)',marginTop:4,textAlign:'center'}}>Показано 100 из {parsed.rows.length}. Остальные получат bulk-статус.</p>}
              </div>
            </div>
          )}

          {/* ── STEP 3: Preview ── */}
          {step===3&&(
            <div className="fade-in">
              <p style={{color:'var(--text2)',fontSize:13,marginBottom:14}}>
                Предпросмотр · Всего: <span style={{color:'var(--accent)',fontWeight:600}}>{preview.length}</span> записей
                {preview.filter(p=>p.retention_type!=='none').length>0&&(
                  <span style={{marginLeft:12,color:'var(--amber)',fontSize:12}}>
                    · {preview.filter(p=>p.retention_type!=='none').length} с удержанием
                  </span>
                )}
                {preview.filter(p=>p.status!=='new').length>0&&(
                  <span style={{marginLeft:8,color:'var(--violet)',fontSize:12}}>
                    · {preview.filter(p=>p.status!=='new').length} с нестандартным статусом
                  </span>
                )}
              </p>
              <div className="tbl-wrap">
                <table className="tbl">
                  <thead><tr>
                    <th>User ID</th><th>Депозит</th><th>Страна</th><th>Статус</th><th>Удержание</th><th>Метод</th><th>Валюта</th>
                  </tr></thead>
                  <tbody>{preview.slice(0,15).map((row,i)=>(
                    <tr key={i}>
                      <td style={{color:'var(--accent)',fontFamily:'Geist Mono,monospace',fontSize:11}}>{row.user_id||'—'}</td>
                      <td style={{color:'var(--green)',fontSize:11}}>{fmt(row.total_deposit)}</td>
                      <td style={{fontSize:11}}>{row.country||'—'}</td>
                      <td><span style={{fontSize:10,color:statusInfo(row.status).cls?'inherit':'var(--text2)'}}>{statusInfo(row.status).label}</span></td>
                      <td><span style={{fontSize:10,color:row.retention_type!=='none'?'var(--amber)':'var(--text3)'}}>
                        {row.retention_type==='none'||!row.retention_type?'—':row.retention_type==='deposit_returned'?'Деп. возвр.':'Полное'}
                      </span></td>
                      <td style={{fontSize:11}}>{row.payment_method||'—'}</td>
                      <td style={{fontSize:11}}>{row.currency||'—'}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
              {preview.length>15&&<p style={{color:'var(--text3)',fontSize:12,marginTop:8,textAlign:'center'}}>…и ещё {preview.length-15} строк</p>}
            </div>
          )}
        </div>

        <div className="modal-footer">
          {step>1
            ?<button className="btn btn-ghost" onClick={()=>setStep(s=>s-1)}><Icon name="arrowLeft" size={14}/>Назад</button>
            :<div/>}
          {step===1&&<button className="btn btn-primary" onClick={doParse} disabled={!raw.trim()}><Icon name="arrowRight" size={14}/>Распарсить</button>}
          {step===2&&<button className="btn btn-primary" onClick={()=>setStep(3)}><Icon name="arrowRight" size={14}/>Предпросмотр</button>}
          {step===3&&(
            <button className="btn btn-primary" onClick={doImport} disabled={sending||!preview.length}>
              <Icon name="upload" size={14}/>
              {sending?'Отправка…':`Импортировать ${preview.length} записей`}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════
   TAB 1 — PLAYER BASE
═══════════════════════════════════════════ */
function PlayerBase({players, setPlayers, loading, userEmail, groups, comments, onUpdatePlayer, onAddComment, onDeleteComment, onEditComment}){
  const admin = isAdmin(userEmail);
  const [showModal,setShowModal] = useState(false);
  const [showAdd,setShowAdd]     = useState(false);
  const [fCountry,setFC] = useState('');
  const [fDevice,setFD]  = useState('');
  const [fCurr,setFCurr] = useState('');
  const [fStatus,setFS]  = useState('');
  const [fGroup,setFG]   = useState('');
  const [sort,setSort]   = useState({col:'created_at',dir:'desc'});
  const [toast,setToast] = useState(null);
  const [np,setNp]       = useState({});
  const [syncing,setSyncing] = useState(false);
  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(0);
  const PAGE_SIZE = 50;

  const derived = useMemo(()=>players.map(derive),[players]);
  const allCountries  = useMemo(()=>[...new Set(derived.flatMap(p=>splitVal(p.country)))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);
  const allDevCats    = useMemo(()=>[...new Set(derived.map(p=>devCat(p.device)).filter(Boolean))].sort(),[derived]);
  const hasF = fCountry||fDevice||fCurr||fStatus||fGroup||search;

  const filtered = useMemo(()=>{
    let d = derived;
    if(fCountry) d=d.filter(p=>splitVal(p.country).includes(fCountry));
    if(fDevice)  d=d.filter(p=>devCat(p.device)===fDevice);
    if(fCurr)    d=d.filter(p=>p.currency===fCurr);
    if(fStatus)  d=d.filter(p=>(p.status||'new')===fStatus);
    if(fGroup==='none') d=d.filter(p=>!p.group_id);
    else if(fGroup) d=d.filter(p=>p.group_id===fGroup);
    if(search){
      const q=search.toLowerCase();
      d=d.filter(p=>String(p.user_id).toLowerCase().includes(q)||String(p.deposit_wallet||'').toLowerCase().includes(q)||String(p.withdrawal_wallet||'').toLowerCase().includes(q)||String(p.asn||'').toLowerCase().includes(q));
    }
    return [...d].sort((a,b)=>{
      const av=a[sort.col],bv=b[sort.col];
      const cmp=typeof av==='number'?av-bv:String(av||'').localeCompare(String(bv||''));
      return sort.dir==='asc'?cmp:-cmp;
    });
  },[derived,fCountry,fDevice,fCurr,fStatus,fGroup,search,sort]);

  const toggleSort = col=>setSort(s=>({col,dir:s.col===col&&s.dir==='asc'?'desc':'asc'}));
  const clearF = ()=>{setFC('');setFD('');setFCurr('');setFS('');setFG('');setSearch('');setPage(0);};

  // Reset page when filters change
  useEffect(()=>{setPage(0);},[fCountry,fDevice,fCurr,fStatus,fGroup,search]);

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const paged = filtered.slice(page * PAGE_SIZE, (page+1) * PAGE_SIZE);

  const syncNow = async () => {
    setSyncing(true);
    const d=await sheetsGet();
    if(d.length){setPlayers(d);setToast({msg:`Загружено ${d.length} записей`,type:'ok'});}
    else setToast({msg:'Нет данных в Sheets',type:'warn'});
    setSyncing(false);
  };

  const exportAllXLSX = () => {
    const source = filtered.length !== derived.length ? filtered : derived;
    const data = source.map(p=>({
      user_id:p.user_id, status:p.status||'', payment_method:p.payment_method||'',
      total_deposit:p.total_deposit||0, total_withdrawal:p.total_withdrawal||0,
      net_balance:p.net_balance||0, currency:p.currency||'', country:p.country||'',
      asn:p.asn||'', device:p.device||'', retention_type:p.retention_type||'',
      group_id:p.group_id||'', created_at:p.created_at||'', limit:p.limit||'',
    }));
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Players');
    XLSX.writeFile(wb, `players_export_${new Date().toISOString().split('T')[0]}.xlsx`);
    setToast({msg:`Экспортировано ${data.length} записей`,type:'ok'});
  };

  const handleImport = newP => {
    setPlayers(prev=>{
      const m=new Map(prev.map(p=>[p.user_id,p]));
      for(const p of newP){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
      return[...m.values()];
    });
    setToast({msg:`Импортировано ${newP.length} записей`,type:'ok'});
  };

  const addP = () => {
    if(!np.user_id) return;
    const newPlayer = {
      ...np,
      total_deposit:parseFloat(np.total_deposit)||0,
      total_withdrawal:parseFloat(np.total_withdrawal)||0,
      net_balance:(parseFloat(np.total_deposit)||0)-(parseFloat(np.total_withdrawal)||0),
      status:'new', retention_type:'none', retention_date:'', group_id:'',
      added_by:userEmail, added_at:new Date().toISOString().split('T')[0]
    };
    setPlayers(prev=>[...prev,newPlayer]);
    setNp({}); setShowAdd(false); setToast({msg:'Игрок добавлен',type:'ok'});
    sheetsPost([newPlayer]);
    onAddComment(newPlayer.user_id, {type:'added', text:`Добавлен в реестр`, contact_method:''});
  };

  const devStyle = d => {
    const c=devCat(d);
    return c==='Mobile'?{background:'rgba(56,189,248,.12)',color:'var(--accent)'}
          :c==='Desktop'?{background:'rgba(167,139,250,.12)',color:'var(--violet)'}
          :c==='Tablet'?{background:'rgba(251,191,36,.12)',color:'var(--amber)'}
          :{background:'var(--bg3)',color:'var(--text3)'};
  };

  const commentCounts = useMemo(()=>{
    const m={};
    comments.forEach(c=>{m[String(c.user_id)]=(m[String(c.user_id)]||0)+1;});
    return m;
  },[comments]);

  // Update selectedPlayer when players change
  useEffect(()=>{
    if(selectedPlayer) {
      const updated = players.find(p=>p.user_id===selectedPlayer.user_id);
      if(updated) setSelectedPlayer(updated);
    }
  },[players]);

  const COLS=[
    {key:'user_id',label:'Пользователь'},{key:'status',label:'Статус'},
    {key:'payment_method',label:'Метод депозита'},{key:'total_deposit',label:'Сумма депа'},
    {key:'total_withdrawal',label:'Сумма вывода'},{key:'net_balance',label:'Net'},
    {key:'currency',label:'Валюта'},{key:'country',label:'Страна'},
    {key:'asn',label:'ASN'},{key:'device',label:'Устройство'},
    {key:'retention_type',label:'Удержание'},{key:'group_id',label:'Группа'},
    {key:'created_at',label:'Дата создания'},{key:'limit',label:'Limit'},
  ];

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}

      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        {admin&&<>
          <button className="btn btn-primary" onClick={()=>setShowModal(true)}><Icon name="upload" size={14}/>Импорт</button>
          <button className="btn btn-ghost" onClick={()=>setShowAdd(v=>!v)}><Icon name="plus" size={14}/>Добавить</button>
        </>}
        <button className="btn btn-ghost" onClick={syncNow} disabled={syncing}>
          <Icon name="refresh" size={14} className={syncing?'spin':''}/>{syncing?'Загрузка…':'Синхронизировать'}
        </button>
        <button className="btn btn-ghost" onClick={exportAllXLSX} disabled={!derived.length}>
          <Icon name="download" size={14}/>{filtered.length!==derived.length?`Экспорт (${filtered.length})`:'Экспорт'}
        </button>
        <div style={{flex:1,maxWidth:320}}>
          <input className="input" placeholder="Поиск по ID, кошельку, ASN…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text3)'}}>
            {filtered.length !== derived.length ? `${filtered.length} / ${derived.length}` : derived.length}
          </span>
        </div>
      </div>

      {/* Filters */}
      <div className="filter-bar">
        <select className="input" style={{width:'auto',minWidth:120}} value={fCountry} onChange={e=>setFC(e.target.value)}>
          <option value="">Все страны</option>
          {allCountries.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="input" style={{width:'auto',minWidth:120}} value={fDevice} onChange={e=>setFD(e.target.value)}>
          <option value="">Все устройства</option>
          {allDevCats.map(d=><option key={d}>{d}</option>)}
        </select>
        <select className="input" style={{width:'auto',minWidth:100}} value={fCurr} onChange={e=>setFCurr(e.target.value)}>
          <option value="">Все валюты</option>
          {allCurrencies.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="input" style={{width:'auto',minWidth:140}} value={fStatus} onChange={e=>setFS(e.target.value)}>
          <option value="">Все статусы</option>
          {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
        </select>
        <select className="input" style={{width:'auto',minWidth:140}} value={fGroup} onChange={e=>setFG(e.target.value)}>
          <option value="">Все группы</option>
          <option value="none">Без группы</option>
          {groups.map(g=><option key={g.group_id} value={g.group_id}>{g.group_id} · {g.name}</option>)}
        </select>
        {hasF&&<button className="btn btn-danger" style={{padding:'5px 10px',fontSize:12}} onClick={clearF}><Icon name="xCircle" size={12}/>Сбросить</button>}
      </div>

      {/* Add player inline */}
      {showAdd&&(
        <div className="card fade-in" style={{marginBottom:16}}>
          <p style={{fontSize:13,fontWeight:600,marginBottom:14}}>Добавить игрока вручную</p>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10}}>
            {SYSTEM_FIELDS.map(f=>(
              <div key={f.key}>
                <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:4}}>{f.label}</label>
                <input type={f.type==='number'?'number':'text'} className="input" value={np[f.key]||''} onChange={e=>setNp(p=>({...p,[f.key]:e.target.value}))} placeholder={f.key==='created_at'?'YYYY-MM-DD':''}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={()=>{setShowAdd(false);setNp({});}}>Отмена</button>
            <button className="btn btn-primary" onClick={addP} disabled={!np.user_id}><Icon name="plus" size={14}/>Добавить</button>
          </div>
        </div>
      )}

      {/* Table */}
      {loading?(
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'60px 0',gap:10,color:'var(--text3)'}}>
          <Icon name="refresh" size={16} className="spin"/>Загрузка данных…
        </div>
      ):(
        <div className="tbl-wrap">
          <table className="tbl">
            <thead>
              <tr>
                {COLS.map(c=>(
                  <th key={c.key} onClick={()=>toggleSort(c.key)}>
                    {c.label}<SortIcon col={c.key} sort={sort}/>
                  </th>
                ))}
                <th style={{width:40}}>💬</th>
              </tr>
            </thead>
            <tbody>
              {!filtered.length?(
                <tr><td colSpan={COLS.length+1} style={{textAlign:'center',padding:'50px 20px',color:'var(--text3)'}}>Нет данных</td></tr>
              ):paged.map((p,i)=>{
                const si = statusInfo(p.status||'new');
                const commentCount = commentCounts[String(p.user_id)]||0;
                const playerGroup = groups.find(g=>g.group_id===p.group_id);
                return(
                  <tr key={p.user_id+i}>
                    <td>
                      <span className="uid-link" onClick={()=>setSelectedPlayer(p)}>{p.user_id}</span>
                    </td>
                    <td><span className={`status-badge ${si.cls}`} style={{fontSize:10}}>{si.label}</span></td>
                    <td>{p.payment_method||'—'}</td>
                    <td style={{color:'var(--green)',fontWeight:500}}>{fmt(p.total_deposit)}</td>
                    <td style={{color:p.withdrawal_rate>1?'var(--red)':'var(--text2)'}}>{fmt(p.total_withdrawal)}</td>
                    <td style={{color:netColor(p.net_balance),fontWeight:500}}>{fmt(p.net_balance)}</td>
                    <td>{p.currency||'—'}</td>
                    <td><Tags value={p.country} color="var(--accent)"/></td>
                    <td><Tags value={p.asn} color="var(--violet)"/></td>
                    <td>
                      {p.device&&<span className="tag" style={devStyle(p.device)}>{devCat(p.device)||p.device}</span>}
                      {!p.device&&'—'}
                    </td>
                    <td><RetentionBadge type={p.retention_type}/>{(!p.retention_type||p.retention_type==='none')&&<span style={{color:'var(--text3)'}}>—</span>}</td>
                    <td>
                      {playerGroup
                        ?<span className="tag" style={{background:'rgba(167,139,250,.12)',color:'var(--violet)'}}>{playerGroup.group_id}</span>
                        :<span style={{color:'var(--text3)'}}>—</span>}
                    </td>
                    <td style={{color:'var(--text3)'}}>{fmtDate(p.created_at)}</td>
                    <td style={{color:'var(--amber)'}}>{p.limit||'—'}</td>
                    <td>
                      {commentCount>0
                        ?<span style={{fontSize:11,color:'var(--accent)',fontWeight:600,cursor:'pointer'}} onClick={()=>setSelectedPlayer(p)}>💬 {commentCount}</span>
                        :<span style={{color:'var(--border2)'}}>—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Pagination */}
      {filtered.length>PAGE_SIZE&&(
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0'}}>
          <span style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>
            {page*PAGE_SIZE+1}–{Math.min((page+1)*PAGE_SIZE, filtered.length)} из {filtered.length}
          </span>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <button className="btn btn-ghost btn-sm" disabled={page===0} onClick={()=>setPage(p=>p-1)}>
              <Icon name="arrowLeft" size={12}/>Назад
            </button>
            <span style={{fontSize:12,color:'var(--text2)',fontFamily:'Geist Mono,monospace'}}>{page+1} / {totalPages}</span>
            <button className="btn btn-ghost btn-sm" disabled={page+1>=totalPages} onClick={()=>setPage(p=>p+1)}>
              Далее<Icon name="arrowRight" size={12}/>
            </button>
          </div>
        </div>
      )}

      {showModal&&<ImportModal onClose={()=>setShowModal(false)} onImport={handleImport} userEmail={userEmail}/>}

      {selectedPlayer&&(
        <PlayerDrawer
          player={selectedPlayer}
          groups={groups}
          comments={comments}
          userEmail={userEmail}
          onClose={()=>setSelectedPlayer(null)}
          onUpdatePlayer={onUpdatePlayer}
          onAddComment={onAddComment}
          onDeleteComment={onDeleteComment}
          onEditComment={onEditComment}
        />
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 2 — GROUPS
═══════════════════════════════════════════ */
function GroupsTab({ players, groups, setGroups, comments, setComments, userEmail, setPlayers, onUpdatePlayer, onAddComment }){
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [showImportGroups, setShowImportGroups] = useState(false);
  const [showAddMember, setShowAddMember] = useState(false);
  const [showNewPlayer, setShowNewPlayer] = useState(false);
  const [newP, setNewP] = useState({user_id:'',payment_method:'',total_deposit:'',total_withdrawal:'',currency:'',country:'',asn:'',device:'',status:'new',retention_type:'none',limit:''});
  const [showAnalyst, setShowAnalyst] = useState(false);
  const [memberSearch, setMemberSearch] = useState('');
  const [toast, setToast] = useState(null);
  const [exportOpen, setExportOpen] = useState(false);
  const [editGroup, setEditGroup] = useState(null);
  const [groupSearch, setGroupSearch] = useState('');
  const exportRef = useRef(null);

  const derived = useMemo(()=>players.map(derive),[players]);

  const filteredGroups = useMemo(()=>{
    let list = [...groups].sort((a,b)=>{
      const da = a.created_at||''; const db = b.created_at||'';
      return db.localeCompare(da);
    });
    if(groupSearch){
      const q=groupSearch.toLowerCase();
      list = list.filter(g=>
        g.group_id?.toLowerCase().includes(q)||
        g.name?.toLowerCase().includes(q)||
        g.tags?.toLowerCase().includes(q)
      );
    }
    return list;
  },[groups, groupSearch]);

  // Close export dropdown on outside click
  useEffect(()=>{
    const h = e => { if(exportRef.current&&!exportRef.current.contains(e.target)) setExportOpen(false); };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);

  // Sync selected group when groups change
  useEffect(()=>{
    if(selectedGroup){
      const updated=groups.find(g=>g.group_id===selectedGroup.group_id);
      if(updated) setSelectedGroup(updated);
    }
  },[groups]);

  const groupMembers = useMemo(()=>{
    if(!selectedGroup) return [];
    const ids = splitVal(selectedGroup.member_ids);
    return derived.filter(p=>ids.includes(String(p.user_id)));
  },[selectedGroup, derived]);

  const groupStats = useMemo(()=>{
    const dep  = groupMembers.reduce((s,p)=>s+(p.total_deposit||0),0);
    const wit  = groupMembers.reduce((s,p)=>s+(p.total_withdrawal||0),0);
    const net  = dep - wit;
    const wr   = dep>0?wit/dep:0;
    const retCounts = {deposit_returned:0, full_retention:0, none:0};
    groupMembers.forEach(p=>{ const r=p.retention_type||'none'; retCounts[r]=(retCounts[r]||0)+1; });
    const methodCnt={}, countryCnt={};
    groupMembers.forEach(p=>{
      if(p.payment_method) methodCnt[p.payment_method]=(methodCnt[p.payment_method]||0)+1;
      splitVal(p.country).forEach(c=>{ countryCnt[c]=(countryCnt[c]||0)+1; });
    });
    const topMethods  = Object.entries(methodCnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const topCountries= Object.entries(countryCnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
    return {dep,wit,net,wr,retCounts,topMethods,topCountries};
  },[groupMembers]);

  const saveGroup = async (group) => {
    const isNew = !group.group_id;
    if(isNew) group.group_id = genGroupId(groups);
    if(isNew) { group.created_by=userEmail; group.created_at=new Date().toISOString().split('T')[0]; }
    const updated = isNew
      ? [...groups, group]
      : groups.map(g=>g.group_id===group.group_id?group:g);
    setGroups(updated);
    if(isNew) setSelectedGroup(group);
    await sheetsSaveGroup(group);
    setToast({msg:isNew?'Группа создана':'Группа обновлена',type:'ok'});
  };

  const deleteGroup = async (gid) => {
    if(!confirm('Удалить группу? Участники не будут удалены из реестра.')) return;
    // Remove group_id from members
    const memberIds = splitVal(selectedGroup?.member_ids||'');
    for(const uid of memberIds){
      const p=players.find(x=>String(x.user_id)===uid);
      if(p){ onUpdatePlayer({...p,group_id:''}); }
    }
    setGroups(prev=>prev.filter(g=>g.group_id!==gid));
    setSelectedGroup(null);
    await sheetsDeleteGroup(gid);
    setToast({msg:'Группа удалена',type:'ok'});
  };

  const addMember = async (player) => {
    if(!selectedGroup) return;
    const currentIds = splitVal(selectedGroup.member_ids);
    if(currentIds.includes(String(player.user_id))) return;
    const newIds = [...currentIds, String(player.user_id)].join(',');
    const updatedGroup = {...selectedGroup, member_ids:newIds};
    // Update player's group_id
    onUpdatePlayer({...player, group_id:selectedGroup.group_id});
    onAddComment(player.user_id, {type:'group_added', text:`Добавлен в группу ${selectedGroup.group_id} · ${selectedGroup.name}`, contact_method:''});
    await saveGroup(updatedGroup);
    setMemberSearch(''); setShowAddMember(false);
  };

  const addNewPlayerToGroup = async () => {
    if(!selectedGroup||!newP.user_id.trim()) return;
    const player = {
      ...newP,
      user_id: newP.user_id.trim(),
      total_deposit: parseFloat(newP.total_deposit)||0,
      total_withdrawal: parseFloat(newP.total_withdrawal)||0,
      net_balance: (parseFloat(newP.total_deposit)||0)-(parseFloat(newP.total_withdrawal)||0),
      group_id: selectedGroup.group_id,
      added_by: userEmail,
      added_at: new Date().toISOString().split('T')[0],
      created_at: new Date().toISOString().split('T')[0],
    };
    // Save player
    setPlayers(prev=>{const m=new Map(prev.map(p=>[String(p.user_id),p]));m.set(String(player.user_id),player);return[...m.values()];});
    await sheetsPost([player]);
    // Add to group
    const currentIds = splitVal(selectedGroup.member_ids);
    if(!currentIds.includes(String(player.user_id))){
      const newIds = [...currentIds, String(player.user_id)].join(',');
      await saveGroup({...selectedGroup, member_ids:newIds});
    }
    onAddComment(player.user_id, {type:'group_added', text:`Добавлен в группу ${selectedGroup.group_id} · ${selectedGroup.name}`, contact_method:''});
    setNewP({user_id:'',payment_method:'',total_deposit:'',total_withdrawal:'',currency:'',country:'',asn:'',device:'',status:'new',retention_type:'none',limit:''});
    setShowNewPlayer(false);
    setToast({msg:`Игрок ${player.user_id} добавлен`,type:'ok'});
  };

  const removeMember = async (player) => {
    if(!selectedGroup) return;
    const newIds = splitVal(selectedGroup.member_ids).filter(id=>id!==String(player.user_id)).join(',');
    const updatedGroup = {...selectedGroup, member_ids:newIds};
    onUpdatePlayer({...player, group_id:''});
    onAddComment(player.user_id, {type:'group_removed', text:`Убран из группы ${selectedGroup.group_id}`, contact_method:''});
    await saveGroup(updatedGroup);
  };

  const availableToAdd = useMemo(()=>{
    const currentIds = new Set(splitVal(selectedGroup?.member_ids||''));
    return derived.filter(p=>{
      const uid = String(p.user_id);
      if(currentIds.has(uid)) return false;
      if(!memberSearch) return true;
      const q=memberSearch.toLowerCase();
      return uid.includes(q)||String(p.country||'').toLowerCase().includes(q)||String(p.payment_method||'').toLowerCase().includes(q);
    }).slice(0,20);
  },[derived, selectedGroup, memberSearch]);

  // XLSX export
  const exportXLSX = () => {
    if(!selectedGroup||!groupMembers.length) return;
    const data = groupMembers.map(p=>{
      const d=derive(p);
      return {
        user_id:p.user_id, payment_method:p.payment_method||'', country:p.country||'',
        total_deposit:p.total_deposit||0, total_withdrawal:p.total_withdrawal||0,
        net_balance:d.net_balance, withdrawal_rate:parseFloat(d.withdrawal_rate.toFixed(4)),
        currency:p.currency||'', asn:p.asn||'', device:p.device||'',
        status:p.status||'', retention_type:p.retention_type||'',
        retention_date:p.retention_date||'', group_id:p.group_id||'',
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Players');
    XLSX.writeFile(wb, `${selectedGroup.group_id}_${selectedGroup.name||'group'}.xlsx`);
    setToast({msg:'Excel скачан',type:'ok'});
  };

  const copyIds = () => {
    const ids = groupMembers.map(p=>p.user_id).join('\n');
    navigator.clipboard.writeText(ids).then(()=>setToast({msg:'User ID скопированы',type:'ok'}));
  };

  const exportToSheets = async () => {
    if(!selectedGroup||!groupMembers.length) return;
    await sheetsExportGroup(selectedGroup, groupMembers);
    const updatedGroup = {...selectedGroup, status:'exported'};
    await saveGroup(updatedGroup);
    setToast({msg:`Экспортировано в лист "${selectedGroup.group_id}"`,type:'ok'});
    setExportOpen(false);
  };

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      {showImportGroups&&<ImportGroupsModal
        onClose={()=>setShowImportGroups(false)}
        existingGroups={groups}
        existingPlayers={players}
        userEmail={userEmail}
        onImport={async ({group, players: importedPlayers})=>{
          // 1. Save players to Google Sheets
          if(importedPlayers.length) await sheetsPost(importedPlayers);

          // 2. Save group to Google Sheets
          await sheetsSaveGroup(group);

          // 3. Update local groups state
          setGroups(prev=>{
            const m=new Map(prev.map(g=>[g.group_id,g]));
            m.set(group.group_id, group);
            return [...m.values()];
          });

          // 4. Update local players state
          setPlayers(prev=>{
            const m=new Map(prev.map(p=>[String(p.user_id),p]));
            importedPlayers.forEach(p=>m.set(String(p.user_id),p));
            return [...m.values()];
          });

          // 5. Add comments for each player
          for(const p of importedPlayers){
            onAddComment(p.user_id, {type:'group_added', text:`Добавлен в группу ${group.group_id}${group.name?' · '+group.name:''} (импорт)`, contact_method:''});
          }

          setToast({msg:`Импортировано ${importedPlayers.length} игроков в группу ${group.group_id}`,type:'ok'});
        }}
      />}
      {showCreate&&<CreateGroupModal groups={groups} onSave={saveGroup} onClose={()=>setShowCreate(false)} editGroup={editGroup}/>}
      {showAnalyst&&selectedGroup&&<AnalystModal group={selectedGroup} members={groupMembers} onClose={()=>setShowAnalyst(false)}/>}

      <div className="groups-layout">
        {/* ── Left: Groups List ── */}
        <div className="groups-panel">
          <div className="groups-panel-hdr" style={{flexDirection:'column',gap:8}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%'}}>
              <span style={{fontSize:13,fontWeight:600}}>Группы <span style={{color:'var(--text3)',fontSize:12}}>({groups.length})</span></span>
              <div style={{display:'flex',gap:5}}>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--violet)',borderColor:'rgba(167,139,250,.3)',fontSize:11}} onClick={()=>setShowImportGroups(true)}>
                  <Icon name="upload" size={11}/>Импорт
                </button>
                <button className="btn btn-primary btn-sm" onClick={()=>{setEditGroup(null);setShowCreate(true);}}>
                  <Icon name="plus" size={12}/>Создать
                </button>
              </div>
            </div>
            <input className="input" placeholder="Поиск группы…" value={groupSearch} onChange={e=>setGroupSearch(e.target.value)}
              style={{fontSize:12,padding:'6px 10px'}}/>
          </div>
          <div className="groups-panel-body">
            {!filteredGroups.length&&!groupSearch&&(
              <div style={{padding:'40px 20px',textAlign:'center',color:'var(--text3)'}}>
                <Icon name="users" size={28} style={{margin:'0 auto 10px',display:'block',opacity:.3}}/>
                <p style={{fontSize:12}}>Групп ещё нет</p>
                <p style={{fontSize:11,marginTop:4}}>Создайте первую группу</p>
              </div>
            )}
            {groupSearch&&!filteredGroups.length&&(
              <div style={{padding:'20px',textAlign:'center',color:'var(--text3)',fontSize:12}}>Не найдено</div>
            )}
            {filteredGroups.map(g=>{
              const ids=splitVal(g.member_ids);
              const members=derived.filter(p=>ids.includes(String(p.user_id)));
              const net=members.reduce((s,p)=>s+(p.net_balance??((p.total_deposit||0)-(p.total_withdrawal||0))),0);
              const gsi=groupStatusInfo(g.status||'active');
              return(
                <div key={g.group_id} className={`group-item ${selectedGroup?.group_id===g.group_id?'active':''}`}
                  onClick={()=>setSelectedGroup(g)}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                    <div className={`grp-dot ${gsi.dot}`}/>
                    <span style={{fontSize:12,fontWeight:600,fontFamily:'Geist Mono,monospace',color:'var(--text)'}}>{g.group_id}</span>
                    <span style={{fontSize:10,color:'var(--text3)',marginLeft:'auto'}}>{ids.length} акк.</span>
                  </div>
                  <div style={{fontSize:12,color:'var(--text2)',marginBottom:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{g.name||'—'}</div>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',fontWeight:600,color:netColor(net)}}>
                      {net>=0?'+':''}{fmt(net)}
                    </span>
                    <span style={{fontSize:10,color:'var(--text3)'}}>{gsi.label}</span>
                  </div>
                  {splitVal(g.tags).length>0&&(
                    <div style={{marginTop:4}}>
                      {splitVal(g.tags).slice(0,3).map(t=><span key={t} className="tag" style={{background:'var(--bg3)',color:'var(--text3)',fontSize:10}}>{t}</span>)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* ── Center: Group Members ── */}
        <div className="groups-panel" style={{flex:1}}>
          {!selectedGroup?(
            <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,color:'var(--text3)'}}>
              <Icon name="users" size={32} style={{opacity:.2}}/>
              <p style={{fontSize:13}}>Выберите группу слева</p>
            </div>
          ):(
            <>
              <div className="groups-panel-hdr" style={{flexDirection:'column',alignItems:'flex-start',gap:8}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div className={`grp-dot ${groupStatusInfo(selectedGroup.status||'active').dot}`}/>
                    <span style={{fontSize:14,fontWeight:700,fontFamily:'Geist Mono,monospace'}}>{selectedGroup.group_id}</span>
                    <span style={{fontSize:13,color:'var(--text2)'}}>{selectedGroup.name}</span>
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setEditGroup(selectedGroup);setShowCreate(true);}}>
                      <Icon name="wrench" size={12}/>Изменить
                    </button>
                    <button className="btn btn-danger btn-sm" onClick={()=>deleteGroup(selectedGroup.group_id)}>
                      <Icon name="trash" size={12}/>
                    </button>
                  </div>
                </div>
                {selectedGroup.notes&&(
                  <p style={{fontSize:12,color:'var(--text3)',lineHeight:1.5}}>{selectedGroup.notes}</p>
                )}
                {splitVal(selectedGroup.tags).length>0&&(
                  <div>{splitVal(selectedGroup.tags).map(t=><span key={t} className="tag" style={{background:'var(--accentbg)',color:'var(--accent)',border:'1px solid var(--accentbdr)'}}>{t}</span>)}</div>
                )}
                <div style={{display:'flex',gap:8,paddingTop:4,borderTop:'1px solid var(--border)',width:'100%'}}>
                  <select className="input" style={{width:'auto',flex:1,fontSize:12}} value={selectedGroup.status||'active'}
                    onChange={e=>saveGroup({...selectedGroup,status:e.target.value})}>
                    {Object.entries(GROUP_STATUS).map(([v,{label}])=><option key={v} value={v}>{label}</option>)}
                  </select>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setShowAddMember(v=>!v)}>
                    <Icon name="plus" size={12}/>Добавить участника
                  </button>
                </div>
              </div>

              {/* Add member search */}
              {showAddMember&&(
                <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg3)'}}>
                  {!showNewPlayer ? (
                    <>
                      <input className="input" placeholder="Поиск игрока по ID, стране…" value={memberSearch} onChange={e=>setMemberSearch(e.target.value)} autoFocus style={{marginBottom:8}}/>
                      <div style={{maxHeight:200,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
                        {availableToAdd.map(p=>(
                          <div key={p.user_id} onClick={()=>addMember(p)}
                            style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:7,cursor:'pointer',background:'var(--bg2)',border:'1px solid var(--border)',transition:'all .1s'}}
                            onMouseOver={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.background='var(--accentbg)';}}
                            onMouseOut={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.background='var(--bg2)';}}>
                            <span style={{fontSize:12,fontWeight:500,fontFamily:'Geist Mono,monospace',color:'var(--accent)'}}>{p.user_id}</span>
                            <Tags value={p.country} color="var(--accent)"/>
                            <span style={{fontSize:11,color:'var(--text3)',marginLeft:'auto'}}>{fmt(p.total_deposit)}</span>
                            <span className={`status-badge ${statusInfo(p.status||'new').cls}`} style={{fontSize:9}}>{statusInfo(p.status||'new').label}</span>
                          </div>
                        ))}
                        {!availableToAdd.length&&<p style={{fontSize:12,color:'var(--text3)',padding:'8px 4px'}}>Нет подходящих игроков</p>}
                      </div>
                      <div style={{display:'flex',gap:6,marginTop:6}}>
                        <button className="btn btn-ghost btn-sm" onClick={()=>setShowNewPlayer(true)}>
                          <Icon name="plus" size={12}/>Создать нового
                        </button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>{setShowAddMember(false);setMemberSearch('');}}>Закрыть</button>
                      </div>
                    </>
                  ) : (
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:'var(--accent)',marginBottom:8}}>
                        <Icon name="plus" size={12} style={{marginRight:4}}/>Новый игрок в группу
                      </div>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                        <div style={{gridColumn:'1/-1'}}>
                          <input className="input mono" placeholder="User ID *" value={newP.user_id} onChange={e=>setNewP(p=>({...p,user_id:e.target.value}))} autoFocus/>
                        </div>
                        <input className="input" placeholder="Метод оплаты" value={newP.payment_method} onChange={e=>setNewP(p=>({...p,payment_method:e.target.value}))}/>
                        <input className="input" placeholder="Страна" value={newP.country} onChange={e=>setNewP(p=>({...p,country:e.target.value}))}/>
                        <input className="input" type="number" placeholder="Депозит" value={newP.total_deposit} onChange={e=>setNewP(p=>({...p,total_deposit:e.target.value}))}/>
                        <input className="input" type="number" placeholder="Вывод" value={newP.total_withdrawal} onChange={e=>setNewP(p=>({...p,total_withdrawal:e.target.value}))}/>
                        <input className="input" placeholder="Валюта" value={newP.currency} onChange={e=>setNewP(p=>({...p,currency:e.target.value}))}/>
                        <input className="input" placeholder="ASN" value={newP.asn} onChange={e=>setNewP(p=>({...p,asn:e.target.value}))}/>
                        <input className="input" placeholder="Устройство" value={newP.device} onChange={e=>setNewP(p=>({...p,device:e.target.value}))}/>
                        <input className="input" placeholder="Limit" value={newP.limit} onChange={e=>setNewP(p=>({...p,limit:e.target.value}))}/>
                        <select className="input" value={newP.status} onChange={e=>setNewP(p=>({...p,status:e.target.value}))}>
                          {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                        </select>
                        <select className="input" value={newP.retention_type} onChange={e=>setNewP(p=>({...p,retention_type:e.target.value}))}>
                          {RETENTION_OPTIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
                        </select>
                      </div>
                      <div style={{display:'flex',gap:6,marginTop:8}}>
                        <button className="btn btn-primary btn-sm" onClick={addNewPlayerToGroup} disabled={!newP.user_id.trim()}>
                          <Icon name="check" size={12}/>Добавить
                        </button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>setShowNewPlayer(false)}>Назад</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="groups-panel-body">
                {!groupMembers.length?(
                  <div style={{padding:'40px 20px',textAlign:'center',color:'var(--text3)'}}>
                    <p style={{fontSize:12}}>Нет участников</p>
                    <p style={{fontSize:11,marginTop:4}}>Добавьте игроков из базы</p>
                  </div>
                ):groupMembers.map(p=>{
                  const d=derive(p);
                  const si=statusInfo(p.status||'new');
                  return(
                    <div key={p.user_id} className="member-row">
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                          <span style={{fontSize:12,fontWeight:600,fontFamily:'Geist Mono,monospace',color:'var(--accent)'}}>{p.user_id}</span>
                          <span className={`status-badge ${si.cls}`} style={{fontSize:9}}>{si.label}</span>
                          <RetentionBadge type={p.retention_type}/>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                          <Tags value={p.country} color="var(--accent)"/>
                          <span style={{fontSize:11,color:'var(--text3)'}}>{p.payment_method||'—'}</span>
                          <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--green)'}}>{fmt(p.total_deposit)}</span>
                          <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:netColor(d.net_balance)}}>Net: {fmt(d.net_balance)}</span>
                        </div>
                      </div>
                      <button className="btn btn-ghost btn-sm" style={{color:'var(--red)',borderColor:'rgba(248,113,113,.2)',flexShrink:0}} onClick={()=>removeMember(p)} title="Убрать из группы">
                        <Icon name="x" size={12}/>
                      </button>
                    </div>
                  );
                })}
              </div>

            </>
          )}
        </div>

        {/* ── Right: Analytics ── */}
        <div className="groups-panel" style={{overflow:'auto'}}>
          {!selectedGroup?(
            <div style={{padding:'40px 16px',textAlign:'center',color:'var(--text3)'}}>
              <Icon name="chart" size={28} style={{margin:'0 auto 10px',display:'block',opacity:.2}}/>
              <p style={{fontSize:12}}>Аналитика группы</p>
            </div>
          ):(
            <>
              <div className="groups-panel-hdr">
                <span style={{fontSize:13,fontWeight:600}}>Аналитика</span>
                {groupMembers.length>0&&(
                  <div style={{display:'flex',gap:5,alignItems:'center'}}>
                  <button className="btn btn-ghost btn-sm" style={{fontSize:11,color:'var(--violet)',borderColor:'rgba(167,139,250,.3)'}} onClick={()=>setShowAnalyst(true)}>
                    <Icon name="externalLink" size={11}/>Полный отчёт
                  </button>
                  <div className="export-menu" ref={exportRef}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setExportOpen(v=>!v)}>
                      <Icon name="download" size={12}/>Экспорт
                    </button>
                    {exportOpen&&(
                      <div className="export-dropdown">
                        <div className="export-item" onClick={exportXLSX}>
                          <Icon name="file" size={14} style={{color:'var(--green)'}}/>Скачать Excel
                        </div>
                        <div className="export-item" onClick={exportToSheets}>
                          <Icon name="spreadsheet" size={14} style={{color:'var(--accent)'}}/>Отправить в Google Sheets
                        </div>
                        <div className="export-item" onClick={copyIds}>
                          <Icon name="copy" size={14} style={{color:'var(--violet)'}}/>Скопировать User ID
                        </div>
                      </div>
                    )}
                  </div>
                  </div>
                )}
              </div>
              <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:14}}>
                {/* P&L */}
                <div style={{background:groupStats.net<0?'rgba(248,113,113,.05)':'rgba(52,211,153,.05)',border:`1px solid ${groupStats.net<0?'rgba(248,113,113,.2)':'rgba(52,211,153,.2)'}`,borderRadius:10,padding:14}}>
                  <p style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>P&L группы</p>
                  {[
                    {label:'Депозит',  value:fmt(groupStats.dep), color:'var(--green)'},
                    {label:'Вывод',    value:fmt(groupStats.wit), color:groupStats.wr>1?'var(--red)':'var(--text)'},
                    {label:'NET',      value:fmt(groupStats.net), color:netColor(groupStats.net), bold:true},
                    {label:'WR (ср.)', value:(groupStats.wr*100).toFixed(1)+'%', color:wrColor(groupStats.wr)},
                  ].map(r=>(
                    <div key={r.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--border)'}}>
                      <span style={{fontSize:12,color:'var(--text3)'}}>{r.label}</span>
                      <span style={{fontSize:r.bold?15:13,fontWeight:r.bold?700:500,fontFamily:'Geist Mono,monospace',color:r.color}}>{r.value}</span>
                    </div>
                  ))}
                </div>

                {/* Retention summary */}
                <div>
                  <p style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Удержания</p>
                  <div style={{display:'flex',flexDirection:'column',gap:4}}>
                    {[
                      {key:'full_retention',label:'Полное удержание',color:'var(--red)'},
                      {key:'deposit_returned',label:'Деп. возвращён',color:'var(--amber)'},
                      {key:'none',label:'Без удержания',color:'var(--text3)'},
                    ].map(r=>(
                      <div key={r.key} style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontSize:11,color:'var(--text3)',width:120,flexShrink:0}}>{r.label}</span>
                        <div className="mini-bar-track">
                          <div className="mini-bar-fill" style={{width:groupMembers.length?`${(groupStats.retCounts[r.key]||0)/groupMembers.length*100}%`:'0%',background:r.color}}/>
                        </div>
                        <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:r.color,minWidth:18,textAlign:'right'}}>{groupStats.retCounts[r.key]||0}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Payment methods */}
                {groupStats.topMethods.length>0&&(
                  <div>
                    <p style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Методы оплаты</p>
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      {groupStats.topMethods.map(([m,cnt])=>(
                        <div key={m} style={{display:'flex',alignItems:'center',gap:8}}>
                          <span style={{fontSize:11,color:'var(--text2)',width:90,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis'}}>{m}</span>
                          <div className="mini-bar-track">
                            <div className="mini-bar-fill" style={{width:`${cnt/groupMembers.length*100}%`,background:'var(--accent)'}}/>
                          </div>
                          <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text3)',minWidth:18,textAlign:'right'}}>{cnt}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Countries */}
                {groupStats.topCountries.length>0&&(
                  <div>
                    <p style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Страны</p>
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      {groupStats.topCountries.map(([c,cnt])=>(
                        <div key={c} style={{display:'flex',alignItems:'center',gap:8}}>
                          <span style={{fontSize:11,color:'var(--text2)',width:40,flexShrink:0}}>{c}</span>
                          <div className="mini-bar-track">
                            <div className="mini-bar-fill" style={{width:`${cnt/groupMembers.length*100}%`,background:'var(--violet)'}}/>
                          </div>
                          <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text3)',minWidth:18,textAlign:'right'}}>{cnt}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Created by */}
                <div style={{fontSize:11,color:'var(--text3)',fontFamily:'Geist Mono,monospace',paddingTop:8,borderTop:'1px solid var(--border)'}}>
                  <div>Создал: {selectedGroup.created_by||'—'}</div>
                  <div>Дата: {fmtDate(selectedGroup.created_at)}</div>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   CREATE/EDIT GROUP MODAL
═══════════════════════════════════════════ */
/* ═══════════════════════════════════════════
   IMPORT GROUPS MODAL — imports players into a new group
═══════════════════════════════════════════ */
function ImportGroupsModal({onClose, onImport, existingGroups, existingPlayers, userEmail}){
  useEscape(onClose);
  const [step,setStep]     = useState(1);
  const [raw,setRaw]       = useState('');
  const [info,setInfo]     = useState('');
  const [parsed,setParsed] = useState({headers:[],rows:[]});
  const [mapping,setMapping] = useState({});
  const [sending,setSending] = useState(false);
  const fileRef = useRef(null);

  // Group metadata
  const [groupName, setGroupName]     = useState('');
  const [groupStatus, setGroupStatus] = useState('active');
  const [groupTgLink, setGroupTgLink] = useState('');
  const [groupTags, setGroupTags]     = useState('');
  const [groupNotes, setGroupNotes]   = useState('');

  // Per-row status/retention overrides
  const [overrides,setOverrides] = useState({});
  const [bulkStatus,setBulkStatus] = useState('');
  const [bulkRet,setBulkRet]       = useState('');

  const loadFile = e => {
    const file = e.target.files[0]; if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext==='xlsx'||ext==='xls'){
      const fr=new FileReader();
      fr.onload=ev=>{
        try{
          const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true,cellText:false});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
          const txt=arr.map(r=>r.map(c=>String(c??'').replace(/\t/g,' ')).join('\t')).join('\n');
          setRaw(txt); setInfo(`${file.name} · ${arr.length-1} строк`);
        }catch(err){alert('Ошибка: '+err.message);}
      };
      fr.readAsArrayBuffer(file);
    } else {
      const fr=new FileReader();
      fr.onload=ev=>{setRaw(ev.target.result);setInfo(file.name);};
      fr.readAsText(file,'UTF-8');
    }
    e.target.value='';
  };

  const doParse = () => {
    if(!raw.trim()){alert('Нет данных');return;}
    const p=parseRaw(raw);
    if(!p.headers.length){alert('Не удалось распарсить.');return;}
    const sep=detectSep(raw.split(/\r?\n/)[0]);
    const sepName=sep==='\t'?'Tab':sep===';'?'Точка с запятой':'Запятая';
    setInfo(prev=>prev+` · ${sepName} · ${p.headers.length} кол. · ${p.rows.length} строк`);
    setParsed(p); setMapping(fuzzyMap(p.headers)); setOverrides({}); setStep(2);
  };

  const applyBulk = () => {
    if(!bulkStatus&&!bulkRet) return;
    const next={};
    parsed.rows.forEach((_,i)=>{ next[i]={status:bulkStatus||'new',retention_type:bulkRet||'none'}; });
    setOverrides(next);
  };

  const setRowOverride = (i, field, val) => {
    setOverrides(prev=>({...prev,[i]:{...(prev[i]||{}), [field]:val}}));
  };

  const newGroupId = useMemo(()=>{
    const nums=existingGroups.map(g=>parseInt(String(g.group_id||'').replace('GRP-',''))||0);
    const n=(nums.length?Math.max(...nums):0)+1;
    return 'GRP-'+String(n).padStart(3,'0');
  },[existingGroups]);

  const preview = useMemo(()=>{
    if(step<3) return [];
    const existingIds = new Set((existingPlayers||[]).map(p=>String(p.user_id)));
    return parsed.rows.map((row,ri)=>{
      const obj={};
      for(const {key} of SYSTEM_FIELDS){
        const col=mapping[key]; const idx=col?parsed.headers.indexOf(col):-1;
        let val=idx>=0?row[idx]:'';
        if(['total_deposit','total_withdrawal'].includes(key)) val=parseFloat(val)||0;
        obj[key]=val;
      }
      const ov = overrides[ri]||{};
      obj.status         = ov.status         || 'new';
      obj.retention_type = ov.retention_type || 'none';
      obj.retention_date = (ov.retention_type&&ov.retention_type!=='none') ? new Date().toISOString().split('T')[0] : '';
      obj.group_id       = newGroupId;
      obj.net_balance    = (obj.total_deposit||0) - (obj.total_withdrawal||0);
      obj.added_by       = userEmail;
      obj.added_at       = new Date().toISOString().split('T')[0];
      obj._isDuplicate   = existingIds.has(String(obj.user_id));
      return obj;
    });
  },[step,parsed,mapping,userEmail,overrides,existingPlayers,newGroupId]);

  const doImport = async () => {
    if(!groupName.trim()){alert('Укажите название группы');return;}
    setSending(true);
    const m=new Map();
    for(const p of preview){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    const finalPlayers=[...m.values()].map(({_isDuplicate,...rest})=>rest);
    const group = {
      group_id: newGroupId,
      name: groupName.trim(),
      status: groupStatus,
      tags: groupTags.trim(),
      notes: groupNotes.trim(),
      telegram_link: groupTgLink.trim(),
      member_ids: finalPlayers.map(p=>String(p.user_id)).join(','),
      created_by: userEmail,
      created_at: new Date().toISOString().split('T')[0],
    };
    onImport({group, players:finalPlayers});
    setSending(false); onClose();
  };

  const STEPS=['1. Загрузить','2. Маппинг + Группа','3. Предпросмотр'];

  return(
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal fade-in" style={{maxWidth:860}}>
        <div className="modal-header">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <Icon name="layers" size={16} style={{color:'var(--violet)'}}/>
              <span style={{fontWeight:600,fontSize:15}}>Импорт игроков в группу</span>
            </div>
            <button className="btn btn-ghost" style={{padding:'5px 8px'}} onClick={onClose}><Icon name="x" size={14}/></button>
          </div>
          <div style={{display:'flex',gap:6}}>
            {STEPS.map((s,i)=>(
              <div key={i} className={`step-pill ${step===i+1?'current':step>i+1?'done':''}`}>
                <span style={{marginRight:4}}>{step>i+1?'✓':i+1}</span>{s}
              </div>
            ))}
          </div>
        </div>

        <div className="modal-body">
          {/* STEP 1: Upload */}
          {step===1&&(
            <div className="fade-in">
              <div style={{padding:'10px 14px',background:'rgba(167,139,250,.06)',border:'1px solid rgba(167,139,250,.2)',borderRadius:8,marginBottom:14,fontSize:12,color:'var(--violet)'}}>
                <Icon name="info" size={13} style={{marginRight:6}}/>
                Загрузите файл с данными игроков. Колонки: <span style={{fontFamily:'monospace'}}>user_id, payment_method, total_deposit, total_withdrawal, ...</span>
              </div>
              <div onClick={()=>fileRef.current.click()}
                style={{border:'2px dashed rgba(167,139,250,.3)',borderRadius:10,padding:24,textAlign:'center',cursor:'pointer',transition:'border-color .15s'}}
                onMouseOver={e=>e.currentTarget.style.borderColor='var(--violet)'}
                onMouseOut={e=>e.currentTarget.style.borderColor='rgba(167,139,250,.3)'}>
                <Icon name="upload" size={24} style={{color:'var(--violet)',margin:'0 auto 8px'}}/>
                <p style={{color:'var(--text2)',fontSize:13,marginBottom:3}}>Кликните для выбора файла</p>
                <p style={{color:'var(--text3)',fontSize:12}}>Excel (.xlsx .xls), CSV, TSV</p>
                {info&&<p style={{color:'var(--violet)',fontSize:12,marginTop:6,fontFamily:'monospace'}}>{info}</p>}
              </div>
              <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" style={{display:'none'}} onChange={loadFile}/>
              <div style={{display:'flex',alignItems:'center',gap:10,margin:'12px 0',color:'var(--text3)',fontSize:12}}>
                <div style={{flex:1,height:1,background:'var(--border)'}}/>или вставьте текст<div style={{flex:1,height:1,background:'var(--border)'}}/>
              </div>
              <textarea className="input mono" style={{height:90,resize:'none',display:'block'}}
                placeholder="user_id&#9;payment_method&#9;total_deposit&#9;total_withdrawal&#9;country&#10;user1&#9;card&#9;1000&#9;500&#9;KZ"
                value={raw} onChange={e=>setRaw(e.target.value)}/>
            </div>
          )}

          {/* STEP 2: Column mapping + Group metadata + Bulk status */}
          {step===2&&(
            <div className="fade-in" style={{maxHeight:'60vh',overflowY:'auto'}}>
              {info&&<div style={{background:'rgba(167,139,250,.06)',border:'1px solid rgba(167,139,250,.2)',borderRadius:8,padding:'7px 12px',fontSize:12,fontFamily:'monospace',color:'var(--violet)',marginBottom:10}}>{info}</div>}

              {/* Group metadata */}
              <div style={{background:'var(--bg3)',borderRadius:10,padding:14,marginBottom:14,border:'1px solid var(--border)'}}>
                <div style={{fontSize:12,fontWeight:600,color:'var(--violet)',marginBottom:10}}>
                  <Icon name="layers" size={12} style={{marginRight:6}}/>Данные группы
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  <div>
                    <label style={{fontSize:11,color:'var(--text2)',display:'block',marginBottom:4}}>Название группы *</label>
                    <input className="input" placeholder="Мульти-акк KZ" value={groupName} onChange={e=>setGroupName(e.target.value)}/>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:'var(--text2)',display:'block',marginBottom:4}}>Статус</label>
                    <select className="input" value={groupStatus} onChange={e=>setGroupStatus(e.target.value)}>
                      {Object.entries(GROUP_STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:'var(--text2)',display:'block',marginBottom:4}}>Telegram ссылка</label>
                    <input className="input" placeholder="https://t.me/..." value={groupTgLink} onChange={e=>setGroupTgLink(e.target.value)}/>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:'var(--text2)',display:'block',marginBottom:4}}>Теги</label>
                    <input className="input" placeholder="KZ,fast-withdraw" value={groupTags} onChange={e=>setGroupTags(e.target.value)}/>
                  </div>
                </div>
                <div style={{marginTop:10}}>
                  <label style={{fontSize:11,color:'var(--text2)',display:'block',marginBottom:4}}>Описание схемы</label>
                  <textarea className="input" placeholder="Описание..." value={groupNotes} onChange={e=>setGroupNotes(e.target.value)} style={{height:50}}/>
                </div>
              </div>

              {/* Column mapping */}
              <div style={{fontSize:12,fontWeight:600,color:'var(--text2)',marginBottom:8}}>Маппинг колонок</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
                {SYSTEM_FIELDS.map(({key,label})=>(
                  <div key={key} style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:130,flexShrink:0,fontSize:12,color:'var(--text2)'}}>{label}</div>
                    <select className="input" style={{flex:1}} value={mapping[key]||''} onChange={e=>setMapping(m=>({...m,[key]:e.target.value}))}>
                      <option value="">— не выбрано —</option>
                      {parsed.headers.map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>
                ))}
              </div>

              {/* Bulk status/retention */}
              <div style={{background:'var(--bg3)',borderRadius:10,padding:14,border:'1px solid var(--border)'}}>
                <div style={{fontSize:12,fontWeight:600,color:'var(--text2)',marginBottom:8}}>Статус и удержание (для всех)</div>
                <div style={{display:'flex',gap:10,alignItems:'flex-end'}}>
                  <div style={{flex:1}}>
                    <label style={{fontSize:11,color:'var(--text3)'}}>Статус</label>
                    <select className="input" value={bulkStatus} onChange={e=>setBulkStatus(e.target.value)}>
                      <option value="">— по умолчанию (Новый) —</option>
                      {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <label style={{fontSize:11,color:'var(--text3)'}}>Удержание</label>
                    <select className="input" value={bulkRet} onChange={e=>setBulkRet(e.target.value)}>
                      <option value="">— по умолчанию (Нет) —</option>
                      {RETENTION_OPTIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
                    </select>
                  </div>
                  <button className="btn btn-ghost btn-sm" onClick={applyBulk} style={{flexShrink:0}}>Применить</button>
                </div>
                <p style={{fontSize:10,color:'var(--text3)',marginTop:6}}>После применения можно изменить статус/удержание для отдельных строк в предпросмотре</p>
              </div>
            </div>
          )}

          {/* STEP 3: Preview */}
          {step===3&&(
            <div className="fade-in" style={{maxHeight:'60vh',overflowY:'auto'}}>
              {/* Group info summary */}
              <div style={{background:'rgba(167,139,250,.06)',border:'1px solid rgba(167,139,250,.2)',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
                <div style={{fontSize:12,color:'var(--violet)',fontWeight:600,marginBottom:4}}>
                  Группа: {newGroupId} · {groupName||'(без названия)'}
                </div>
                <div style={{fontSize:11,color:'var(--text3)'}}>
                  Статус: {(GROUP_STATUS[groupStatus]||GROUP_STATUS.active).label}
                  {groupTgLink&&<> · <a href={groupTgLink} target="_blank" rel="noopener" style={{color:'var(--accent)'}}>Telegram</a></>}
                  {groupTags&&<> · Теги: {groupTags}</>}
                </div>
              </div>

              <p style={{color:'var(--text2)',fontSize:13,marginBottom:8}}>
                Игроки · <span style={{color:'var(--violet)',fontWeight:600}}>{preview.length}</span>
                {preview.filter(p=>p._isDuplicate).length>0&&(
                  <span style={{color:'var(--amber)',fontSize:12,marginLeft:8}}>
                    · {preview.filter(p=>p._isDuplicate).length} уже в базе (будут обновлены)
                  </span>
                )}
              </p>

              <div className="tbl-wrap">
                <table className="tbl">
                  <thead><tr>
                    <th>User ID</th><th>Deposit</th><th>Withdrawal</th><th>Net</th><th>Country</th><th>Статус</th><th>Удержание</th>
                  </tr></thead>
                  <tbody>{preview.slice(0,100).map((p,i)=>(
                    <tr key={i}>
                      <td style={{fontFamily:'Geist Mono,monospace',fontSize:11,color:p._isDuplicate?'var(--amber)':'var(--text)'}}>
                        {p.user_id}{p._isDuplicate?<span style={{fontSize:9,marginLeft:4}}>(обн.)</span>:null}
                      </td>
                      <td style={{fontFamily:'Geist Mono,monospace',fontSize:11}}>{fmt(p.total_deposit)}</td>
                      <td style={{fontFamily:'Geist Mono,monospace',fontSize:11}}>{fmt(p.total_withdrawal)}</td>
                      <td style={{fontFamily:'Geist Mono,monospace',fontSize:11,color:netColor(p.net_balance)}}>{fmt(p.net_balance)}</td>
                      <td style={{fontSize:11}}>{p.country||'—'}</td>
                      <td>
                        <select className="input" style={{fontSize:10,padding:'2px 4px',width:'auto'}} value={p.status}
                          onChange={e=>setRowOverride(i,'status',e.target.value)}>
                          {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                        </select>
                      </td>
                      <td>
                        <select className="input" style={{fontSize:10,padding:'2px 4px',width:'auto'}} value={p.retention_type}
                          onChange={e=>setRowOverride(i,'retention_type',e.target.value)}>
                          {RETENTION_OPTIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
                        </select>
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
              {preview.length>100&&<p style={{fontSize:11,color:'var(--text3)',marginTop:6}}>...и ещё {preview.length-100}</p>}
            </div>
          )}
        </div>

        <div className="modal-footer">
          {step>1?<button className="btn btn-ghost" onClick={()=>setStep(s=>s-1)}><Icon name="arrowLeft" size={14}/>Назад</button>:<div/>}
          {step===1&&<button className="btn btn-primary" onClick={doParse} disabled={!raw.trim()} style={{background:'var(--violet)'}}><Icon name="arrowRight" size={14}/>Распарсить</button>}
          {step===2&&<button className="btn btn-primary" onClick={()=>{if(!groupName.trim()){alert('Укажите название группы');return;}setStep(3);}} style={{background:'var(--violet)'}}><Icon name="arrowRight" size={14}/>Предпросмотр</button>}
          {step===3&&(
            <button className="btn btn-primary" onClick={doImport} disabled={sending||!preview.length} style={{background:'var(--violet)'}}>
              <Icon name="upload" size={14}/>{sending?'Сохранение…':`Импортировать ${preview.length} игроков`}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}


function CreateGroupModal({ groups, onSave, onClose, editGroup }){
  useEscape(onClose);
  const [name,    setName]    = useState(editGroup?.name||'');
  const [status,  setStatus]  = useState(editGroup?.status||'active');
  const [tags,    setTags]    = useState(editGroup?.tags||'');
  const [notes,   setNotes]   = useState(editGroup?.notes||'');
  const [tgLink,  setTgLink]  = useState(editGroup?.telegram_link||'');

  const save = () => {
    if(!name.trim()) return;
    const group = {
      ...(editGroup||{}),
      name:name.trim(), status, tags:tags.trim(), notes:notes.trim(),
      telegram_link: tgLink.trim(),
      member_ids: editGroup?.member_ids||'',

    onClose();

  return(
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>

            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Название группы *</label>
            <input className="input" placeholder="Например: Букмекеры KZ #1" value={name} onChange={e=>setName(e.target.value)} autoFocus/>

          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Теги (через запятую)</label>
            <input className="input" placeholder="fast-withdraw, KZ, multi-account" value={tags} onChange={e=>setTags(e.target.value)}/>

          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Описание схемы</label>
            <textarea className="input" placeholder="Общее описание мошеннической схемы, паттерны, связи..." value={notes} onChange={e=>setNotes(e.target.value)} style={{height:90}}/>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Ссылка Telegram</label>
            <input className="input" placeholder="https://t.me/..." value={tgLink} onChange={e=>setTgLink(e.target.value)}/>
            <p style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Ссылка на сообщение в Telegram где опубликована группа</p>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Отмена</button>

        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   MINI BAR CHART
═══════════════════════════════════════════ */
function MiniBar({data, color='var(--accent)'}){
  if(!data||!data.length) return <p style={{color:'var(--text3)',fontSize:12}}>Нет данных</p>;
  const max=Math.max(...data.map(d=>d.value),1);
  return(
    <div>{data.map((d,i)=>(
      <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
        <span style={{fontSize:11,color:'var(--text2)',minWidth:90,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</span>
        <div style={{flex:1,height:6,background:'var(--bg3)',borderRadius:3,overflow:'hidden'}}>
          <div style={{width:`${(d.value/max*100).toFixed(1)}%`,height:'100%',background:color,borderRadius:3}}/>
        </div>
        <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text2)',minWidth:28,textAlign:'right'}}>{d.value}</span>
      </div>
    ))}</div>
  );
}

/* ═══════════════════════════════════════════
   ANALYST MODAL — расширенный отчёт для аналитика
═══════════════════════════════════════════ */
function AnalystModal({group, members, onClose}){
  useEscape(onClose);
  const totalDep = members.reduce((s,m)=>s+(m.total_deposit||0),0);
  const totalWit = members.reduce((s,m)=>s+(m.total_withdrawal||0),0);
  const netTotal = totalDep - totalWit;
  const avgWR    = members.length ? members.reduce((s,m)=>s+(m.withdrawal_rate||0),0)/members.length : 0;

  const retCounts = {none:0,deposit_returned:0,full_retention:0};
  members.forEach(m=>{const t=m.retention_type||'none'; retCounts[t]=(retCounts[t]||0)+1;});

  const methodMap={}, countryMap={}, asnMap={}, deviceMap={};
  members.forEach(m=>{
    if(m.payment_method) methodMap[m.payment_method]=(methodMap[m.payment_method]||0)+1;
    splitVal(m.country).forEach(c=>{if(c)countryMap[c]=(countryMap[c]||0)+1;});
    splitVal(m.asn).forEach(a=>{if(a)asnMap[a]=(asnMap[a]||0)+1;});
    const dc=devCat(m.device)||m.device||'Другое';
    deviceMap[dc]=(deviceMap[dc]||0)+1;
  });

  // Unique wallets
  const depWallets  = [...new Set(members.map(m=>m.deposit_wallet).filter(Boolean))];
  const witWallets  = [...new Set(members.map(m=>m.withdrawal_wallet).filter(Boolean))];
  const sharedDepW  = depWallets.filter(w=>members.filter(m=>m.deposit_wallet===w).length>1);
  const sharedWitW  = witWallets.filter(w=>members.filter(m=>m.withdrawal_wallet===w).length>1);

  const mData = Object.entries(methodMap).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  const cData = Object.entries(countryMap).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  const aData = Object.entries(asnMap).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  const dData = Object.entries(deviceMap).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));

  const exportXLSX=()=>{
    const data = members.map(m=>{
      const dm=derive(m);
      return {
        user_id:m.user_id, status:m.status||'', retention_type:m.retention_type||'',
        retention_date:m.retention_date||'', total_deposit:m.total_deposit||0,
        total_withdrawal:m.total_withdrawal||0, net:dm.net_balance,
        wr:dm.withdrawal_rate?(dm.withdrawal_rate*100).toFixed(1)+'%':'0%',
        currency:m.currency||'', country:m.country||'', asn:m.asn||'',
        payment_method:m.payment_method||'', device:m.device||'',
        deposit_wallet:m.deposit_wallet||'', withdrawal_wallet:m.withdrawal_wallet||'',
        limit:m.limit||'', created_at:m.created_at||'', added_by:m.added_by||'',
      };
    });
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, `${group.group_id}_${group.name||'report'}.xlsx`);
  };
  const copyIds      = ()=>navigator.clipboard.writeText(members.map(m=>m.user_id).join('\n')).catch(()=>{});
  const exportSheets = ()=>sheetsExportGroup(group,members);

  const retLabel = t=>({none:'—',deposit_returned:'Деп. возвращён',full_retention:'Полное удержание'}[t]||t);

  return(
    <div className="modal-backdrop" style={{zIndex:60}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal fade-in" style={{maxWidth:1160,maxHeight:'95vh'}}>

        {/* ── Header ── */}
        <div className="modal-header" style={{padding:'16px 24px 14px'}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6,flexWrap:'wrap'}}>
                <Icon name="layers" size={16} style={{color:'var(--violet)'}}/>
                <span style={{fontWeight:700,fontSize:16}}>{group.name}</span>
                <span style={{fontFamily:'Geist Mono,monospace',fontSize:12,color:'var(--text3)'}}>{group.group_id}</span>
                <span className="badge" style={{fontSize:11,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',color:'var(--accent)'}}>
                  {(GROUP_STATUS[group.status||'active']||GROUP_STATUS.active).label}
                </span>
                {group.telegram_link&&(
                  <a href={group.telegram_link} target="_blank" rel="noopener"
                    style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,color:'var(--accent)',textDecoration:'none',background:'var(--accentbg)',border:'1px solid var(--accentbdr)',padding:'2px 8px',borderRadius:5}}>
                    <Icon name="externalLink" size={11}/>Telegram
                  </a>
                )}
              </div>
              <div style={{fontSize:12,color:'var(--text3)'}}>
                Создана: {fmtDate(group.created_at)} · {group.created_by}
                {group.notes&&<span style={{marginLeft:12,color:'var(--text2)'}}> · {group.notes}</span>}
              </div>
            </div>
            <button className="btn btn-ghost" style={{padding:'7px 10px',flexShrink:0}} onClick={onClose}><Icon name="x" size={15}/></button>
          </div>
        </div>

        <div className="modal-body" style={{overflowY:'auto',flex:1,padding:'18px 24px',display:'flex',flexDirection:'column',gap:16}}>

          {/* ── KPI row ── */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
            {[
              {label:'Участников',  value:members.length,  color:'var(--accent)',  fmtFn:v=>v},
              {label:'Депозиты',    value:totalDep,         color:'var(--green)',   fmtFn:v=>fmt(v,0)},
              {label:'Выводы',      value:totalWit,         color:'var(--red)',     fmtFn:v=>fmt(v,0)},
              {label:'NET (убыток)',value:netTotal,          color:netColor(netTotal),fmtFn:v=>fmt(v,0)},
              {label:'Ср. WR',      value:avgWR,            color:wrColor(avgWR),  fmtFn:v=>(v*100).toFixed(1)+'%'},
            ].map(k=>(
              <div key={k.label} className="card-sm">
                <div style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>{k.label}</div>
                <div style={{fontSize:20,fontWeight:700,fontFamily:'Geist Mono,monospace',color:k.color,lineHeight:1.1}}>{k.fmtFn(k.value)}</div>
              </div>
            ))}
          </div>

          {/* ── Retention + Wallets summary row ── */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {/* Retention */}
            <div className="card" style={{padding:'12px 16px'}}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>Удержания</div>
              {[
                {k:'full_retention',  icon:'lock',    c:'var(--red)',   bg:'rgba(248,113,113,.08)',  bc:'rgba(248,113,113,.2)'},
                {k:'deposit_returned',icon:'scissors',c:'var(--amber)', bg:'rgba(251,191,36,.06)',   bc:'rgba(251,191,36,.2)'},
                {k:'none',            icon:'check',   c:'var(--text3)', bg:'var(--bg3)',              bc:'var(--border)'},
              ].map(r=>(
                <div key={r.k} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:7,background:r.bg,border:`1px solid ${r.bc}`,marginBottom:6}}>
                  <Icon name={r.icon} size={12} style={{color:r.c}}/>
                  <span style={{fontSize:12,color:'var(--text2)',flex:1}}>{retLabel(r.k)}</span>
                  <span style={{fontFamily:'Geist Mono,monospace',fontWeight:700,color:r.c,fontSize:14}}>{retCounts[r.k]||0}</span>
                </div>
              ))}
            </div>
            {/* Wallets */}
            <div className="card" style={{padding:'12px 16px'}}>

              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>Депозит ({depWallets.length} уникальных{sharedDepW.length?`, ${sharedDepW.length} общих`:''}):</div>
                {sharedDepW.length>0&&sharedDepW.slice(0,3).map(w=>(
                  <div key={w} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                    <Icon name="link" size={10} style={{color:'var(--red)',flexShrink:0}}/>
                    <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'var(--red)',overflow:'hidden',textOverflow:'ellipsis'}}>{w}</span>
                    <span style={{fontSize:10,color:'var(--red)',flexShrink:0}}>×{members.filter(m=>m.deposit_wallet===w).length}</span>
                  </div>
                ))}
                {sharedDepW.length===0&&<span style={{fontSize:11,color:'var(--text3)'}}>Совпадений нет</span>}
              </div>
              <div>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>Вывод ({witWallets.length} уникальных{sharedWitW.length?`, ${sharedWitW.length} общих`:''}):</div>
                {sharedWitW.length>0&&sharedWitW.slice(0,3).map(w=>(
                  <div key={w} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                    <Icon name="link" size={10} style={{color:'var(--amber)',flexShrink:0}}/>
                    <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'var(--amber)',overflow:'hidden',textOverflow:'ellipsis'}}>{w}</span>
                    <span style={{fontSize:10,color:'var(--amber)',flexShrink:0}}>×{members.filter(m=>m.withdrawal_wallet===w).length}</span>

                {sharedWitW.length===0&&<span style={{fontSize:11,color:'var(--text3)'}}>Совпадений нет</span>}
              </div>
            </div>
          </div>

          {/* ── Full member table ── */}
          <div>
            <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Состав группы ({members.length})</div>

                  {['User ID','Статус','Удержание','Депозит','Вывод','Net','WR','Страна','ASN','Метод','Устройство','Кошелёк деп.','Кошелёк выв.','Limit','Дата рег.','Добавил'].map(h=><th key={h}>{h}</th>)}

/* ═══════════════════════════════════════════
   TAB 2.5 — LOOK-ALIKE
═══════════════════════════════════════════ */

const jaccard = (a, b) => {
  const sa = new Set(splitVal(a).map(v=>v.toLowerCase()));
  const sb = new Set(splitVal(b).map(v=>v.toLowerCase()));
  if(!sa.size && !sb.size) return 1;
  if(!sa.size || !sb.size) return 0;
  const inter = [...sa].filter(x=>sb.has(x)).length;
  return inter / (sa.size + sb.size - inter);
};

function LookAlike({players, groups, comments, userEmail, onUpdatePlayer, onAddComment, onDeleteComment, onEditComment, setTab}){
  const derived = useMemo(()=>players.map(derive),[players]);
  const [selectedPlayer, setSelectedPlayer] = useState(null);

  // Sync selectedPlayer with updated players data
  useEffect(()=>{
    if(selectedPlayer){
      const upd=players.find(p=>p.user_id===selectedPlayer.user_id);
      if(upd) setSelectedPlayer(derive(upd));
      else setSelectedPlayer(null);
    }
  },[players]);

  const allCountries  = useMemo(()=>{const c={};derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([v])=>v);},[derived]);
  const allAsns       = useMemo(()=>{const c={};derived.flatMap(p=>splitVal(p.asn)).forEach(v=>{if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([v])=>v);},[derived]);
  const allMethods    = useMemo(()=>[...new Set(derived.map(p=>p.payment_method).filter(Boolean))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);

  const EMPTY = {payment_method:'', total_deposit_min:'', total_deposit_max:'', country:'', asn:'', device:'', currency:''};
  const [filters, setFilters] = useState(EMPTY);
  const [results, setResults] = useState([]);
  const [ran,     setRan]     = useState(false);
  const [limit,   setLimit]   = useState(50);
  const ff = (k,v) => setFilters(f=>({...f,[k]:v}));
  const hasF = Object.values(filters).some(Boolean);

  // Weights — tuned for fraud detection
  const W = {
    payment_method:   3.0,  // same payment method = strong signal
    country:          2.5,  // same country (Jaccard for multi-value)
    asn:              3.0,  // same ISP/ASN = very strong signal
    device:           1.5,  // same device category
    deposit_range:    2.0,  // deposit amount in range
    currency:         1.5,  // same currency
  };

  const run = () => {
    const active = Object.entries(filters).filter(([,v])=>v);
    if(!active.length){ setResults([]); setRan(true); return; }

    const results = derived.map(p => {
      let score = 0; let maxPossible = 0; const signals = [];

      // Payment method
      if(filters.payment_method){
        maxPossible += W.payment_method;
        if(p.payment_method?.toLowerCase().includes(filters.payment_method.toLowerCase())){
          score += W.payment_method; signals.push('Метод');
        }
      }

      // Country (Jaccard)
      if(filters.country){
        maxPossible += W.country;
        const j = jaccard(filters.country, p.country);
        if(j>0){ score += j * W.country; signals.push(`Страна`); }
      }

      // ASN (Jaccard)
      if(filters.asn){
        maxPossible += W.asn;
        const j = jaccard(filters.asn, p.asn);
        if(j>0){ score += j * W.asn; signals.push(`ASN`); }
      }

      // Device
      if(filters.device){
        maxPossible += W.device;
        if(devCat(p.device)===filters.device){ score += W.device; signals.push('Устройство'); }
      }

      // Deposit range
      if(filters.total_deposit_min||filters.total_deposit_max){
        maxPossible += W.deposit_range;
        const dep  = p.total_deposit||0;
        const dMin = filters.total_deposit_min ? parseFloat(filters.total_deposit_min) : 0;
        const dMax = filters.total_deposit_max ? parseFloat(filters.total_deposit_max) : Infinity;
        if(dep >= dMin && dep <= dMax){ score += W.deposit_range; signals.push('Депозит'); }
        else if(dMin>0&&dep>0){
          const ratio = dep<dMin ? dep/dMin : dMin/dep;
          if(ratio>0.7){ score += W.deposit_range*ratio*0.5; signals.push('Депозит≈'); }
        }
      }

      // Currency
      if(filters.currency){
        maxPossible += W.currency;
        if(p.currency===filters.currency){ score += W.currency; signals.push('Валюта'); }
      }

      if(maxPossible===0||score===0) return null;
      return {...p, _score: score/maxPossible, _signals: signals};
    }).filter(Boolean).sort((a,b)=>b._score-a._score).slice(0,limit);

    setResults(results); setRan(true);
  };

  const exportCSV = () => {
    const cols = ['user_id','_score','_signals','group_id','status','country','asn','payment_method','device','total_deposit','net_balance','retention_type','currency'];
    const rows = [
      ['user_id','схожесть','сигналы','группа','статус','страна','asn','метод','устройство','депозит','net','удержание','валюта'],
      ...results.map(p=>cols.map(c=>{
        if(c==='_score')   return (p[c]*100).toFixed(1)+'%';
        if(c==='_signals') return (p[c]||[]).join('; ');
        return p[c]??'';
      }))
    ];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='lookalike.csv'; a.click();
  };

  return(
    <div className="fade-in">
      {/* Filter card */}
      <div className="card" style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <Icon name="filter" size={15} style={{color:'var(--accent)'}}/>
            <span style={{fontWeight:600,fontSize:14}}>Поиск похожих аккаунтов</span>
            <span style={{fontSize:11,color:'var(--text3)'}}>Укажите один или несколько параметров</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:11,color:'var(--text3)'}}>Топ</span>
            <select className="input" style={{width:70}} value={limit} onChange={e=>setLimit(+e.target.value)}>
              {[20,50,100,200].map(n=><option key={n} value={n}>{n}</option>)}
            </select>
            {hasF&&<button className="btn btn-ghost" style={{fontSize:12}} onClick={()=>{setFilters(EMPTY);setResults([]);setRan(false);}}><Icon name="xCircle" size={13}/>Сбросить</button>}
          </div>
        </div>

        {/* KEY FIELDS - prominent */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:12,marginBottom:12}}>
          {/* Payment method - most important */}
          <div>
            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>
              <Icon name="creditCard" size={10} style={{color:'var(--accent)'}}/>Метод оплаты
              <span style={{fontSize:9,color:'var(--accent)',background:'var(--accentbg)',padding:'1px 4px',borderRadius:3}}>★</span>
            </label>
            <input className="input" list="la-mth" placeholder="Card, Crypto, QIWI..." value={filters.payment_method} onChange={e=>ff('payment_method',e.target.value)}/>
            <datalist id="la-mth">{allMethods.map(m=><option key={m} value={m}/>)}</datalist>
          </div>

          {/* Country */}
          <div>
            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>
              <Icon name="globe" size={10} style={{color:'var(--accent)'}}/>Страна
              <span style={{fontSize:9,color:'var(--accent)',background:'var(--accentbg)',padding:'1px 4px',borderRadius:3}}>★</span>
            </label>
            <input className="input" list="la-cnt" placeholder="RU, KZ, UA..." value={filters.country} onChange={e=>ff('country',e.target.value)}/>
            <datalist id="la-cnt">{allCountries.map(c=><option key={c} value={c}/>)}</datalist>
          </div>

          {/* ASN */}
          <div>
            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>
              <Icon name="wifi" size={10} style={{color:'var(--violet)'}}/>ASN / Провайдер
              <span style={{fontSize:9,color:'var(--accent)',background:'var(--accentbg)',padding:'1px 4px',borderRadius:3}}>★</span>
            </label>
            <input className="input" list="la-asn" placeholder="AS12345, Rostelecom..." value={filters.asn} onChange={e=>ff('asn',e.target.value)}/>
            <datalist id="la-asn">{allAsns.map(a=><option key={a} value={a}/>)}</datalist>
          </div>

          {/* Device */}
          <div>
            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>
              <Icon name="monitor" size={10} style={{color:'var(--text3)'}}/>Устройство
            </label>
            <select className="input" value={filters.device} onChange={e=>ff('device',e.target.value)}>
              <option value="">Все устройства</option>
              {['Mobile','Desktop','Tablet'].map(d=><option key={d}>{d}</option>)}
            </select>
          </div>

          {/* Deposit range */}
          <div>
            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>
              <Icon name="trendingUp" size={10} style={{color:'var(--green)'}}/>Сумма депозита
            </label>
            <div style={{display:'flex',gap:6}}>
              <input type="number" className="input" placeholder="от" value={filters.total_deposit_min} onChange={e=>ff('total_deposit_min',e.target.value)}/>
              <input type="number" className="input" placeholder="до" value={filters.total_deposit_max} onChange={e=>ff('total_deposit_max',e.target.value)}/>
            </div>
          </div>

          {/* Currency */}
          <div>
            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>
              <Icon name="dollar" size={10} style={{color:'var(--text3)'}}/>Валюта
            </label>
            <select className="input" value={filters.currency} onChange={e=>ff('currency',e.target.value)}>
              <option value="">Все</option>
              {allCurrencies.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-primary" onClick={run} disabled={!hasF||!players.length}>
            <Icon name="search" size={14}/>Найти похожих
          </button>
          {ran&&(
            <span style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>
              Найдено: <span style={{color:'var(--accent)'}}>{results.length}</span>
            </span>
          )}
          {ran&&results.length>0&&(
            <button className="btn btn-ghost" style={{marginLeft:'auto',fontSize:12}} onClick={exportCSV}>
              <Icon name="download" size={13}/>Скачать CSV
            </button>
          )}
        </div>
      </div>

      {/* Results */}
      {ran&&results.length>0&&(
        <div className="tbl-wrap fade-in">
          <table className="tbl">
            <thead><tr>
              <th>#</th>
              <th>User ID</th>
              <th>Схожесть</th>
              <th>Сигналы</th>
              <th>Группа</th>
              <th>Статус</th>
              <th>Страна</th>
              <th>ASN</th>
              <th>Метод</th>
              <th>Устройство</th>
              <th>Депозит</th>
              <th>Net</th>
              <th>Удержание</th>
            </tr></thead>
            <tbody>
              {results.map((p,i)=>{
                const sc  = Math.max(0,Math.min(1,p._score));
                const col = simColor(sc);
                const grp = groups?.find(g=>g.group_id===p.group_id);
                return(
                  <tr key={p.user_id+i}>
                    <td style={{color:'var(--text3)'}}>{i+1}</td>
                    <td><span className="uid-link" onClick={()=>setSelectedPlayer(p)} style={{cursor:'pointer'}}>{p.user_id}</span></td>
                    <td style={{minWidth:130}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <div className="sim-track" style={{flex:1}}><div className="sim-fill" style={{width:`${(sc*100).toFixed(0)}%`,background:col}}/></div>
                        <span style={{color:col,fontSize:11,fontFamily:'Geist Mono,monospace',minWidth:34,textAlign:'right',fontWeight:600}}>{(sc*100).toFixed(0)}%</span>
                      </div>
                    </td>
                    <td>
                      <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                        {(p._signals||[]).map(s=>(
                          <span key={s} style={{fontSize:9,padding:'2px 5px',borderRadius:3,background:'rgba(56,189,248,.1)',color:'var(--accent)',fontFamily:'Geist Mono,monospace',whiteSpace:'nowrap'}}>{s}</span>
                        ))}
                      </div>
                    </td>
                    <td>
                      {grp
                        ?<span onClick={()=>setTab(1)} style={{fontSize:10,padding:'2px 7px',borderRadius:4,background:'rgba(167,139,250,.12)',color:'var(--violet)',fontWeight:600,whiteSpace:'nowrap',cursor:'pointer'}} title="Перейти к группе">{grp.name}</span>
                        :<span style={{color:'var(--text3)',fontSize:12}}>—</span>}
                    </td>
                    <td><span style={{fontSize:10,color:'var(--text2)'}}>{statusInfo(p.status||'new').label}</span></td>
                    <td><Tags value={p.country} color="var(--accent)"/></td>
                    <td><Tags value={p.asn} color="var(--violet)"/></td>
                    <td style={{color:'var(--text2)',fontSize:12}}>{p.payment_method||'—'}</td>
                    <td style={{color:'var(--text2)',fontSize:12}}>{devCat(p.device)||p.device||'—'}</td>
                    <td style={{color:'var(--green)',fontWeight:500}}>{fmt(p.total_deposit)}</td>
                    <td style={{color:netColor(p.net_balance),fontWeight:500}}>{fmt(p.net_balance)}</td>
                    <td>{p.retention_type&&p.retention_type!=='none'?<RetentionBadge type={p.retention_type}/>:<span style={{color:'var(--text3)',fontSize:12}}>—</span>}</td>

      )}

      {ran&&!results.length&&(
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--text3)'}}>
          <Icon name="search" size={32} style={{margin:'0 auto 12px',display:'block',opacity:.2}}/>
          <p style={{fontSize:14}}>Похожих аккаунтов не найдено</p>
          <p style={{fontSize:12,marginTop:4}}>Попробуйте изменить параметры поиска</p>
        </div>
      )}

      {selectedPlayer&&(
        <PlayerDrawer
          player={selectedPlayer}
          groups={groups}
          comments={comments}
          userEmail={userEmail}
          onClose={()=>setSelectedPlayer(null)}
          onUpdatePlayer={onUpdatePlayer}
          onAddComment={onAddComment}
          onDeleteComment={onDeleteComment}
          onEditComment={onEditComment}
        />
      )}
    </div>
  );

function Analytics({players}){
  const derived=useMemo(()=>players.map(derive),[players]);
  const total=derived.length;
  const totalDep=derived.reduce((s,p)=>s+(p.total_deposit||0),0);
  const totalWit=derived.reduce((s,p)=>s+(p.total_withdrawal||0),0);
  const totalNet=totalDep-totalWit;
  const avgWr=totalDep>0?totalWit/totalDep:0;

  const confirmed=derived.filter(p=>p.status==='confirmed').length;
  const blocked=derived.filter(p=>p.status==='blocked').length;
  const withRetention=derived.filter(p=>p.retention_type&&p.retention_type!=='none').length;

  const countryData=useMemo(()=>{
    const c={};
    derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)c[v]=(c[v]||0)+1;});
    const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return {labels:top.map(x=>x[0]),values:top.map(x=>x[1])};
  },[derived]);
  const devData=useMemo(()=>{
    const c={};
    derived.map(p=>devCat(p.device)||'Other').forEach(v=>{c[v]=(c[v]||0)+1;});
    return {labels:Object.keys(c),values:Object.values(c)};
  },[derived]);
  const methodData=useMemo(()=>{
    const c={};
    derived.map(p=>p.payment_method).filter(Boolean).forEach(v=>{c[v]=(c[v]||0)+1;});
    const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return {labels:top.map(x=>x[0]),values:top.map(x=>x[1])};
  },[derived]);
  const statusData=useMemo(()=>{
    const c={};
    derived.map(p=>statusInfo(p.status||'new').label).forEach(v=>{c[v]=(c[v]||0)+1;});
    return {labels:Object.keys(c),values:Object.values(c)};
  },[derived]);

  const topAsns=useMemo(()=>{
    const cnt={};
    derived.flatMap(p=>splitVal(p.asn)).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  },[derived]);
  const maxAsn=topAsns[0]?.[1]||1;

  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12}}>
        {[
          {label:'Всего записей',  value:fmtI(total),      color:'var(--accent)'},
          {label:'Подтверждено',   value:confirmed,         color:'var(--red)'},
          {label:'Заблокировано',  value:blocked,           color:'#fca5a5'},
          {label:'С удержанием',   value:withRetention,     color:'var(--amber)'},
          {label:'Сумм. депозит',  value:fmt(totalDep,0),   color:'var(--green)'},
          {label:'Сумм. вывод',    value:fmt(totalWit,0),   color:avgWr>1?'var(--red)':'var(--text)'},
          {label:'NET (компания)', value:fmt(totalNet,0),   color:netColor(totalNet)},
          {label:'Ср. WR',         value:(avgWr*100).toFixed(1)+'%', color:wrColor(avgWr)},
        ].map(k=>(
          <div key={k.label} className="card-sm">
            <div className="kpi">
              <div className="kpi-value" style={{color:k.color,fontSize:20}}>{k.value}</div>
              <div className="kpi-label">{k.label}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card"><p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Топ-8 стран</p><ChartCanvas data={countryData} type="bar" color="var(--accent)"/></div>
        <div className="card"><p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Устройства</p><ChartCanvas data={devData} type="doughnut"/></div>
        <div className="card"><p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Методы оплаты</p><ChartCanvas data={methodData} type="bar" color="var(--violet)"/></div>
        <div className="card"><p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Статусы</p><ChartCanvas data={statusData} type="doughnut"/></div>
      </div>

      <div className="card">
        <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Топ-10 ASN</p>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {topAsns.map(([asn,cnt])=>{
            const pct=cnt/maxAsn;
            return(
              <div key={asn} style={{display:'flex',alignItems:'center',gap:12}}>
                <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--violet)',width:120,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis'}}>{asn}</span>
                <div style={{flex:2,height:5,background:'var(--bg3)',borderRadius:3,overflow:'hidden'}}>
                  <div style={{width:`${(pct*100).toFixed(1)}%`,height:'100%',background:'var(--violet)',borderRadius:3}}/>
                </div>
                <span style={{fontSize:12,fontFamily:'Geist Mono,monospace',color:'var(--text2)',minWidth:28,textAlign:'right'}}>{cnt}</span>
              </div>
            );
          })}
          {!topAsns.length&&<p style={{color:'var(--text3)',fontSize:13}}>Нет данных ASN</p>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 4 — CLEANUP
═══════════════════════════════════════════ */
function DataCleanup({players,setPlayers}){
  const [toast,setToast]=useState(null);
  const derived=useMemo(()=>players.map(derive),[players]);
  const stats=useMemo(()=>{
    const idC={},wC={};
    derived.forEach(p=>{ idC[p.user_id]=(idC[p.user_id]||0)+1; if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1; });
    return {
      unknownCountry:derived.filter(p=>!p.country||p.country.toUpperCase()==='UNKNOWN').length,
      zeroDeposit:derived.filter(p=>p.total_deposit===0).length,
      dupIds:Object.values(idC).filter(v=>v>1).length,
      dupWallets:Object.values(wC).filter(v=>v>1).length,
      wrOver1:derived.filter(p=>p.withdrawal_rate>1).length,
      noStatus:derived.filter(p=>!p.status||p.status==='').length,
    };
  },[derived]);

  const fixUnknown=useCallback(()=>{
    const modified = players.filter(p=>!p.country||p.country.toUpperCase()==='UNKNOWN').map(p=>({...p,country:'UNKNOWN'}));
    setPlayers(ps=>ps.map(p=>(!p.country||p.country.toUpperCase()==='UNKNOWN')?{...p,country:'UNKNOWN'}:p));
    if(modified.length) sheetsPost(modified);
    setToast({msg:`Пустые страны → UNKNOWN (${modified.length} синхр.)`,type:'ok'});
  },[players,setPlayers]);
  const fixDupIds=useCallback(()=>{
    const m=new Map(); for(const p of players){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);}
    const result=[...m.values()];
    setPlayers(result);
    sheetsPost(result);
    setToast({msg:'Дубли по user_id удалены (синхр.)',type:'ok'});
  },[players,setPlayers]);
  const fixDupWallets=useCallback(()=>{ const wC={}; players.forEach(p=>{if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;}); const dups=new Set(Object.entries(wC).filter(([,v])=>v>1).map(([k])=>k)); setPlayers(ps=>ps.map(p=>(p.deposit_wallet&&dups.has(p.deposit_wallet))?{...p,is_linked:true}:p)); setToast({msg:'Флаг is_linked проставлен',type:'ok'}); },[players,setPlayers]);
  const fixWrOver1=useCallback(()=>{ setPlayers(ps=>ps.map(p=>{const wr=p.total_deposit>0?p.total_withdrawal/p.total_deposit:0;return wr>1?{...p,needs_review:true}:p;})); setToast({msg:'Флаг needs_review проставлен',type:'ok'}); },[setPlayers]);
  const fixNoStatus=useCallback(()=>{
    const modified = players.filter(p=>!p.status).map(p=>({...p,status:'new'}));
    setPlayers(ps=>ps.map(p=>(!p.status)?{...p,status:'new'}:p));
    if(modified.length) sheetsPost(modified);
    setToast({msg:`Статус "new" проставлен (${modified.length} синхр.)`,type:'ok'});
  },[players,setPlayers]);

  const ISSUES=[
    {key:'unk',title:'Пустые / UNKNOWN страны',   desc:'country пустое или "UNKNOWN"',          count:stats.unknownCountry,fix:fixUnknown,   icon:'warning'},
    {key:'zer',title:'Нулевой депозит',            desc:'total_deposit = 0 — информирование',    count:stats.zeroDeposit,   fix:null,         icon:'alert'},
    {key:'dui',title:'Дубли по user_id',           desc:'Оставить с максимальным депозитом',     count:stats.dupIds,        fix:fixDupIds,    icon:'copy'},
    {key:'duw',title:'Дубли по deposit_wallet',    desc:'Пометить связанные → is_linked',        count:stats.dupWallets,    fix:fixDupWallets,icon:'link'},
    {key:'wr1',title:'Withdrawal rate > 1',        desc:'Вывод превышает депозит → needs_review',count:stats.wrOver1,       fix:fixWrOver1,   icon:'trending'},
    {key:'nst',title:'Без статуса',                desc:'Поле status пустое → проставить "new"', count:stats.noStatus,      fix:fixNoStatus,  icon:'zap'},
  ];

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
        <Icon name="broom" size={15} style={{color:'var(--accent)'}}/>
        <span style={{color:'var(--text2)',fontSize:14}}>Автосканирование · Записей: <span style={{color:'var(--accent)',fontWeight:600,fontFamily:'Geist Mono,monospace'}}>{players.length}</span></span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {ISSUES.map(iss=>{
          const ok=iss.count===0;
          return(
            <div key={iss.key} className="card" style={{display:'flex',alignItems:'center',gap:16,borderColor:ok?'var(--border)':'rgba(248,113,113,.2)'}}>
              <div style={{width:38,height:38,borderRadius:10,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:ok?'rgba(52,211,153,.08)':'rgba(248,113,113,.08)'}}>
                <Icon name={ok?'check':iss.icon} size={16} style={{color:ok?'var(--green)':'var(--red)'}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
                  <span style={{fontSize:12,fontWeight:700,fontFamily:'Geist Mono,monospace',color:ok?'var(--green)':'var(--red)'}}>{ok?'Чисто':iss.count+' проблем'}</span>
                  <span style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{iss.title}</span>
                </div>
                <span style={{fontSize:12,color:'var(--text3)'}}>{iss.desc}</span>
              </div>
              {!ok&&iss.fix&&<button className="btn btn-ghost" style={{flexShrink:0,color:'var(--accent)',borderColor:'var(--accentbdr)'}} onClick={iss.fix}><Icon name="wrench" size={13}/>Исправить</button>}
              {!ok&&!iss.fix&&<span style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',flexShrink:0}}>только инфо</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════

      <div className="access-icon"><Icon name="lock" size={24} style={{color:'var(--red)'}}/></div>

/* ═══════════════════════════════════════════
   AUTH SCREEN
═══════════════════════════════════════════ */
function AuthScreen({onAuth}){
  const [error,setError]=useState('');
  const btnRef=useRef(null);
  const [theme,toggleTheme]=useTheme();
  useEffect(()=>{
    const init=()=>{
      if(!window.google) return;
      window.google.accounts.id.initialize({
        client_id:CFG.GOOGLE_CLIENT_ID,
        callback:resp=>{
          try{
            const pl=JSON.parse(atob(resp.credential.split('.')[1]));
            if(!pl.email.endsWith('@'+CFG.ALLOWED_DOMAIN)){setError(`Доступ только для @${CFG.ALLOWED_DOMAIN}`);return;}
            onAuth({email:pl.email,name:pl.name,picture:pl.picture});
          }catch{setError('Ошибка авторизации');}
        },
      });
      if(btnRef.current){
        window.google.accounts.id.renderButton(btnRef.current,{theme:'filled_black',size:'large',text:'signin_with',shape:'rectangular',locale:'ru'});
      }
    };
    if(window.google){init();return;}
    const interval=setInterval(()=>{if(window.google){clearInterval(interval);init();}},150);
    return()=>clearInterval(interval);
  },[]);
  return(
    <div className="auth-wrap">
      <div style={{position:'absolute',top:16,right:16}}>
        <div className="theme-toggle">
          <button className={`theme-opt ${theme==='light'?'active':''}`} onClick={()=>toggleTheme('light')}><Icon name="sun" size={13}/>Светлая</button>
          <button className={`theme-opt ${theme==='dark'?'active':''}`} onClick={()=>toggleTheme('dark')}><Icon name="moon" size={13}/>Тёмная</button>
        </div>
      </div>
      <div className="auth-card">
        <div style={{width:52,height:52,borderRadius:14,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}>
          <Icon name="database" size={24} style={{color:'var(--accent)'}}/>
        </div>
        <h1 style={{fontSize:22,fontWeight:700,marginBottom:6}}>Player<span style={{color:'var(--accent)'}}>Analytics</span></h1>
        <p style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace',marginBottom:24}}>eyeconweb.com · internal tool</p>
        <p style={{fontSize:13,color:'var(--text2)',marginBottom:20}}>Войдите с корпоративной почтой<br/><span style={{color:'var(--accent)',fontFamily:'Geist Mono,monospace',fontSize:12}}>@{CFG.ALLOWED_DOMAIN}</span></p>
        <div ref={btnRef} style={{display:'flex',justifyContent:'center',marginBottom:16}}/>
        {error&&(<div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--red)',background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',borderRadius:8,padding:'10px 14px',marginTop:8}}><Icon name="warning" size={14}/>{error}</div>)}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════ */
const TABS = [
  {key:'base',      icon:'database',  label:'База игроков'},
  {key:'groups',    icon:'users',     label:'Группы'},
  {key:'lookalike', icon:'search',    label:'Look-alike'},
  {key:'analytics', icon:'chart',     label:'Аналитика',  adminOnly:true},
  {key:'cleanup',   icon:'broom',     label:'Очистка',    adminOnly:true},
];

/* ═══════════════════════════════════════════
   ERROR BOUNDARY
═══════════════════════════════════════════ */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e}; }
  componentDidCatch(e,info){ console.error('React Error:', e, info); }
  render(){
    if(this.state.err){
      return(
        <div style={{padding:40,textAlign:'center',fontFamily:'Geist Mono,monospace'}}>
          <div style={{fontSize:22,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:13,color:'var(--red)',marginBottom:16,fontWeight:600}}>Ошибка рендеринга</div>
          <div style={{fontSize:11,color:'var(--text3)',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'12px 16px',textAlign:'left',maxWidth:600,margin:'0 auto 16px',wordBreak:'break-all'}}>
            {String(this.state.err)}
          </div>
          <button className="btn btn-ghost" onClick={()=>this.setState({err:null})}>Попробовать снова</button>
        </div>
      );
    }
    return this.props.children;
  }
}


function App(){
  const [user,setUser]         = useState(()=>loadSession());
  const [players,setPlayers]   = useState([]);
  const [groups,setGroups]     = useState([]);
  const [comments,setComments] = useState([]);
  const [loading,setLoading]   = useState(false);
  const [tab,setTab]           = useState(0);
  const [theme,toggleTheme]    = useTheme();

  const doAuth = user=>{ saveSession(user); setUser(user); };
  const doLogout = ()=>{ clearSession(); setUser(null); setPlayers([]); setGroups([]); setComments([]); };

  useEffect(()=>{
    if(!user) return;
    setLoading(true);
    Promise.all([sheetsGet(), sheetsGetGroups(), sheetsGetComments()])
      .then(([p,g,c])=>{
        if(p.length) setPlayers(p);
        setGroups(g);
        setComments(c);
        setLoading(false);
      });
  },[user]);

  // Update a single player (optimistic + API)
  const onUpdatePlayer = useCallback(async (updated) => {
    setPlayers(prev=>prev.map(p=>p.user_id===updated.user_id?updated:p));
    await sheetsUpdatePlayer(updated);
  },[]);

  // Add a comment event
  const onAddComment = useCallback(async (userId, {type,text,contact_method}) => {
    const now = new Date().toISOString();
    const newComment = {
      comment_id: genCommentId(comments),
      user_id: String(userId),
      type, text, contact_method: contact_method||'',
      author: user?.email||'',
      created_at: now,
    };
    setComments(prev=>[...prev, newComment]);
    await sheetsSaveComment(newComment);
  },[user, comments]);

  const onDeleteComment = useCallback(async (commentId) => {
    setComments(prev=>prev.filter(c=>c.comment_id!==commentId));
    await sheetsDeleteComment(commentId);
  },[]);

  const onEditComment = useCallback(async (updatedComment) => {
    setComments(prev=>prev.map(c=>c.comment_id===updatedComment.comment_id?updatedComment:c));
    await sheetsUpdateComment(updatedComment);
  },[]);

  if(!user) return <ErrorBoundary><AuthScreen onAuth={doAuth}/></ErrorBoundary>;
  const admin = isAdmin(user.email);

  // Lazy: только активная вкладка — ошибка в одной вкладке не убивает страницу
  const renderTabs = () => {
    if (tab===0) return <PlayerBase players={players} setPlayers={setPlayers} loading={loading} userEmail={user.email} groups={groups} comments={comments} onUpdatePlayer={onUpdatePlayer} onAddComment={onAddComment} onDeleteComment={onDeleteComment} onEditComment={onEditComment}/>;
    if (tab===1) return <GroupsTab players={players} groups={groups} setGroups={setGroups} comments={comments} setComments={setComments} userEmail={user.email} setPlayers={setPlayers} loading={loading} onUpdatePlayer={onUpdatePlayer} onAddComment={onAddComment} onDeleteComment={onDeleteComment} onEditComment={onEditComment}/>;
    if (tab===2) return <LookAlike players={players} groups={groups} comments={comments} userEmail={user.email} onUpdatePlayer={onUpdatePlayer} onAddComment={onAddComment} onDeleteComment={onDeleteComment} onEditComment={onEditComment} setTab={setTab}/>;
    if (tab===3) return admin ? <Analytics players={players}/> : <AccessDenied/>;
    if (tab===4) return admin ? <DataCleanup players={players} setPlayers={setPlayers}/> : <AccessDenied/>;
    return null;
  };

  return(
    <div>
      <header className="app-header">
        <div className="header-inner">
          <div className="top-bar">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:30,height:30,borderRadius:8,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icon name="database" size={15} style={{color:'var(--accent)'}}/>
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:15,lineHeight:1.1}}>Player<span style={{color:'var(--accent)'}}>Analytics</span></div>
                <div style={{fontSize:10,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>eyeconweb.com</div>
              </div>
            </div>
            <div style={{flex:1}}/>
            <a href={CFG.ANTIFRAUD_URL} target="_blank" rel="noopener" className="btn btn-ghost" style={{textDecoration:'none',fontSize:12}}>
              <Icon name="shield" size={13} style={{color:'var(--accent)'}}/>Антифрод помощник
              <Icon name="externalLink" size={11} style={{color:'var(--text3)'}}/>
            </a>
            <div className="theme-toggle">
              <button className={`theme-opt ${theme==='light'?'active':''}`} onClick={()=>toggleTheme('light')}><Icon name="sun" size={12}/></button>
              <button className={`theme-opt ${theme==='dark'?'active':''}`} onClick={()=>toggleTheme('dark')}><Icon name="moon" size={12}/></button>
            </div>
            {admin&&(
              <span className="badge" style={{background:'var(--accentbg)',border:'1px solid var(--accentbdr)',color:'var(--accent)',fontSize:11}}>
                <Icon name="shield" size={11}/>admin
              </span>
            )}
            <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:20,padding:'5px 12px 5px 6px'}}>
              {user.picture&&<img src={user.picture} style={{width:22,height:22,borderRadius:'50%'}} alt=""/>}
              <span style={{fontSize:12,color:'var(--text2)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.email}</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',animation:'pulse 2s infinite'}}/>
              <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text3)'}}>{players.length}</span>
            </div>
            <button className="btn btn-ghost" style={{padding:'6px 8px'}} onClick={doLogout} title="Выйти">
              <Icon name="logout" size={14}/>
            </button>
          </div>
          <div className="tab-bar">
            {TABS.map((t,i)=>{
              const locked=t.adminOnly&&!admin;
              return(
                <button key={i} className={`tab-btn ${tab===i?'active':''} ${locked?'locked':''}`}
                  onClick={()=>!locked&&setTab(i)}>
                  <Icon name={t.icon} size={14}/>{t.label}
                  {locked&&<Icon name="lock" size={11} style={{color:'var(--text3)',marginLeft:2}}/>}
                  {t.key==='groups'&&groups.length>0&&(
                    <span style={{background:'var(--accentbg)',color:'var(--accent)',fontSize:10,fontFamily:'Geist Mono,monospace',padding:'0 5px',borderRadius:4,border:'1px solid var(--accentbdr)'}}>{groups.length}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      </header>
      <main className="main"><ErrorBoundary>{renderTabs()}</ErrorBoundary></main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

              <input key={f.key} className="input" placeholder={f.label} type={f.type==='number'?'number':'text'}
                value={np[f.key]||''} onChange={e=>setNp(p=>({...p,[f.key]:e.target.value}))}/>
            ))}
          </div>
          <div style={{display:'flex',gap:8'}}>
            <button className="btn btn-primary" onClick={addP} disabled={!np.user_id}><Icon name="plus" size={13}/>Добавить</button>
            <button className="btn btn-ghost" onClick={()=>{setShowAdd(false);setNp({});}}>Отмена</button>
          </div>
        </div>
      )}

      {/* Table */}
      {loading?(
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,gap:8,color:'var(--text3)'}}>
          <span className="spin">⟳</span><span>Загрузка данных...</span>
        </div>
      ):(
        <div className="tbl-wrap">
          <table className="tbl">
            <thead>
              <tr>
                {COLS.map(c=>(
                  <th key={c.key} onClick={()=>toggleSort(c.key)}>
                    {c.label}<SortIcon col={c.key} sort={sort}/>
                  </th>
                ))}
                <th>Действия</th>
              </tr>
            </thead>
            <tbody>
              {!filtered.length?(
                <tr><td colSpan={COLS.length+1} style={{textAlign:'center',padding:'50px 20px',color:'var(--text3)'}}>
                  {hasF?'Нет результатов по выбранным фильтрам':'Нет данных. Импортируйте или добавьте игроков.'}
                </td></tr>
              ):filtered.map((p,i)=>(
                <tr key={p.user_id+i}>
                  {/* User ID — click to open drawer */}
                  <td>
                    <button onClick={()=>setDrawer(p)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--accent)',fontFamily:'Geist Mono,monospace',fontSize:12,fontWeight:500,padding:0,textDecoration:'underline',textDecorationStyle:'dotted',textDecorationColor:'rgba(56,189,248,.4)'}}>
                      {p.user_id}
                    </button>
                  </td>
                  {/* Status */}
                  <td><StatusBadge status={p.status||'new'}/></td>
                  {/* Retention */}
                  <td>{p.retention_type&&p.retention_type!=='none'
                    ?<RetentionBadge type={p.retention_type}/>
                    :<span style={{color:'var(--text3)',fontSize:11}}>—</span>}
                  </td>
                  {/* Group */}
                  <td>{p.group_id
                    ?<GroupBadge groupId={p.group_id} groups={groups}/>
                    :<span style={{color:'var(--text3)',fontSize:11}}>—</span>}
                  </td>
                  <td style={{color:'var(--text2)'}}>{p.payment_method||'—'}</td>
                  <td style={{color:'var(--green)',fontWeight:500}}>{fmt(p.total_deposit)}</td>
                  <td style={{color:'var(--red)',fontWeight:500}}>{fmt(p.total_withdrawal)}</td>
                  <td style={{color:netColor(p.net_balance),fontWeight:500}}>{fmt(p.net_balance)}</td>
                  <td style={{color:'var(--text2)'}}>{p.currency||'—'}</td>
                  <td><Tags value={p.country} color="var(--accent)"/></td>
                  <td><Tags value={p.asn} color="var(--violet)"/></td>
                  <td>
                    {p.device&&(
                      <span className="tag" style={devStyle(p.device)}>{devCat(p.device)||p.device}</span>
                    )}
                  </td>
                  <td style={{color:'var(--text3)'}}>{fmtDate(p.created_at)}</td>
                  {/* Actions */}
                  <td>
                    <div style={{display:'flex',gap:4}}>
                      <button className="btn btn-ghost" style={{padding:'3px 7px',fontSize:11}} onClick={()=>setDrawer(p)} title="Открыть карточку">
                        <Icon name="eye" size={11}/>
                      </button>
                      <button className="btn btn-amber" style={{padding:'3px 7px',fontSize:11}} onClick={()=>setRetModal(p)} title="Удержание">
                        <Icon name="scissors" size={11}/>
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 2 — LOOK-ALIKE
═══════════════════════════════════════════ */
function LookAlike({players}){
  const derived = useMemo(()=>players.map(derive),[players]);
  const allCountries = useMemo(()=>{
    const cnt={};derived.flatMap(p=>splitVal(p.country)).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([v])=>v);
  },[derived]);
  const allAsns = useMemo(()=>{
    const cnt={};derived.flatMap(p=>splitVal(p.asn)).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([v])=>v);
  },[derived]);
  const allMethods    = useMemo(()=>[...new Set(derived.map(p=>p.payment_method).filter(Boolean))].sort(),[derived]);
  const allCurrencies = useMemo(()=>[...new Set(derived.map(p=>p.currency).filter(Boolean))].sort(),[derived]);
  const DEV_CATS = ['Mobile','Desktop','Tablet'];

  const EMPTY = {country:'',asn:'',payment_method:'',device:'',currency:'',min_deposit:'',max_deposit:''};
  const [filters,setFilters] = useState(EMPTY);
  const [results,setResults] = useState([]);
  const [ran,setRan] = useState(false);
  const ff = (k,v) => setFilters(f=>({...f,[k]:v}));
  const hasF = Object.values(filters).some(Boolean);

  const run = () => {
    const active = Object.entries(filters).filter(([,v])=>v);
    if(!active.length){ setResults([]); setRan(true); return; }
    const W = {country:2.5,asn:2.5,payment_method:2,currency:2,device:1.5,min_deposit:1,max_deposit:1};
    const totalW = active.reduce((s,[k])=>s+(W[k]||1),0);
    const score = p => {
      let earned=0;
      active.forEach(([k,v])=>{
        const w=W[k]||1;
        if(k==='country'){if(hasVal(p.country,v))earned+=w;}
        else if(k==='asn'){if(hasVal(p.asn,v))earned+=w;}
        else if(k==='payment_method'){if(p.payment_method?.toLowerCase().includes(v.toLowerCase()))earned+=w;}
        else if(k==='device'){if(devCat(p.device)===v)earned+=w;}
        else if(k==='currency'){if(p.currency===v)earned+=w;}
        else if(k==='min_deposit'){const min=Number(v);earned+=min>0?w*Math.min(1,p.total_deposit/min):w;}
        else if(k==='max_deposit'){const max=Number(v);earned+=max>0?w*(p.total_deposit<=max?1:Math.max(0,1-(p.total_deposit-max)/max)):w;}
      });
      return totalW>0?earned/totalW:0;
    };
    const res=derived.map(p=>({...p,similarity_score:score(p)})).filter(p=>p.similarity_score>0).sort((a,b)=>b.similarity_score-a.similarity_score).slice(0,20);
    setResults(res); setRan(true);
  };

  return(
    <div className="fade-in">
      <div className="card" style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <Icon name="filter" size={15} style={{color:'var(--accent)'}}/>
            <span style={{fontWeight:600,fontSize:15}}>Фильтр похожих аккаунтов</span>
          </div>
          {hasF&&<button className="btn btn-danger" onClick={()=>setFilters(EMPTY)}><Icon name="xCircle" size={13}/>Очистить</button>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:14}}>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Страна</label>
            <input className="input" list="la-cnt" placeholder="все или выберите…" value={filters.country} onChange={e=>ff('country',e.target.value)}/>
            <datalist id="la-cnt">{allCountries.map(c=><option key={c} value={c}/>)}</datalist>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>ASN</label>
            <input className="input" list="la-asn" placeholder="все или введите…" value={filters.asn} onChange={e=>ff('asn',e.target.value)}/>
            <datalist id="la-asn">{allAsns.map(a=><option key={a} value={a}/>)}</datalist>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Метод оплаты</label>
            <input className="input" list="la-mth" placeholder="все или выберите…" value={filters.payment_method} onChange={e=>ff('payment_method',e.target.value)}/>
            <datalist id="la-mth">{allMethods.map(m=><option key={m} value={m}/>)}</datalist>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Устройство</label>
            <select className="input" value={filters.device} onChange={e=>ff('device',e.target.value)}>
              <option value="">Все устройства</option>
              {DEV_CATS.map(d=><option key={d}>{d}</option>)}
            </select>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Валюта</label>
            <select className="input" value={filters.currency} onChange={e=>ff('currency',e.target.value)}>
              <option value="">Все валюты</option>
              {allCurrencies.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,color:'var(--text3)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.05em'}}>Депозит (от / до)</label>
            <div style={{display:'flex',gap:8}}>
              <input type="number" className="input" placeholder="от" value={filters.min_deposit} onChange={e=>ff('min_deposit',e.target.value)}/>
              <input type="number" className="input" placeholder="до" value={filters.max_deposit} onChange={e=>ff('max_deposit',e.target.value)}/>
            </div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,marginTop:18,paddingTop:16,borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-primary" onClick={run} disabled={!players.length}>
            <Icon name="search" size={14}/>Найти похожих
          </button>
          {ran&&<span style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>Найдено: {results.length}</span>}
        </div>
      </div>

      {ran&&(
        <div className="tbl-wrap fade-in">
          <table className="tbl">
            <thead><tr>
              {['#','User ID','Схожесть','Статус','Страна','ASN','Устройство','Депозит','Net','Валюта','Метод'].map(h=><th key={h}>{h}</th>)}
            </tr></thead>
            <tbody>
              {!results.length?(
                <tr><td colSpan={11} style={{textAlign:'center',padding:'50px 20px',color:'var(--text3)'}}>Нет результатов по заданным фильтрам</td></tr>
              ):results.map((p,i)=>{
                const sc=Math.max(0,Math.min(1,p.similarity_score));
                const col=simColor(sc);
                return(
                  <tr key={p.user_id+i}>
                    <td style={{color:'var(--text3)'}}>{i+1}</td>
                    <td style={{color:'var(--accent)',fontWeight:500}}>{p.user_id}</td>
                    <td style={{minWidth:160}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div className="sim-track"><div className="sim-fill" style={{width:`${(sc*100).toFixed(0)}%`,background:col}}/></div>
                        <span style={{color:col,fontSize:11,fontFamily:'Geist Mono,monospace',minWidth:34,textAlign:'right'}}>{(sc*100).toFixed(0)}%</span>
                      </div>
                    </td>
                    <td><StatusBadge status={p.status||'new'}/></td>
                    <td><Tags value={p.country} color="var(--accent)"/></td>
                    <td><Tags value={p.asn} color="var(--violet)"/></td>
                    <td>{p.device||'—'}</td>
                    <td style={{color:'var(--green)',fontWeight:500}}>{fmt(p.total_deposit)}</td>
                    <td style={{color:netColor(p.net_balance),fontWeight:500}}>{fmt(p.net_balance)}</td>
                    <td>{p.currency||'—'}</td>
                    <td>{p.payment_method||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 3 — ANALYTICS (admin)
═══════════════════════════════════════════ */
function Analytics({players}){
  const derived = useMemo(()=>players.map(derive),[players]);

  const kpis = useMemo(()=>({
    total:    derived.length,
    totalDep: derived.reduce((s,p)=>s+p.total_deposit,0),
    totalWit: derived.reduce((s,p)=>s+p.total_withdrawal,0),
    netTotal: derived.reduce((s,p)=>s+p.net_balance,0),
    avgWR:    derived.length?derived.reduce((s,p)=>s+p.withdrawal_rate,0)/derived.length:0,
    highRisk: derived.filter(p=>p.withdrawal_rate>0.9).length,
    confirmed:derived.filter(p=>p.status==='confirmed').length,
    retained: derived.filter(p=>p.retention_type&&p.retention_type!=='none').length,
  }),[derived]);

  const countryData = useMemo(()=>{
    const cnt={};
    derived.flatMap(p=>splitVal(p.country)).forEach(c=>{if(c)cnt[c]=(cnt[c]||0)+1;});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return {labels:top.map(([k])=>k),datasets:[{data:top.map(([,v])=>v),backgroundColor:'#38bdf8',borderRadius:4,borderColor:'transparent'}]};
  },[derived]);

  const devData = useMemo(()=>{
    const cats={Mobile:0,Desktop:0,Tablet:0,Other:0};
    derived.forEach(p=>{const c=devCat(p.device);cats[cats[c]!==undefined?c:'Other']++;});
    return {labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#38bdf8','#a78bfa','#fbbf24','#4b6080'],borderWidth:0}]};
  },[derived]);

  const methodData = useMemo(()=>{
    const cnt={};derived.forEach(p=>{if(p.payment_method)cnt[p.payment_method]=(cnt[p.payment_method]||0)+1;});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return {labels:top.map(([k])=>k),datasets:[{data:top.map(([,v])=>v),backgroundColor:'#a78bfa',borderRadius:4,borderColor:'transparent'}]};
  },[derived]);

  const topAsns = useMemo(()=>{
    const cnt={};derived.flatMap(p=>splitVal(p.asn)).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1;});
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  },[derived]);

  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
      {/* KPI row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12}}>
        {[
          {label:'Игроков',     value:fmtI(kpis.total),     color:'var(--accent)'},
          {label:'Депозиты',    value:fmt(kpis.totalDep,0),  color:'var(--green)'},
          {label:'Выводы',      value:fmt(kpis.totalWit,0),  color:'var(--red)'},
          {label:'Net',         value:fmt(kpis.netTotal,0),  color:netColor(kpis.netTotal)},
          {label:'Ср. WR',      value:(kpis.avgWR*100).toFixed(1)+'%', color:wrColor(kpis.avgWR)},
          {label:'WR > 90%',    value:kpis.highRisk,         color:'var(--red)'},
          {label:'Подтверждено',value:kpis.confirmed,        color:'var(--red)'},
          {label:'Удержаний',   value:kpis.retained,         color:'var(--amber)'},
        ].map(k=>(
          <div key={k.label} className="card-sm kpi">
            <span className="kpi-label">{k.label}</span>
            <span className="kpi-value" style={{color:k.color,fontSize:20}}>{k.value}</span>
          </div>
        ))}
      </div>

      {/* Top ASNs */}
      <div className="card">
        <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Топ-10 ASN</p>
        {topAsns.map(([asn,cnt],i)=>{
          const pct=cnt/derived.length;
          return(
            <div key={i} className="bar-row">
              <span className="bar-name" style={{fontFamily:'Geist Mono',minWidth:120}}>{asn}</span>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(pct*100).toFixed(1)}%`,background:'var(--violet)'}}/></div>
              <span className="bar-label">{cnt}</span>
            </div>
          );
        })}
      </div>

      {/* Charts */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card">
          <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Топ-8 стран</p>
          <ChartCanvas data={countryData} type="bar" color="var(--accent)"/>
        </div>
        <div className="card">
          <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Устройства</p>
          <ChartCanvas data={devData} type="doughnut"/>
        </div>
        <div className="card">
          <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:14}}>Методы оплаты</p>
          <ChartCanvas data={methodData} type="bar" color="var(--violet)"/>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   TAB 4 — CLEANUP (admin)
═══════════════════════════════════════════ */
function DataCleanup({players,setPlayers}){
  const [toast,setToast] = useState(null);
  const derived = useMemo(()=>players.map(derive),[players]);

  const stats = useMemo(()=>{
    const idC={},wC={};
    derived.forEach(p=>{
      idC[p.user_id]=(idC[p.user_id]||0)+1;
      if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;
    });
    return {
      unknownCountry: derived.filter(p=>!p.country||p.country.toUpperCase()==='UNKNOWN').length,
      zeroDeposit:    derived.filter(p=>p.total_deposit===0).length,
      dupIds:         Object.values(idC).filter(v=>v>1).length,
      dupWallets:     Object.values(wC).filter(v=>v>1).length,
      wrOver1:        derived.filter(p=>p.withdrawal_rate>1).length,
      noStatus:       derived.filter(p=>!p.status).length,
    };
  },[derived]);

  const fixUnknown   = useCallback(()=>{ setPlayers(ps=>ps.map(p=>(!p.country||p.country.toUpperCase()==='UNKNOWN')?{...p,country:'UNKNOWN'}:p)); setToast({msg:'Пустые страны заменены на UNKNOWN',type:'ok'}); },[setPlayers]);
  const fixDupIds    = useCallback(()=>{ const m=new Map(); for(const p of players){const ex=m.get(p.user_id);if(!ex||p.total_deposit>ex.total_deposit)m.set(p.user_id,p);} setPlayers([...m.values()]); setToast({msg:'Дубли по user_id удалены',type:'ok'}); },[players,setPlayers]);
  const fixDupWallets= useCallback(()=>{ const wC={}; players.forEach(p=>{if(p.deposit_wallet)wC[p.deposit_wallet]=(wC[p.deposit_wallet]||0)+1;}); const dups=new Set(Object.entries(wC).filter(([,v])=>v>1).map(([k])=>k)); setPlayers(ps=>ps.map(p=>(p.deposit_wallet&&dups.has(p.deposit_wallet))?{...p,is_linked:true}:p)); setToast({msg:'Флаг is_linked проставлен',type:'ok'}); },[players,setPlayers]);
  const fixWrOver1   = useCallback(()=>{ setPlayers(ps=>ps.map(p=>{const wr=p.total_deposit>0?p.total_withdrawal/p.total_deposit:0;return wr>1?{...p,status:'under_review'}:p;})); setToast({msg:'Статус under_review проставлен для WR>1',type:'ok'}); },[setPlayers]);
  const fixNoStatus  = useCallback(()=>{ setPlayers(ps=>ps.map(p=>!p.status?{...p,status:'new'}:p)); setToast({msg:'Статус "new" проставлен',type:'ok'}); },[setPlayers]);

  const ISSUES=[
    {key:'unk', title:'Пустые / UNKNOWN страны',   desc:'country пустое или "UNKNOWN"',               count:stats.unknownCountry, fix:fixUnknown,   icon:'warning'},
    {key:'zer', title:'Нулевой депозит',            desc:'total_deposit = 0 — только информирование',  count:stats.zeroDeposit,   fix:null,         icon:'alert'},
    {key:'dui', title:'Дубли по user_id',           desc:'Оставить с максимальным депозитом',           count:stats.dupIds,        fix:fixDupIds,    icon:'copy'},
    {key:'duw', title:'Дубли по deposit_wallet',    desc:'Пометить связанные аккаунты → is_linked',    count:stats.dupWallets,    fix:fixDupWallets,icon:'link'},
    {key:'wr1', title:'Withdrawal rate > 1',        desc:'Вывод превышает депозит → under_review',     count:stats.wrOver1,       fix:fixWrOver1,   icon:'trending'},
    {key:'nos', title:'Без статуса',                desc:'Игроки без поля status → проставить "new"',  count:stats.noStatus,      fix:fixNoStatus,  icon:'userCheck'},
  ];

  return(
    <div className="fade-in">
      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
        <Icon name="broom" size={15} style={{color:'var(--accent)'}}/>
        <span style={{color:'var(--text2)',fontSize:14}}>Автосканирование · Игроков: <span style={{color:'var(--accent)',fontWeight:600,fontFamily:'Geist Mono,monospace'}}>{players.length}</span></span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {ISSUES.map(iss=>{
          const ok = iss.count===0;
          return(
            <div key={iss.key} className="card" style={{display:'flex',alignItems:'center',gap:16,borderColor:ok?'var(--border)':'rgba(248,113,113,.2)'}}>
              <div style={{width:38,height:38,borderRadius:10,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:ok?'rgba(52,211,153,.08)':'rgba(248,113,113,.08)'}}>
                <Icon name={ok?'check':iss.icon} size={16} style={{color:ok?'var(--green)':'var(--red)'}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
                  <span style={{fontSize:12,fontWeight:700,fontFamily:'Geist Mono,monospace',color:ok?'var(--green)':'var(--red)'}}>{ok?'Чисто':iss.count+' проблем'}</span>
                  <span style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{iss.title}</span>
                </div>
                <span style={{fontSize:12,color:'var(--text3)'}}>{iss.desc}</span>
              </div>
              {!ok&&iss.fix&&(
                <button className="btn btn-ghost" style={{flexShrink:0,color:'var(--accent)',borderColor:'var(--accentbdr)'}} onClick={iss.fix}>
                  <Icon name="wrench" size={13}/>Исправить
                </button>
              )}
              {!ok&&!iss.fix&&<span style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',flexShrink:0}}>только инфо</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   AUTH SCREEN
═══════════════════════════════════════════ */
function AuthScreen({onAuth}){
  const [error,setError] = useState('');
  const btnRef = useRef(null);
  const [theme,toggleTheme] = useTheme();

  useEffect(()=>{
    const init = () => {
      if(!window.google) return;
      window.google.accounts.id.initialize({
        client_id: CFG.GOOGLE_CLIENT_ID,
        callback: resp => {
          try{
            const pl = JSON.parse(atob(resp.credential.split('.')[1]));
            if(!pl.email.endsWith('@'+CFG.ALLOWED_DOMAIN)){ setError(`Доступ только для @${CFG.ALLOWED_DOMAIN}`); return; }
            onAuth({email:pl.email,name:pl.name,picture:pl.picture});
          }catch{ setError('Ошибка авторизации'); }
        },
      });
      if(btnRef.current){ window.google.accounts.id.renderButton(btnRef.current,{theme:'filled_black',size:'large',text:'signin_with',shape:'rectangular',locale:'ru'}); }
    };
    if(window.google){ init(); return; }
    const interval = setInterval(()=>{ if(window.google){ clearInterval(interval); init(); } },150);
    return()=>clearInterval(interval);
  },[]);

  return(
    <div className="auth-wrap">
      <div style={{position:'absolute',top:16,right:16}}>
        <div className="theme-toggle">
          <button className={`theme-opt ${theme==='light'?'active':''}`} onClick={()=>toggleTheme('light')}><Icon name="sun" size={13}/>Светлая</button>
          <button className={`theme-opt ${theme==='dark'?'active':''}`} onClick={()=>toggleTheme('dark')}><Icon name="moon" size={13}/>Тёмная</button>
        </div>
      </div>
      <div className="auth-card">
        <div style={{width:52,height:52,borderRadius:14,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}>
          <Icon name="database" size={24} style={{color:'var(--accent)'}}/>
        </div>
        <h1 style={{fontSize:22,fontWeight:700,marginBottom:6}}>Player<span style={{color:'var(--accent)'}}>Analytics</span></h1>
        <p style={{fontSize:12,color:'var(--text3)',fontFamily:'Geist Mono,monospace',marginBottom:24}}>eyeconweb.com · internal tool</p>
        <p style={{fontSize:13,color:'var(--text2)',marginBottom:20}}>
          Войдите с корпоративной почтой<br/>
          <span style={{color:'var(--accent)',fontFamily:'Geist Mono,monospace',fontSize:12}}>@{CFG.ALLOWED_DOMAIN}</span>
        </p>
        <div ref={btnRef} style={{display:'flex',justifyContent:'center',marginBottom:16}}/>
        {error&&(
          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--red)',background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',borderRadius:8,padding:'10px 14px',marginTop:8}}>
            <Icon name="warning" size={14}/>{error}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════ */
const TABS = [
  {key:'base',      icon:'database',  label:'База игроков'},
  {key:'lookalike', icon:'search',    label:'Look-alike'},
  {key:'analytics', icon:'chart',     label:'Аналитика',   adminOnly:true},
  {key:'cleanup',   icon:'broom',     label:'Очистка',     adminOnly:true},
];

function App(){
  const [user,setUser]       = useState(()=>loadSession());
  const [players,setPlayers] = useState([]);
  const [loading,setLoading] = useState(false);
  const [tab,setTab]         = useState(0);
  const [theme,toggleTheme]  = useTheme();

  const doAuth = user => {
    saveSession(user);
    setUser(user);
  };
  const doLogout = () => {
    clearSession();
    setUser(null);
    setPlayers([]);
  };

  useEffect(()=>{
    if(!user) return;
    setLoading(true);
    sheetsGet().then(d=>{ if(d.length) setPlayers(d); setLoading(false); });
  },[user]);

  if(!user) return <AuthScreen onAuth={doAuth}/>;

  const admin = isAdmin(user.email);

  const renderTab = () => {
    if(tab===0) return <PlayerBase players={players} setPlayers={setPlayers} loading={loading} userEmail={user.email}/>;
    if(tab===1) return <LookAlike players={players}/>;
    if(tab===2) return admin?<Analytics players={players}/>:<AccessDenied/>;
    if(tab===3) return admin?<DataCleanup players={players} setPlayers={setPlayers}/>:<AccessDenied/>;
  };

  return(
    <div>
      <header className="app-header">
        <div className="header-inner">
          {/* Top bar */}
          <div className="top-bar">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:30,height:30,borderRadius:8,background:'var(--accentbg)',border:'1px solid var(--accentbdr)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icon name="database" size={15} style={{color:'var(--accent)'}}/>
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:15,lineHeight:1.1}}>Player<span style={{color:'var(--accent)'}}>Analytics</span></div>
                <div style={{fontSize:10,color:'var(--text3)',fontFamily:'Geist Mono,monospace'}}>eyeconweb.com</div>
              </div>
            </div>

            <div style={{flex:1}}/>

            {/* Antifraud link */}
            <a href={CFG.ANTIFRAUD_URL} target="_blank" rel="noopener" className="btn btn-ghost" style={{textDecoration:'none',fontSize:12}}>
              <Icon name="shield" size={13} style={{color:'var(--accent)'}}/>Антифрод помощник
              <Icon name="externalLink" size={11} style={{color:'var(--text3)'}}/>
            </a>

            {/* Theme */}
            <div className="theme-toggle">
              <button className={`theme-opt ${theme==='light'?'active':''}`} onClick={()=>toggleTheme('light')}>
                <Icon name="sun" size={12}/>
              </button>
              <button className={`theme-opt ${theme==='dark'?'active':''}`} onClick={()=>toggleTheme('dark')}>
                <Icon name="moon" size={12}/>
              </button>
            </div>

            {/* Admin badge */}
            {admin&&(
              <span className="badge" style={{background:'var(--accentbg)',border:'1px solid var(--accentbdr)',color:'var(--accent)',fontSize:11}}>
                <Icon name="shield" size={11}/>admin
              </span>
            )}

            {/* User */}
            <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:20,padding:'5px 12px 5px 6px'}}>
              {user.picture&&<img src={user.picture} style={{width:22,height:22,borderRadius:'50%'}} alt=""/>}
              <span style={{fontSize:12,color:'var(--text2)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.email}</span>
            </div>

            {/* Players count */}
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',animation:'pulse 2s infinite'}}/>
              <span style={{fontSize:11,fontFamily:'Geist Mono,monospace',color:'var(--text3)'}}>{players.length}</span>
            </div>

            {/* Logout */}
            <button className="btn btn-ghost" style={{padding:'6px 8px'}} onClick={doLogout} title="Выйти">
              <Icon name="logout" size={14}/>
            </button>
          </div>

          {/* Tab bar */}
          <div className="tab-bar">
            {TABS.map((t,i)=>{
              const locked = t.adminOnly&&!admin;
              return(
                <button key={i} className={`tab-btn ${tab===i?'active':''} ${locked?'locked':''}`}
                  onClick={()=>!locked&&setTab(i)}>
                  <Icon name={t.icon} size={14}/>
                  {t.label}
                  {locked&&<Icon name="lock" size={11} style={{color:'var(--text3)',marginLeft:2}}/>}
                </button>
              );
            })}
          </div>
        </div>
      </header>

      <main className="main">
        {renderTab()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
